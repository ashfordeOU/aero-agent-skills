# Hit@1 fragment: e2008-bare-cell-deliverable-components
# (space-systems/ecss, E-ST-20-08C 7.1.2)
# Two tasks per leaf; bcd1 routes on the process document that has to govern
# the build, bcd2 on the inspection modes and the cell-weighted release share.
# Both must deterministically hit
# space-systems/ecss/e2008-bare-cell-deliverable-components.
tasks:
  - id: bcd1
    query: "resolve the bare-cell-process-identification-document-standing for this delivery and flag any bare-cell-undeclared-process-step before the bare-cell-delivery-sub-lot-disposition"
    intent: "ecss photovoltaic assemblies; delivered bare cells processed under the approved process identification document"
    expected_skill: "space-systems/ecss/e2008-bare-cell-deliverable-components"
  - id: bcd2
    query: "separate bare-cell-screen-versus-sample-mode records, bracket the bare-cell-deliverable-count-bracket and report the bare-cell-weighted-release-share"
    intent: "ecss photovoltaic assemblies; how many delivered bare cells the inspection records actually release"
    expected_skill: "space-systems/ecss/e2008-bare-cell-deliverable-components"
