# Hit@1 fragment: e2008-mission-specific-ultraviolet-tests (space-systems/ecss)
# Two tasks for the new leaf. msu1 routes on the equivalent-sun-hours budget a
# near-sun science profile accumulates against the standard qualification
# exposure; msu2 routes on bounding the lamp acceleration and sample
# temperature of the extra run. Both must deterministically hit
# space-systems/ecss/e2008-mission-specific-ultraviolet-tests.
tasks:
  - id: msu1
    query: "work out whether a planetary mission that spends years inside half an astronomical unit collects more equivalent sun hours than the standard ultraviolet qualification exposure already covers"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.15.4; mission-specific ultraviolet exposure budget"
    expected_skill: "space-systems/ecss/e2008-mission-specific-ultraviolet-tests"
  - id: msu2
    query: "bound how hard the ultraviolet lamp may be driven over the mission mean solar intensity and how far the coverglass sample may sit from its flight operating temperature during the accelerated run"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.15.4; accelerated ultraviolet run representativeness"
    expected_skill: "space-systems/ecss/e2008-mission-specific-ultraviolet-tests"
