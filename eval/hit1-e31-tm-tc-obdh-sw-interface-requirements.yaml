# Hit@1 fragment: e31-tm-tc-obdh-sw-interface-requirements (space-systems/ecss)
# Two tasks for the new leaf. tmt1 routes on the temperature knowledge an
# acquisition chain actually delivers and the sampling the item time constant
# needs; tmt2 routes on the software heater loop limits and deadband chatter.
# Both must deterministically hit
# space-systems/ecss/e31-tm-tc-obdh-sw-interface-requirements.
tasks:
  - id: tmt1
    query: "twelve bit converter over a two hundred kelvin span with a half kelvin thermistor, tell me what temperature knowledge that channel really gives me and whether eight seconds is fast enough for the item"
    intent: "ECSS-E-ST-31C clauses 4.3.5 and 4.3.6; quantisation step, root-sum-square channel knowledge, samples per thermal time constant and the telemetry rate it costs"
    expected_skill: "space-systems/ecss/e31-tm-tc-obdh-sw-interface-requirements"
  - id: tmt2
    query: "check the software heater loop settings for the tank, the on and off points against the alarm limits, and whether the gap between them is wide enough that it will not toggle on sensor noise"
    intent: "ECSS-E-ST-31C clauses 4.3.5 and 4.3.6; monitor and setpoint limit ordering, deadband against channel knowledge, predicted cycle period and commanding completeness"
    expected_skill: "space-systems/ecss/e31-tm-tc-obdh-sw-interface-requirements"
