  - id: ode2
    query: "integrate the rate equation for the decaying state with heun-method and rk4 and run a step-size-convergence study to confirm the numerical error against the closed-form solution shrinks as the step size is halved"
    intent: "adversarial: integrate and convergence wording must route to the ODE solvers leaf, not the numerical-integration quadrature leaf or the convergence-verification leaf"
    expected_skill: "cross-cutting/numerics/ode-solvers"
