# Hit@1 wave-14 fragment: ode-solvers (cross-cutting/numerics)
# Two tasks per new leaf skill; ode1 routes on explicit Euler and RK4
# time marching of an initial-value problem against a closed-form
# solution, ode2 is adversarial: "integrate" and "convergence" wording
# must still route to ode-solvers, not numerical-integration or
# convergence-verification. Both must deterministically hit
# cross-cutting/numerics/ode-solvers.
tasks:
  - id: ode1
    query: "solve the ode-solvers initial-value-problem dy/dt = -y with y(0)=1 using explicit-euler and runge-kutta time marching and compare the numerical solution against the closed-form-solution e to the minus t"
    intent: "numerics; explicit Euler and RK4 time marching of an initial-value problem with error comparison against a closed-form solution"
