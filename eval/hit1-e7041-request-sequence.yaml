# Hit@1 fragment: e7041-request-sequence (space-systems/ecss)
# Two tasks for the new leaf. rseq1 routes on whether a named block of
# requests is well formed and fits the on-board store; rseq2 routes on the
# lifecycle and on what a run does when a held request fails. Both must
# deterministically hit space-systems/ecss/e7041-request-sequence.
tasks:
  - id: rseq1
    query: "we want one telecommand to fire a nine-step safing procedure the spacecraft is holding, work out whether that named block of requests is well formed and whether its loaded size fits what the on-board store has free"
    intent: "ECSS-E-ST-70-41C clause 6.21.4; request sequence structure, held order, self-reference refusal and the header-inclusive capacity fit"
    expected_skill: "space-systems/ecss/e7041-request-sequence"
  - id: rseq2
    query: "the fourth request in a held on-board sequence failed halfway through the run, decide what state the sequence ends in, whether the remaining requests go out, and whether the ground can unload it while it is still running"
    intent: "ECSS-E-ST-70-41C clause 6.21.4; the closed absent-loaded-executing lifecycle and the stop-at-first-failure run with the index reported"
    expected_skill: "space-systems/ecss/e7041-request-sequence"
