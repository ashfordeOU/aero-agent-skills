# Hit@1 fragment: e7041-the-ccsds-space-packet-general (space-systems/ecss)
# Two tasks for the new leaf. csp1 routes on the data length field being one less
# than the data field; csp2 routes on the version number being checked before any
# other field. Both must deterministically hit
# space-systems/ecss/e7041-the-ccsds-space-packet-general.
tasks:
  - id: ccsp1
    query: "a stream of octets arrived on the space-to-ground link and the stated packet size does not match how many octets are actually there - work out whether these are CCSDS space packets at all, and where the count and the content disagree"
    intent: "ECSS-E-ST-70-41C clause 7.4.2; the packet data length field of a CCSDS space packet states the octet count of the data field minus one, so the stated total has to be reconciled against the octets actually present"
    expected_skill: "space-systems/ecss/e7041-the-ccsds-space-packet-general"
  - id: ccsp2
    query: "the decoder is reporting a sensible looking process identifier out of a buffer we are not sure is telemetry at all, decide which header field settles whether these octets are the interface container before anything else is read"
    intent: "ECSS-E-ST-70-41C clause 7.4.2; everything crossing the space-to-ground interface is a CCSDS space packet, and the three-bit packet version number is checked first because any other value means the remaining fields are a coincidence"
    expected_skill: "space-systems/ecss/e7041-the-ccsds-space-packet-general"
