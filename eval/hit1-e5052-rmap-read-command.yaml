# Hit@1 fragment: e5052-rmap-read-command (space-systems/ecss)
# Two tasks for the new leaf. rc1 routes on the asymmetric sizing of a fetch and
# the answer it provokes; rc2 routes on the walk-or-stay flag against the kind of
# location addressed. Both must deterministically hit
# space-systems/ecss/e5052-rmap-read-command.
tasks:
  - id: rc1
    query: "size both halves of an rmap read over spacewire: the command, its padded reply path, no payload at all, then the reply header, its returned data bytes and the check byte, and what share of the link traffic is the four bytes I wanted"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.4; the fetch carries no payload while the answer does, so the two halves size differently and overhead dominates a short fetch"
    expected_skill: "space-systems/ecss/e5052-rmap-read-command"
  - id: rc2
    query: "our rmap read leaves the increment bit on, but the address it targets is a single port-style queue register rather than a memory region, so grade that option set and tell me what the address span actually walks across"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.4; the increment flag belongs to a memory region, so an incrementing read aimed at a port-style register walks the address span off the register"
    expected_skill: "space-systems/ecss/e5052-rmap-read-command"
