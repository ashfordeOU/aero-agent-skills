# Hit@1 fragment: q7080-build-setup-and-execution (space-systems/ecss)
# Two tasks for the new leaf. bse1 routes on the start-up gate and the blank
# check that blocks it; bse2 routes on the consecutive-layer excursion run and
# the disposition that follows. Both must deterministically hit
# space-systems/ecss/q7080-build-setup-and-execution.
tasks:
