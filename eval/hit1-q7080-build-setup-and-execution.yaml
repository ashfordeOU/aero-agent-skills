    query: "the operator logged preheat and oxygen before the build but left platform flatness blank, can this job start or does that blank stop it"
    intent: "ECSS-Q-ST-70-80 process clause; start-up checks gate the first layer and an unrecorded check blocks exactly as an out-of-limit one does"
