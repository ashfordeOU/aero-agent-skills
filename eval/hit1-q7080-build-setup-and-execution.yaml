  - id: bse2
    query: "the oxygen trace went over the band for a few layers in the middle of this build, work out whether we abort it or take it with a concession"
    intent: "ECSS-Q-ST-70-80 process clause; in-process monitoring, run of consecutive layers in excursion versus isolated layers, build disposition"
    expected_skill: "space-systems/ecss/q7080-build-setup-and-execution"
