# Hit@1 fragment: q6013-class-2-radiation-verification-testing (space-systems/ecss)
# Two tasks for the leaf. rv21 routes on the heritage similarity credit and the
# penalty it carries; rv22 routes on the low dose rate refusal, the worst-case
# heritage reduction and the four-way disposition. Both must deterministically
# hit space-systems/ecss/q6013-class-2-radiation-verification-testing.
tasks:
  - id: rv21
    query: "decide whether heritage data from a similar lot may stand in for an irradiation of the procured flight lot at the intermediate assurance class, and what penalty the credited heritage adds on top of the radiation design margin"
    intent: "ECSS-Q-ST-60-13C clause 5.3.8; class 2 heritage similarity credit and the penalised dose requirement"
    expected_skill: "space-systems/ecss/q6013-class-2-radiation-verification-testing"
  - id: rv22
    query: "A commercial bipolar part at class 2 accumulates its mission dose very slowly, and all I hold is a fast-beam run on three sibling lots with nothing at low dose rate. Does the heritage credit stand, or do I irradiate the procured lot?"
    intent: "ECSS-Q-ST-60-13C clause 5.3.8; low dose rate refusal, worst-case heritage capability and the four-way disposition"
    expected_skill: "space-systems/ecss/q6013-class-2-radiation-verification-testing"
