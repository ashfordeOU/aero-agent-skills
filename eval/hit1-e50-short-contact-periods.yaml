# Hit@1 fragment: e50-short-contact-periods (space-systems/ecss)
# Two tasks for the new leaf. scp1 routes on acquisition and setup eating a
# short contact period; scp2 routes on the backlog walk across the contact
# plan. Both must deterministically hit
# space-systems/ecss/e50-short-contact-periods.
tasks:
  - id: scp1
    query: "our ground station passes are four minutes and link acquisition and setup take ninety seconds of that; work out what a short contact period is really worth once the coding rate and framing efficiency are paid"
    intent: "ECSS-E-ST-50C Rev.2 clause 5.6.3; usable transfer time of a short contact and the deliverable volume it supports"
    expected_skill: "space-systems/ecss/e50-short-contact-periods"
  - id: scp2
    query: "walk the pass schedule and tell me whether the recorder ever empties or whether we are just filling it faster than the downlink drains it and dropping data"
    intent: "ECSS-E-ST-50C Rev.2 clause 5.6.3; onboard store backlog accumulated between contacts, drained during them, and clamped at capacity"
    expected_skill: "space-systems/ecss/e50-short-contact-periods"
