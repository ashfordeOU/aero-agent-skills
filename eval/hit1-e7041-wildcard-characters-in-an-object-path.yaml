# Hit@1 fragment: e7041-wildcard-characters-in-an-object-path
# (space-systems/ecss). wcpath1 routes on how far a wildcard component reaches
# inside an object path; wcpath2 routes on a delete whose path expands to more
# than one object. Both must deterministically hit
# space-systems/ecss/e7041-wildcard-characters-in-an-object-path.
tasks:
  - id: wcpath1
    query: "in our on board file management requests can the wildcard in an object path reach into subdirectories, and should a component like hk star be accepted as a partial match on the file name"
    intent: "ECSS-E-ST-70-41C clause 6.23.3.3; the wildcard is a whole path component, never spans the separator, and a component mixing the wildcard with literals is malformed"
    expected_skill: "space-systems/ecss/e7041-wildcard-characters-in-an-object-path"
  - id: wcpath2
    query: "an operator sent a delete with a wildcard in the object path and it expanded to four files on board; work out whether that request should have been accepted and what the expansion rule is for a single object operation"
    intent: "ECSS-E-ST-70-41C clause 6.23.3.3; object path expansion over the objects on board and the single-object versus fan-out decision on that expansion"
    expected_skill: "space-systems/ecss/e7041-wildcard-characters-in-an-object-path"
