# Hit@1 fragment: e5052-rmap-read-modify-write-command (space-systems/ecss)
# Two tasks for the new leaf. rm1 routes on the operand-and-mask pair sharing one
# data field and the half-length answer; rm2 routes on the per-bit merge and the
# masks that make the transaction pointless. Both must deterministically hit
# space-systems/ecss/e5052-rmap-read-modify-write-command.
tasks:
  - id: rm1
    query: "the data field of this atomic update command is six bytes, work out how wide the operand is and how many bytes the answer brings back"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.5; operand and mask share the data field at equal width and the reply returns only the previous content"
    expected_skill: "space-systems/ecss/e5052-rmap-read-modify-write-command"
  - id: rm2
    query: "I need to clear two flag bits in a remote control register without touching the rest, work out the operand and selector pair and whether my selector of all ones is right"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.5; the per-bit merge, clearing a bit needs it selected and clear in the operand, an all-ones selector is a plain write"
    expected_skill: "space-systems/ecss/e5052-rmap-read-modify-write-command"
