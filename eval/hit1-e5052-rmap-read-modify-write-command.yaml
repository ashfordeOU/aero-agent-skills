# Hit@1 fragment: e5052-rmap-read-modify-write-command (space-systems/ecss)
# Two tasks for the new leaf. rm1 routes on the operand-and-mask pair sharing one
# data field and the half-length answer; rm2 routes on the per-bit merge and the
# masks that make the transaction pointless. Both must deterministically hit
# space-systems/ecss/e5052-rmap-read-modify-write-command.
tasks:
  - id: rm1
    query: "a SpaceWire read-modify-write lands with a six byte data field - split it into the operand and its mask, say whether that length is one the command permits, are the option bits right, and how many bytes does the reply bring back"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.5; operand and mask share the data field at equal width and the reply returns only the previous content"
    expected_skill: "space-systems/ecss/e5052-rmap-read-modify-write-command"
  - id: rm2
    query: "I want to clear two status bits in a remote register with one RMAP command and not disturb its neighbours - give me the operand, the mask that goes with it, and say what a mask with every bit set would actually do"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.5; the per-bit merge, clearing a bit needs it selected by the mask and clear in the operand, an all-ones mask is a plain write"
    expected_skill: "space-systems/ecss/e5052-rmap-read-modify-write-command"
