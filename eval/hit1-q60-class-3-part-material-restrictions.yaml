# Hit@1 fragment: q60-class-3-part-material-restrictions (space-systems/ecss)
# Two tasks for the new leaf. c3pmr1 routes on the moisture floor-life budget
# of a plastic-encapsulated part chosen for a Class 3 build; c3pmr2 routes on
# the near-pure-tin whisker threshold and the outgassing limits on the
# encapsulant. Both must deterministically hit
# space-systems/ecss/q60-class-3-part-material-restrictions.
tasks:
  - id: c3pmr1
    query: "We want this plastic-encapsulated QFN approved at Class 3. Its case is non-hermetic and the dry pack was opened a week ago in a humid bay. Spend the remaining floor-life budget and say what the procurement file must carry."
    intent: "ECSS-Q-ST-60C clause 6.2.2.2; Class 3 non-hermetic packaging limit, moisture floor-life budget and bake evidence"
