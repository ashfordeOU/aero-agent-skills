  - id: c3pmr2
    query: "This Class 3 candidate has a nearly pure tin finish and an epoxy encapsulant. Give me the whisker margin for that finish, say whether mass loss or condensables bind first, and list the re-works or deviations it needs before purchase."
    intent: "ECSS-Q-ST-60C clause 6.2.2.2; pure tin whisker restriction, finish re-work and organic outgassing limits"
    expected_skill: "space-systems/ecss/q60-class-3-part-material-restrictions"
