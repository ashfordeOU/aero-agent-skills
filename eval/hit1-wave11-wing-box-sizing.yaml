# (root bending moment, spar cap, allowable stress), wbs2 routes on the
# load case and structure integration terms (ultimate moment, shear
# flow, maneuvering load factor). Both must deterministically hit
# vehicle-design/structures-integration/wing-box-sizing.
tasks:
  - id: wbs1
    query: "size the wing box structure: compute the root bending moment from the load factor, weight, and span with the elliptical lift distribution, then size the spar cap area from the allowable stress"
    intent: "vehicle design; wing box root bending moment and spar cap area from the elliptical load case"
