# Hit@1 fragment: e2008-coverglass-visual-inspection (space-systems/ecss)
# Two tasks for the new leaf. cgv1 routes on screening each coverglass against
# the assembly defect criteria; cgv2 routes on the edge-chip allowance against
# the measured overhang. Both must deterministically hit
# space-systems/ecss/e2008-coverglass-visual-inspection.
tasks:
  - id: cgv1
    query: "screen every coverglass on the solar cell assembly against the agreed defect criteria for chips inclusions and coating blemishes"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.6; per-coverglass defect criteria screen"
    expected_skill: "space-systems/ecss/e2008-coverglass-visual-inspection"
  - id: cgv2
    query: "the inspector logged a wide scratch, a cavity, a coating blemish and a smear that wipes off on one glass, so give each item its disposition against the agreed defect criteria and tell me whether the cumulative defect area allowance is blown"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.6; coverglass edge-chip allowance and coverage"
    expected_skill: "space-systems/ecss/e2008-coverglass-visual-inspection"
