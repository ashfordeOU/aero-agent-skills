# Hit@1 fragment: e20-eed-circuit-safety-margin-demonstration (space-systems/ecss)
# Case 1 routes on which evidence kind the circuit category admits. Case 2 routes on the
# coverage of mandated operating conditions and which one governs the separation.
tasks:
  - id: e20-eed-circuit-safety-margin-demonstration-1
    query: "Our pyro initiator firing circuit was cleared by a coupling calculation plus a heritage argument from a similar harness, and the customer rejected it. What kind of evidence does an electro-explosive firing circuit actually admit under clause 6.4.2?"
    intent: "ECSS-E-ST-20C 6.4.2; an initiator firing circuit is demonstrated by instrumented measurement on flight-representative hardware because the coupling lives in routing, bonding and connector"
    expected_skill: "space-systems/ecss/e20-eed-circuit-safety-margin-demonstration"
  - id: e20-eed-circuit-safety-margin-demonstration-2
    query: "We have induced levels recorded at three operating conditions but never exercised the launch site radiated environment. Which condition governs the demonstrated separation, and is an unexercised condition a gap or a silent pass?"
    intent: "ECSS-E-ST-20C 6.4.2; the governing condition is the one leaving the smallest separation, and a mandated condition that was never exercised is a gap in the demonstration"
    expected_skill: "space-systems/ecss/e20-eed-circuit-safety-margin-demonstration"
