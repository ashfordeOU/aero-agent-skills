# Hit@1 fragment: q20-gse-design (space-systems/ecss)
# Two tasks for the leaf. gsd1 routes on two-way traceability of GSE
# requirements and the verification records that close them; gsd2 routes on the
# method substitution and the criticality that a paper method cannot close.
# Both must deterministically hit space-systems/ecss/q20-gse-design, not the
# flight-hardware verification-control leaf.
tasks:
  - id: gsd1
    query: "audit the GSE requirement traceability behind this ground support equipment design under ECSS-Q-ST-20C: name the GSE requirements that trace to no source requirement, the GSE requirements with no verification record closing them, and the closure coverage of the GSE requirement set"
    intent: "ECSS-Q-ST-20C clause 5.8.1; upward and downward traceability of GSE requirements to verification records"
    expected_skill: "space-systems/ecss/q20-gse-design"
  - id: gsd2
    query: "the lifting fixture requirement was signed off on a design review instead of the test that was planned; say whether that closes it and what the review verdict on this GSE design should be"
    intent: "ECSS-Q-ST-20C clause 5.8.1; verification method substitution, criticality-driven method adequacy and the GSE design review verdict"
    expected_skill: "space-systems/ecss/q20-gse-design"
