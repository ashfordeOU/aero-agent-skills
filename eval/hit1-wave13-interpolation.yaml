# tabulated lift coefficient data, itp2 routes on natural cubic spline
# interpolation of a drag polar table with wording that could route to
# drag-polar or finite-difference-derivatives but must top-1 to
# cross-cutting/numerics/interpolation.
tasks:
  - id: itp1
    query: "use linear interpolation to interpolate the lift coefficient at alpha 6 degrees from the tabulated aerodynamic data table"
    intent: "numerics; piecewise linear table interpolation of tabulated lift coefficient data"
    expected_skill: "cross-cutting/numerics/interpolation"
