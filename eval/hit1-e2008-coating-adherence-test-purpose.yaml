# Hit@1 fragment: e2008-coating-adherence-test-purpose (space-systems/ecss, E-ST-20-08C 6.4.3.9.1)
# Two tasks per leaf; catp1 routes on why the coating adherence check is
# bought, catp2 on whether the planned check is placed where it can report
# durability. Both must deterministically hit
# space-systems/ecss/e2008-coating-adherence-test-purpose.
tasks:
  - id: catp1
    query: "state and defend the coating-durability-objective behind a coverglass-conductive-coating-adherence check and work out the coating-service-demand-index the mission puts on the film"
    intent: "ecss solar cell assemblies; purpose and justification of the coverglass coating adherence test"
    expected_skill: "space-systems/ecss/e2008-coating-adherence-test-purpose"
  - id: catp2
    query: "review whether a post-environmental-adherence-check is planned late enough to demonstrate charge-bleed-path-continuity after the environments that loosen the coating"
    intent: "ecss solar cell assemblies; whether the planned coating adherence check serves its purpose"
    expected_skill: "space-systems/ecss/e2008-coating-adherence-test-purpose"
