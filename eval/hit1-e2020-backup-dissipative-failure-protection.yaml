# Hit@1 fragment: e2020-backup-dissipative-failure-protection (space-systems/ecss)
# Two tasks for the new leaf. bdp1 routes on the conditional third protection
# owed only where neither earlier provision applies; bdp2 routes on backup
# coverage, independence and the thermal run-up it has to act inside. Both must
# deterministically hit
# space-systems/ecss/e2020-backup-dissipative-failure-protection.
tasks:
  - id: bdp1
    query: "neither earlier provision holds, the shunt element's derated rating will not swallow a stuck-on failure and the only off command has to pass the drive that died, so what does the backup owe us and inside what time"
    intent: "ECSS-E-ST-20-20C clause 5.2.14.3.1; the additional protection covering a dissipative switch failure in the case where neither of the two earlier provisions can apply"
    expected_skill: "space-systems/ecss/e2020-backup-dissipative-failure-protection"
  - id: bdp2
    query: "Our backup for the dissipative switch is a thermal cutout, but it hangs off that same gate drive and only opens after the junction passes its limit. Does that count as independent protection, and is its action fast enough against the run-up?"
    intent: "ECSS-E-ST-20-20C clause 5.2.14.3.1; matching a backup dissipative protection to the failure mode it covers, keeping it clear of the switch elements, and racing its action time against the thermal run-up"
    expected_skill: "space-systems/ecss/e2020-backup-dissipative-failure-protection"
