# Hit@1 wave-2 fragment: software-verification (space-systems/ecss)
# Two tasks per new leaf skill; sv1 routes on verification method
# selection per requirement category (functional, safety), sv2 routes
# on verification depth and independence per criticality. Both must
# deterministically hit space-systems/ecss/software-verification.
tasks:
  - id: sv1
    query: "select the ecss verification method for the functional and safety software requirements of the spacecraft"
    intent: "ECSS space software; verification method per requirement category"
    expected_skill: "space-systems/ecss/software-verification"
  - id: sv2
    query: "check the verification depth and independence required for the criticality category of the flight software"
    intent: "ECSS space software; verification depth and independence per criticality"
    expected_skill: "space-systems/ecss/software-verification"
