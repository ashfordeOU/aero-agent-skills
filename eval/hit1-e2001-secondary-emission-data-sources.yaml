  - id: e2001-secondary-emission-data-sources-2
    query: "None of our candidate secondary-electron-yield curves matches the baked surface condition of the part, and the analysis needs impact energies past the last tabulated point. Do I extrapolate, and is leaning on the standard tabulated curve a pass or a finding?"
    intent: "ECSS-E-ST-20-01C 5.3.3.3; energies beyond the table are refused rather than invented, and the conservative standard fallback is itself an open finding closed only by measuring the surface"
    expected_skill: "space-systems/ecss/e2001-secondary-emission-data-sources"
