# Hit@1 wave-17 fragment: gain-scheduling (gnc-autonomy/control)
# Two tasks per new leaf; w17-gain-scheduling-1 routes on scheduling
# controller gains against dynamic pressure across a nonlinear flight
# envelope, w17-gain-scheduling-2 on interpolating the gain schedule
# breakpoint table across Mach number operating points. Both must
# deterministically hit gnc-autonomy/control/gain-scheduling and not
# root-locus-design, frequency-response-design, or pid-control-design.
tasks:
  - id: w17-gain-scheduling-1
    query: "schedule the controller gains against dynamic-pressure across the nonlinear flight envelope"
    intent: "gain scheduling of controller gains against dynamic pressure across the nonlinear flight envelope"
    expected_skill: "gnc-autonomy/control/gain-scheduling"
  - id: w17-gain-scheduling-2
    query: "interpolate the gain schedule breakpoint table across Mach-number operating points"
    intent: "gain schedule breakpoint table interpolation across Mach number operating points"
    expected_skill: "gnc-autonomy/control/gain-scheduling"
