  - id: tr2
    query: "we only irradiated to half the mission fluence; grow the measured darkening out to end of life on a square-root model and tell me how far past the tested exposure that extrapolation reaches"
    intent: "ECSS-Q-ST-70-06C evaluation clause; degradation growth model, extrapolation factor and the end-of-life criterion"
    expected_skill: "space-systems/ecss/q7006-degradation-assessment"
