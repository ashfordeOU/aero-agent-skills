# Hit@1 fragment: e2006-mixed-material-assembly-evaluation (space-systems/ecss)
# Case 1 routes on what makes a stack qualify, and which constituents may be paired.
# Case 2 routes on the level at which the evidence has to be raised.
tasks:
  - id: e2006-mixed-material-assembly-evaluation-1
    query: "Our external radiator stack carries three ungrounded films whose resistivities are almost identical, plus a shim inside with nothing exposed to space. Does the stack qualify as a mixed-material assembly, and should that shim be paired at all?"
    intent: "ECSS-E-ST-20-06C 6.3.3.4; the verdict is pairwise dissimilarity rather than a count of materials, and a constituent with no exposed face cannot charge differentially on the outer face"
    expected_skill: "space-systems/ecss/e2006-mixed-material-assembly-evaluation"
  - id: e2006-mixed-material-assembly-evaluation-2
    query: "We hold coupon charging results for every material in the assembly and all of them are clean. Does that close verification, or must the evidence come from a complete unit, on a specimen that is representative and covers each constituent?"
    intent: "ECSS-E-ST-20-06C 6.3.3.4; coupons charged in isolation never see the adjacent dissimilar surface, so a green coupon set cannot stand in for evidence raised on the joined unit"
    expected_skill: "space-systems/ecss/e2006-mixed-material-assembly-evaluation"
