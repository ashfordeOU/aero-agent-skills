# material against the charge; ema2 routes on the contact-pair potential
# difference read against the assembly environment. Both must deterministically
# hit space-systems/ecss/e3311-materials.
tasks:
  - id: ema1
    query: "go through the candidate seals and housings for the initiator and tell me which ones can sit against the charge, I have vacuum mass loss figures, condensable volatiles and gas evolution measured in contact with the composition"
    intent: "ECSS-E-ST-33-11C clause 4.9; outgassing screening plus gas evolution and decomposition-onset depression measured against the explosive"
