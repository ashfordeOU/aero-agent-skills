# Hit@1 fragment: q40-02-generic-hazard-library (space-systems/ecss)
# Two tasks for the new leaf. gl1 routes on keying a generic library to declared
# system characteristics rather than browsing it; gl2 routes on the annex register
# example field set and the seeded candidate that never became a record. Both must
# deterministically hit space-systems/ecss/q40-02-generic-hazard-library.
tasks:
