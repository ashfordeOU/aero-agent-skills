# Hit@1 fragment: e7041-storage-control-definitions (space-systems/ecss)
# Two tasks for the new leaf. scd1 routes on the multi-store coverage answer
# that separates storage definitions from forwarding definitions; scd2 routes
# on absorption inside one packet store. Both must deterministically hit
# space-systems/ecss/e7041-storage-control-definitions.
tasks:
  - id: scd1
    query: "the same application process with the same report type and subtype is bound into two different packet stores; is that a duplicate definition to clean up or two copies we meant to hold on board, and what does it cost in definition capacity"
    intent: "ECSS-E-ST-70-41C clause 6.15.4.2; a selection held by two packet stores is two deliberate on-board copies rather than a duplicate, so coverage is answered as a store set and a copy count and each store is charged its own definition"
    expected_skill: "space-systems/ecss/e7041-storage-control-definitions"
  - id: scd2
    query: "somebody bound a whole application process into a packet store that already held six narrower selections there; do the six get swallowed by the wider one, and what does the packet store's storage definition count come to now"
    intent: "ECSS-E-ST-70-41C clause 6.15.4.2; inside one packet store a wider definition absorbs the narrower ones it covers and the absorbing add is not charged against the definition capacity, while other stores are untouched"
    expected_skill: "space-systems/ecss/e7041-storage-control-definitions"
