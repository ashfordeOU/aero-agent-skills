# Hit@1 fragment: e5052-initiator-only (space-systems/ecss)
# Two tasks for the new leaf. io1 routes on the declared role and the duty list
# an initiator still owes on the reply side; io2 routes on the identifier width
# against the outstanding-transaction budget. Both must deterministically hit
# space-systems/ecss/e5052-initiator-only.
tasks:
  - id: io1
    query: "our remote memory access block only ever sends commands and never answers them, go through what it declares it can do and tell me whether that list is actually complete for that role"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.2; initiator-only duty list including reply reception and status interpretation, and target-side services that should not be claimed"
    expected_skill: "space-systems/ecss/e5052-initiator-only"
  - id: io2
    query: "the command issuer keeps sixteen transactions in flight with a two bit tag field, work out whether that can ever match a returning answer to the right request"
    intent: "ECSS-E-ST-50-52C clause 5.8.2.2; transaction identifier width against the outstanding-transaction budget for an initiator-only unit"
    expected_skill: "space-systems/ecss/e5052-initiator-only"
