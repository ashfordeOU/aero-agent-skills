# Hit@1 wave-9 fragment: mass-budget (vehicle-design)
# Two tasks per new leaf skill; mb1 routes on subsystem mass
# allocation with growth allowance and contingency margin, mb2 routes
# on the mass breakdown rollup and the MTOW target check. Both must
# deterministically hit vehicle-design/mass-properties/mass-budget.
tasks:
  - id: mb1
    query: "build the mass-budget for the aircraft by allocating the subsystem masses and applying the growth-allowance and contingency-margin policy"
    intent: "mass properties; subsystem mass allocation with growth allowance and contingency margin into the mass budget"
    expected_skill: "vehicle-design/mass-properties/mass-budget"
  - id: mb2
    query: "roll up the mass-breakdown with the margin-policy and check the estimated total mass against the mtow-target"
    intent: "mass properties; mass breakdown rollup and MTOW target check"
    expected_skill: "vehicle-design/mass-properties/mass-budget"
