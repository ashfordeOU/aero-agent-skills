# Hit@1 fragment: e7041-resources (space-systems/ecss)
# Two tasks for the new leaf. res1 routes on the peak of simultaneous large
# message downlinks that sizes the transaction slots; res2 routes on the
# part-rounded octets a transaction holds while it is in progress. Both must
# deterministically hit space-systems/ecss/e7041-resources.
tasks:
  - id: res1
    query: "here is the schedule of large message downlinks for the pass, work out the most that are ever in progress at the same moment and whether the four transaction slots we declared are enough"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.2; peak of simultaneous large message downlink transactions against the declared transaction slots"
    expected_skill: "space-systems/ecss/e7041-resources"
  - id: res2
    query: "our downlink buffer was sized from the raw message lengths, redo it the way the subservice actually reserves memory and say which arrival gets refused when the pool runs out"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.2; octets reserved rounded up to whole parts and ordered admission against the buffer pool"
    expected_skill: "space-systems/ecss/e7041-resources"
