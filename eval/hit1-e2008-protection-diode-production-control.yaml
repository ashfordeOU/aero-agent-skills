# Hit@1 fragment: e2008-protection-diode-production-control
# (space-systems/ecss, E-ST-20-08C 9.3.2). Two tasks per leaf; pdc1 routes on
# the written process identification document and its scope, pdc2 on process
# coverage and qualification lot linkage. Both must deterministically hit
# space-systems/ecss/e2008-protection-diode-production-control.
tasks:
  - id: pdc1
    query: "review the external-protection-diode-process-identification submission as a diode-production-control-document and settle its diode-qualification-entry-scope"
    intent: "ecss photovoltaic assemblies; supplier written process document for external protection diodes entering qualification"
    expected_skill: "space-systems/ecss/e2008-protection-diode-production-control"
  - id: pdc2
    query: "assess diode-process-step-coverage and diode-qualification-lot-linkage against the diode-document-issue-chronology"
    intent: "ecss photovoltaic assemblies; processes declared, controlled and qualified for external protection diodes"
    expected_skill: "space-systems/ecss/e2008-protection-diode-production-control"
