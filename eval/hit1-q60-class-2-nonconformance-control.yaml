# Hit@1 fragment: q60-class-2-nonconformance-control (space-systems/ecss,
# Q-ST-60C 5.5.2). nc1 routes on grading and the usage escalation, nc2 on the
# sibling-lot impound reach and systematic recurrence. Both must
# deterministically hit
# space-systems/ecss/q60-class-2-nonconformance-control.
tasks:
  - id: nc1
    query: "grade this class-2-eee-nonconformance and apply the class-2-usage-criticality-escalation because the part is a single point of failure"
    intent: "ecss eee class 2; nonconformance and failure control across the programme"
    expected_skill: "space-systems/ecss/q60-class-2-nonconformance-control"
  - id: nc2
    query: "work out the class-2-sibling-lot-impound reach for this failure mode family and whether it is a class-2-systematic-mode-recurrence yet"
    intent: "ecss eee class 2; containment and recurrence over a failing lot"
    expected_skill: "space-systems/ecss/q60-class-2-nonconformance-control"
