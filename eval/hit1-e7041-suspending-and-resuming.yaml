# Hit@1 fragment: e7041-suspending-and-resuming (space-systems/ecss)
# Two tasks for the new leaf. obsr1 routes on a hold commanded while a step is
# running; obsr2 routes on what a release must carry on from. Both must
# deterministically hit space-systems/ecss/e7041-suspending-and-resuming.
tasks:
  - id: obsr1
    query: "we told a running procedure to hold mid-step and the acknowledgement came straight back, yet it kept executing to the end of that step - explain why the hold was still pending, where it finally landed, and what happens if the run ends first"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.6; a pause lands on a step boundary and never inside a step, so a pause commanded mid-step is pending while the procedure keeps running, and if that step was the last one the run ends before the pause can take effect"
    expected_skill: "space-systems/ecss/e7041-suspending-and-resuming"
  - id: obsr2
    query: "a procedure came back from its hold and restarted at step one instead of the step it stopped on, and another has been holding since yesterday - tell me where resumption should pick up and what the open hold is costing in engine slots"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.6; releasing a paused procedure carries on from the step it paused at rather than restarting at the first, and a paused procedure keeps its engine slot the whole time, so an unbounded pause is graded against the longest hold the mission allows"
    expected_skill: "space-systems/ecss/e7041-suspending-and-resuming"
