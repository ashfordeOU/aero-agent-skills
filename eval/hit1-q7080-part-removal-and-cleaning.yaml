# Hit@1 fragment: q7080-part-removal-and-cleaning (space-systems/ecss)
# Two tasks for the new leaf. prc1 routes on the mass balance that finds powder a
# borescope cannot reach; prc2 routes on the bore-to-powder ratio, the passage
# aspect and the cut that frees the part. Both must deterministically hit
# space-systems/ecss/q7080-part-removal-and-cleaning.
tasks:
  - id: prc1
    query: "the printed manifold weighs four grams more than the solid model says it should after depowdering, work out whether that is trapped powder and whether the part can go forward"
    intent: "ECSS-Q-ST-70-80 post-process clause; as-removed mass against nominal solid mass as the only measure of powder a borescope cannot reach"
    expected_skill: "space-systems/ecss/q7080-part-removal-and-cleaning"
  - id: prc2
    query: "one of the internal cooling runs in this build is under half a millimetre across with only one opening, decide whether it can actually be freed of powder and how much stock the plate cut needs"
    intent: "ECSS-Q-ST-70-80 post-process clause; bore against powder diameter, passage length against bore, open ports, and the kerf plus distortion budget of the removal cut"
    expected_skill: "space-systems/ecss/q7080-part-removal-and-cleaning"
