# Hit@1 fragment: e2008-esd-test-pass-fail-criteria (space-systems/ecss)
# Two tasks for the leaf; ec1 routes on categorizing each recorded coupon
# discharge as transient or sustained, ec2 on the applied-condition coverage
# behind the verdict. Both must deterministically hit
# space-systems/ecss/e2008-esd-test-pass-fail-criteria.
tasks:
  - id: ec1
    query: "decide whether any discharge recorded on the photovoltaic coupon was a sustained arc, judging each event against the supply recovery window and the current the coupon can feed"
    intent: "space systems ECSS; no-sustained-arcing pass decision for a photovoltaic coupon"
    expected_skill: "space-systems/ecss/e2008-esd-test-pass-fail-criteria"
  - id: ec2
    query: "confirm the coupon discharge run applied every required bias condition with its minimum discharge population before the absence of sustained arcing is read as a pass"
    intent: "space systems ECSS; applied discharge-condition coverage behind the coupon verdict"
    expected_skill: "space-systems/ecss/e2008-esd-test-pass-fail-criteria"
