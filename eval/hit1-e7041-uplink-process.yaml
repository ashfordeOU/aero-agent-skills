# Hit@1 fragment: e7041-uplink-process (space-systems/ecss)
# Two tasks for the new leaf. ulp1 routes on the on-board reassembly and the
# part number gap that ends it; ulp2 routes on the reception left open when the
# part stream stops. Both must deterministically hit
# space-systems/ecss/e7041-uplink-process.
tasks:
  - id: ulp1
    query: "walk this uplinked part stream through the on-board receiver and tell me at which part the reassembly gives up and why, we think one part went missing"
    intent: "ECSS-E-ST-70-41C clause 6.13.4.3; uplink part reassembly, part number gap and the named abort reason"
    expected_skill: "space-systems/ecss/e7041-uplink-process"
  - id: ulp2
    query: "the ground stopped sending part way through a big uplink and the transaction slot never came back, work out what the receiver should have done with that half finished reception"
    intent: "ECSS-E-ST-70-41C clause 6.13.4.3; inter-part timeout, reception still open at the end of the stream and the release of the held resources"
    expected_skill: "space-systems/ecss/e7041-uplink-process"
