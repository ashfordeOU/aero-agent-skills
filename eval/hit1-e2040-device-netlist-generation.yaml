    query: "our synthesis run record pins the sources and the tool but not the technology library version, can somebody else obtain the same netlist from what we wrote down"
    intent: "ECSS-E-ST-20-40C clause 5.5.2; synthesis run reproducibility, source and constraint revisions, tool and technology library version pinning"
