# Hit@1 wave-16 fragment: fracture-toughness (structures/materials)
# Two tasks per new leaf; w16-fracture-toughness-1 routes on critical crack
# size from plane-strain fracture toughness, applied stress and geometry
# factor, w16-fracture-toughness-2 on the failure criterion K >= K_IC and
# the plane-strain validity of the test specimen. Both must deterministically
# hit structures/materials/fracture-toughness.
tasks:
  - id: w16-fracture-toughness-1
    query: "compute the critical crack size for a material with known plane strain fracture toughness under a given stress"
    intent: "fracture toughness critical crack size computation"
    expected_skill: "structures/materials/fracture-toughness"
  - id: w16-fracture-toughness-2
    query: "check whether the applied stress intensity factor exceeds the plane strain fracture toughness K_IC and whether the compact tension specimen is thick enough for a valid plane strain fracture toughness test"
    intent: "fracture toughness failure criterion and plane strain validity check"
    expected_skill: "structures/materials/fracture-toughness"
