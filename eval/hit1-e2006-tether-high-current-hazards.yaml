    query: "One segment of our tether loop has no protective device recorded at all, and another sits behind a breaker clearing in 80 ms at a 60 A fault. How do I compare the energy that gets through against what the conductor cross-section can absorb, and how should the blank entry be scored?"
    intent: "ECSS-E-ST-20-06C clause 10.2.3; the case turns on let-through energy against the adiabatic withstand of the section, and on an unrecorded protection device being a finding"
