# Hit@1 fragment: e5053-protocol-identifier-field (space-systems/ecss)
# Two tasks for the new leaf. pid1 routes on finding and grading the identifier
# octet when path bytes have moved it. pid2 routes on the disposition of a unit
# naming another protocol or an unclaimed identifier. Both must deterministically
# hit space-systems/ecss/e5053-protocol-identifier-field.
tasks:
  - id: pid1
    query: "the receiver counts path-address bytes wrong, so it reads the identifier octet in the wrong place and the remainder goes to the wrong handler, one never registered for this protocol; work out the true offset and categorize the value found there"
    intent: "ECSS-E-ST-50-53C clause 5.3.3; identifier offset from path length, expected identifier comparison"
    expected_skill: "space-systems/ecss/e5053-protocol-identifier-field"
  - id: pid2
    query: "a unit arrives carrying the escape value in its identifier octet, another carries a value no handler here claims; say how each is categorized, which one gets dropped, and whether an identifier spilling past a single byte is admissible"
    intent: "ECSS-E-ST-50-53C clause 5.3.3; protocol handler demultiplexing, extended identifier escape, unclaimed identifier discard"
    expected_skill: "space-systems/ecss/e5053-protocol-identifier-field"
