# Hit@1 fragment: e2008-sca-humidity-shelf-life-purpose (space-systems/ecss,
# E-ST-20-08C 6.4.3.8.1). Two tasks per leaf; shlp1 routes on why the damp-air
# exposure is applied, shlp2 on whether the run represents the storage life.
# Both must deterministically hit
# space-systems/ecss/e2008-sca-humidity-shelf-life-purpose.
tasks:
  - id: shlp1
    query: "justify the sca-accelerated-shelf-life-exposure and set up the conductive-coverglass-coating-monitoring it has to include"
    intent: "ecss solar cell assemblies; purpose of the accelerated shelf-life humidity exposure"
    expected_skill: "space-systems/ecss/e2008-sca-humidity-shelf-life-purpose"
  - id: shlp2
    query: "compute the damp-air-acceleration-factor and the sca-storage-life-equivalence and check coating-sheet-resistance-stability is watched"
    intent: "ecss solar cell assemblies; does the damp-air run represent the required storage life"
    expected_skill: "space-systems/ecss/e2008-sca-humidity-shelf-life-purpose"
