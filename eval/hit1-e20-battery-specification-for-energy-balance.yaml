    intent: "ECSS-E-ST-20C 5.6.2; the demand is an end-of-life figure that must be divided by the retained fraction, and the recurring cycle needs its own net-energy closure"
    expected_skill: "space-systems/ecss/e20-battery-specification-for-energy-balance"
