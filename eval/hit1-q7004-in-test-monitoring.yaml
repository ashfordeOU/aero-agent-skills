# Hit@1 fragment: q7004-in-test-monitoring (space-systems/ecss)
# Two tasks for the new leaf. im1 routes on role coverage plus per-channel
# sampling-rate and recording-gap grading; im2 routes on merging consecutive
# out-of-limit readings into timed excursion events. Both must deterministically
# hit space-systems/ecss/q7004-in-test-monitoring.
tasks:
  - id: im1
    query: "our thermal test logged temperature and chamber pressure but no functional parameter channel at all, and one thermocouple stopped sampling for twenty minutes; grade the monitored role coverage and say whether that gap makes the record unusable"
