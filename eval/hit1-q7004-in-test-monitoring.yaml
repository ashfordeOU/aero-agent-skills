  - id: im2
    query: "our in-test monitoring channel for chamber pressure logged four consecutive samples above the limit and then recovered; merge them into a single timed departure for the test record instead of counting four separate out-of-limit points"
    intent: "ECSS-Q-ST-70-04C in-test monitoring; merging consecutive out-of-limit readings on the same side into a single timed excursion event carrying its duration and extreme value"
    expected_skill: "space-systems/ecss/q7004-in-test-monitoring"
