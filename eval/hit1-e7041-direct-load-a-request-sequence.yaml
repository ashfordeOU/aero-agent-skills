# Hit@1 fragment: e7041-direct-load-a-request-sequence (space-systems/ecss)
# Two tasks for the new leaf. dlrs1 routes on a single command carrying the
# whole sequence body inline and whether the store takes it; dlrs2 routes on
# the all-or-nothing rule and the untouched store. Both must deterministically
# hit space-systems/ecss/e7041-direct-load-a-request-sequence.
tasks:
  - id: dlrs1
    query: "one uplinked command carries a sequence identifier and all eleven of its requests inline, decide whether the on-board store takes it given an identifier that is already held and only 300 octets free"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.2; already-held refusal and the header-inclusive fit against the free capacity read at the moment of the load"
    expected_skill: "space-systems/ecss/e7041-direct-load-a-request-sequence"
  - id: dlrs2
    query: "the seventh request inside an inline sequence load has a subtype the application does not accept, work out whether the first six get stored anyway and what the sequence store looks like after the load is answered"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.2; grade the whole carried body before storing anything and leave the store untouched on refusal"
    expected_skill: "space-systems/ecss/e7041-direct-load-a-request-sequence"
