# Hit@1 fragment: q7054-contamination-reintroduction-control (space-systems/ecss)
# Two tasks for the new leaf. crc1 routes on degrading an achieved level by the
# fallout and transfer an exposure profile adds; crc2 routes on which single
# control buys the shortfall back. Both must deterministically hit
# space-systems/ecss/q7054-contamination-reintroduction-control.
tasks:
  - id: crc1
    query: "we cleaned it to level one hundred, then it sat open on the integration bench four hours with no unidirectional flow and double bagged in store three weeks, so degrade that level for fallout and glove residue and name the control that recovers most"
    intent: "ECSS-Q-ST-70-54C recontamination; particle fallout and residue transfer accumulated over each exposure period, added in the count domain and inverted back to a level"
    expected_skill: "space-systems/ecss/q7054-contamination-reintroduction-control"
  - id: crc2
    query: "the hardware arrives out of spec after storage, is it worth upgrading the cleanroom a class or should we just double bag it and change the gloves"
    intent: "ECSS-Q-ST-70-54C recontamination; recomputing the exposure with one control changed at a time and ranking by the shortfall that remains"
    expected_skill: "space-systems/ecss/q7054-contamination-reintroduction-control"
