# Hit@1 fragment: e2008-coverglass-flatness-or-bow (space-systems/ecss)
# Two tasks for the new leaf. fb1 routes on recording the maximum
# deflection of a coverglass resting on an optical flat; fb2 routes on
# separating a bow from waviness and on the reach and resolution the grid
# owes. Both must deterministically hit
# space-systems/ecss/e2008-coverglass-flatness-or-bow.
tasks:
  - id: fb1
    query: "record the maximum deflection of the coverglass resting unclamped on the optical flat and turn the interference fringe count into a gap height against the drawing limit"
    intent: "ECSS-E-ST-20-08C clause 8.7.8; coverglass maximum deflection on an optically flat reference"
    expected_skill: "space-systems/ecss/e2008-coverglass-flatness-or-bow"
  - id: fb2
    query: "is this coverglass departure a bow or waviness, and did the probe grid reach the rim and resolve the departure against the reference flat"
    intent: "ECSS-E-ST-20-08C clause 8.7.8; coverglass bow versus waviness, grid reach and resolution margin"
    expected_skill: "space-systems/ecss/e2008-coverglass-flatness-or-bow"
