# Hit@1 fragment: e7041-loading-activating-and-deleting (space-systems/ecss)
# Two tasks for the new leaf. oblad1 routes on why an uplink of a procedure
# image was refused; oblad2 routes on the ordering of stop, delete and reload.
# Both must deterministically hit
# space-systems/ecss/e7041-loading-activating-and-deleting.
tasks:
  - id: oblad1
    query: "uplinking this control procedure image to the spacecraft keeps coming back refused with one unhelpful error code; separate an image that failed its checksum from one too big for the free store and from an identifier that is already occupied"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.4; getting a procedure aboard checks the image integrity, the per-procedure size limit, the free store and whether the identifier is already occupied, and each refusal needs its own answer because a re-uplink fixes only one of them"
    expected_skill: "space-systems/ecss/e7041-loading-activating-and-deleting"
  - id: oblad2
    query: "we want to replace the running safing sequence with a newer build during the pass, give me the order the commands have to go in and tell me which of them the spacecraft will turn down"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.4; a running procedure cannot be removed and one marked permanent cannot be removed at all, an occupied identifier refuses a different build, and starting an already started procedure is a second execution rather than a no-op, so the order is stop then remove then load"
    expected_skill: "space-systems/ecss/e7041-loading-activating-and-deleting"
