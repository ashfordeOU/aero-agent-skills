# Hit@1 fragment: e2008-sca-flatness-criteria (space-systems/ecss, E-ST-20-08C 6.4.3.17.3)
# Two tasks per leaf; sfc1 routes on deriving the limiting value from the
# assembly geometry, sfc2 on sentencing a record against whichever limit
# governs. Both must deterministically hit
# space-systems/ecss/e2008-sca-flatness-criteria.
tasks:
  - id: sfc1
    query: "carry out the sca-flatness-limit-derivation for an assembly span with its floor and ceiling and settle the sca-flatness-drawing-limit-provenance"
    intent: "ecss solar cell assemblies; limiting deflection value defined for the assembly geometry"
    expected_skill: "space-systems/ecss/e2008-sca-flatness-criteria"
  - id: sfc2
    query: "make the sca-deflection-limit-disposition on a measured deflection, separate a sca-flatness-marginal-result from a clear one and settle sca-flatness-lot-sentencing"
    intent: "ecss solar cell assemblies; accepting or rejecting a measured assembly deflection against its limit"
    expected_skill: "space-systems/ecss/e2008-sca-flatness-criteria"
