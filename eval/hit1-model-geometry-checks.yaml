  - id: model-geometry-checks-2
    query: "Two substructure meshes meet at a bolted joint and some shell patches look flipped. How do I confirm the interface nodes line up within tolerance and that neighbouring elements traverse their shared edge in opposite directions?"
    intent: "ECSS-E-ST-32C 5.2; the interface tolerance is coarser than the coordinate one, and consistent normals are proven by the shared-edge winding rule"
    expected_skill: "space-systems/ecss/model-geometry-checks"
