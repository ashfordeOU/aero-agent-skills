# Hit@1 fragment: e7041-action-initiation (space-systems/ecss)
# Two tasks for the new leaf. ai1 routes on the ordered two-level arming check
# at detection time; ai2 routes on repeated detections releasing repeatedly and
# the peak release rate. Both must deterministically hit
# space-systems/ecss/e7041-action-initiation.
tasks:
  - id: ai1
    query: "the event report came down exactly as expected and the command bound to it never went out, work out which of the two arming switches stopped the release and whether the entry even exists in the table"
    intent: "ECSS-E-ST-70-41C clause 6.19.5.2; the release decision reads the function-level switch before the per-definition one, and an event no definition covers is a different answer from a definition that is disarmed"
    expected_skill: "space-systems/ecss/e7041-action-initiation"
  - id: ai2
    query: "one chattering sensor kept re-reporting the same on-board event and the bound command went out on every single report, saturating the link, check whether repeated detections are meant to release repeatedly and how to put a number on the burst"
    intent: "ECSS-E-ST-70-41C clause 6.19.5.2; every occurrence is its own release decision and repeats are not coalesced, so the peak release rate over a window against a stated limit is the measurement that makes the storm visible"
    expected_skill: "space-systems/ecss/e7041-action-initiation"
