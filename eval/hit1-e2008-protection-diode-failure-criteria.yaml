# Hit@1 fragment: e2008-protection-diode-failure-criteria (space-systems/ecss)
# Two tasks for the new leaf. to1 routes on turning a tested protection diode
# subgroup into per-part failure calls; to2 routes on the absolute-limit arm and
# the missing after reading. Both must deterministically hit
# space-systems/ecss/e2008-protection-diode-failure-criteria.
tasks:
  - id: to1
    query: "a protection diode subgroup was characterised, thermal cycled and characterised again, work out which parts the test and the inspection closing it leave failed"
    intent: "ECSS-E-ST-20-08C clause 9.7.1; conditions that mark a protection diode failed within its subgroup test programme"
    expected_skill: "space-systems/ecss/e2008-protection-diode-failure-criteria"
  - id: to2
    query: "assess this protection diode subgroup: one part is numerically clean yet shows a listed observed condition, one has an after reading past its absolute limit, and one never got an after reading, a pass or simply not evaluated"
    intent: "ECSS-E-ST-20-08C clause 9.7.1; a numerically clean part still failed by a listed observed condition, an after reading over its own absolute limit, and a missing after reading left unevaluated rather than passed"
    expected_skill: "space-systems/ecss/e2008-protection-diode-failure-criteria"
