# Hit@1 fragment: e2001-level-one-geometry-criteria (space-systems/ecss)
# Case 1 routes on shape admissibility and escalation of anything the charts
# never covered. Case 2 routes on the numeric side: effective gap of an annulus,
# the radius-ratio band, and the charted frequency-gap range.
tasks:
  - id: e2001-level-one-geometry-criteria-1
    query: "Our filter has a stepped iris and a wedge shaped region next to the parallel section. Can those be screened with the first level multipactor charts, or must they go to a full field solution?"
    intent: "ECSS-E-ST-20-01C clause 5.3.2.2.2; a shape the charts were never drawn for is escalated rather than forced into an equivalent gap"
    expected_skill: "space-systems/ecss/e2001-level-one-geometry-criteria"
  - id: e2001-level-one-geometry-criteria-2
    query: "A coax section, 3.5 mm outer and 1.5 mm inner conductor radius, at 12 GHz. What effective gap applies, is that radius ratio inside the band where the plane equivalence holds, and does the product of frequency and gap land in the charted range?"
    intent: "ECSS-E-ST-20-01C clause 5.3.2.2.2; the annular effective gap, the radius-ratio band that keeps the plane equivalence honest, and the charted product limits"
    expected_skill: "space-systems/ecss/e2001-level-one-geometry-criteria"
