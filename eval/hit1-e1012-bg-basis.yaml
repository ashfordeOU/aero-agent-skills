# Hit@1 fragment: e1012-bg-basis (space-systems/ecss)
# Case 1 routes on the orbit-driven contributor list for detector background.
# Case 2 routes on mapping the detector technology into the family taxonomy.
tasks:
  - id: e1012-bg-basis-1
    query: "Our imager flies a 700 km sun-synchronous orbit and stares at nadir. Before anyone computes a count rate, which ambient particle populations have to be listed as contributors to detector background, and does the neutron albedo belong on that list?"
    intent: "ECSS-E-ST-10-12C 10.1 to 10.2; the orbit regime fixes which environments feed detector background, and a nadir-viewing low orbit keeps albedo neutrons on the list"
    expected_skill: "space-systems/ecss/e1012-bg-basis"
  - id: e1012-bg-basis-2
    query: "The gamma instrument uses a lanthanum bromide crystal read out by photomultipliers. Which detector technology family does that fall into for background response purposes, and what entries must the basis record hold before we move to the quantitative stage?"
    intent: "ECSS-E-ST-10-12C 10.3 Table 10-1; mapping the instrument onto a detector-technology family and completing the four-field basis record"
    expected_skill: "space-systems/ecss/e1012-bg-basis"
