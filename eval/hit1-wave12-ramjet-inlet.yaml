# Hit@1 wave-12 fragment: ramjet-inlet (propulsion/ramjet)
# Two tasks per new leaf; rii1 routes on the Kantrowitz starting limit
# Mach and the diffuser normal-shock pressure recovery, rii2 routes on
# the inlet start verdict and the isentropic versus shock recovery
# comparison. Both must deterministically hit
# propulsion/ramjet/ramjet-inlet.
tasks:
  - id: rii1
    query: "compute the kantrowitz starting limit mach number for the supersonic ramjet inlet with a contraction ratio of 1.2 and the diffuser total pressure recovery across the normal shock at the flight mach number"
    intent: "propulsion; Kantrowitz starting limit Mach and normal shock diffuser pressure recovery for a supersonic ramjet inlet"
    expected_skill: "propulsion/ramjet/ramjet-inlet"
  - id: rii2
    query: "check whether the ramjet inlet starts at mach 2.5 with a contraction ratio of 1.3 and compare the normal shock pressure recovery with the isentropic diffuser recovery for the hypersonic cruise vehicle"
    intent: "propulsion; inlet start verdict from the Kantrowitz criterion and isentropic versus shock pressure recovery, cross-cutting with hypersonic vehicle performance"
    expected_skill: "propulsion/ramjet/ramjet-inlet"
