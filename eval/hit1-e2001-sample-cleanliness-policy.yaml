# Hit@1 fragment: e2001-sample-cleanliness-policy (space-systems/ecss)
# Case 1 routes on the handling chain: step families and the credit a purged or
# evacuated enclosure earns against the room. Case 2 routes on the obscuration
# accrual and on an allowable budget nobody recorded.
tasks:
  - id: e2001-sample-cleanliness-policy-1
    query: "Our emission yield sample travels in an evacuated container through a loose room, then is mounted with tweezers in a cleaner bay. Do I credit that sealed enclosure when the room cleanliness class is looser, and how is each handling step categorized?"
    intent: "ECSS-E-ST-20-01C clause 9.4.1.2; the sample sees the enclosure rather than the room, so evacuation or purge earns an effective class, and every step is placed in one handling family"
    expected_skill: "space-systems/ecss/e2001-sample-cleanliness-policy"
  - id: e2001-sample-cleanliness-policy-2
    query: "Nobody ever wrote down an allowable surface obscuration budget for the yield sample. Do I accrue settled particles as a rate times exposure along the chain, and is an unrecorded budget a pass because no exceedance can be shown?"
    intent: "ECSS-E-ST-20-01C clause 9.4.1.2; obscuration is a rate multiplied by exposure summed across the chain, and an unset allowable is its own finding rather than the absence of an exceedance"
    expected_skill: "space-systems/ecss/e2001-sample-cleanliness-policy"
