# Hit@1 fragment: e20-equipment-test-point-accessibility (space-systems/ecss)
# Case 1 routes on the loading arithmetic that decides whether a reachable point
# yields a usable number. Case 2 routes on the intrusive-provision judgement and
# the plan-level coverage verdict, which point-level greens never produce.
tasks:
  - id: e20-equipment-test-point-accessibility-1
    query: "The node I need to watch has a 50 kilohm source impedance and the bench scope probe is 1 megohm. What measurement error does that divider give me, and what input impedance would hold it inside a 2 percent allowable?"
    intent: "ECSS-E-ST-20C clause 4.2.4; the probe forms a divider with the source, and the allowable inverts into a minimum instrument input impedance"
    expected_skill: "space-systems/ecss/e20-equipment-test-point-accessibility"
  - id: e20-equipment-test-point-accessibility-2
    query: "We can only get to half the measurement points if we demate a flight connector or tap a solder lug. Does that count as accessible, and how do I show that no stimulus or signal in the verification plan is left without a reachable point?"
    intent: "ECSS-E-ST-20C clause 4.2.4; an intrusive route changes the configuration under test, and coverage is judged against the plan rather than the connector list"
    expected_skill: "space-systems/ecss/e20-equipment-test-point-accessibility"
