# Hit@1 fragment: e2008-coverglass-clause-purpose (space-systems/ecss, E-ST-20-08C 8.1.1)
# Two tasks per leaf; ccp1 routes on which generic rule families a coated
# coverglass pulls in and what the declared plan covers, ccp2 on the heritage
# and change drivers that decide whether qualification evidence is owed at
# all. Both must deterministically hit
# space-systems/ecss/e2008-coverglass-clause-purpose.
tasks:
  - id: ccp1
    query: "work the coverglass-generic-rule-scope for this coated glass and grade coverglass-manufacture-control-coverage against the declared plan with a coverglass-scope-coverage-index"
    intent: "ecss coverglass; which generic manufacture, test and qualification rules the clause opens on this item"
    expected_skill: "space-systems/ecss/e2008-coverglass-clause-purpose"
  - id: ccp2
    query: "decide the coverglass-qualification-evidence-demand for a heritage coverglass with a changed coating run and list the coverglass-coating-stack-obligations it reopens"
    intent: "ecss coverglass; heritage and process change deciding whether qualification evidence is still owed"
    expected_skill: "space-systems/ecss/e2008-coverglass-clause-purpose"
