# Hit@1 fragment: q6005-active-chip-general-provisions (space-systems/ecss)
# Two tasks for the new leaf. agp1 routes on separating what holds for every
# active die purchase from what a technology or a function conditions in; agp2
# routes on whether a waiver actually relieves anything. Both must
# deterministically hit space-systems/ecss/q6005-active-chip-general-provisions.
tasks:
  - id: agp1
    query: "go through our die purchase paperwork and tell me which requirements apply to every bare die we buy no matter what the part does, and which ones only bit because it happens to be a gallium arsenide part"
    intent: "ECSS-Q-ST-60-05C clause 8.3.1; the baseline layer holds irrespective of device function or technology, and conditioned provisions add to it rather than replacing a member of it"
    expected_skill: "space-systems/ecss/q6005-active-chip-general-provisions"
  - id: agp2
    query: "the die vendor signed off its own relief from the traceability requirement and the date on it ran out last year, work out whether that leaves us covered"
    intent: "ECSS-Q-ST-60-05C clause 8.3.1; a waiver needs a waivable provision, an entitled granting authority and an unexpired validity date, and an identity provision may not be waived at all"
    expected_skill: "space-systems/ecss/q6005-active-chip-general-provisions"
