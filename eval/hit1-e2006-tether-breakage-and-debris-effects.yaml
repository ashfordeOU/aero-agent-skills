    expected_skill: "space-systems/ecss/e2006-tether-breakage-and-debris-effects"
  - id: e2006-tether-breakage-and-debris-effects-2
    query: "Our deployed tether severs 600 m out while held at 25 N. What snap-back reach and recoil speed does that release give against the solar-wing keep-out standoff, and what decay lifetime does the freed segment have as debris?"
    intent: "ECSS-E-ST-20-06C 10.2.7; stored elastic strain sets the recoil reach and arrival speed against the keep-out standoff, and the freed length becomes its own object with its own decay life"
    expected_skill: "space-systems/ecss/e2006-tether-breakage-and-debris-effects"
