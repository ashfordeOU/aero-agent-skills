tasks:
  - id: e2006-tether-breakage-and-debris-effects-1
    query: "Our 2 km electrodynamic tether carries 3 A through a 0.2 mm2 conductor. Which severance initiator dominates here: ohmic fusing of the conductor, the strand running hot enough to soften, or a micrometeoroid cut accumulated over five years?"
