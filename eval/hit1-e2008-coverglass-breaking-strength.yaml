# Hit@1 fragment: e2008-coverglass-breaking-strength (space-systems/ecss)
# Two tasks for the leaf. cbs1 routes on the break-load-to-stress conversion
# and the control drawing comparison; cbs2 routes on the Weibull allowable
# that a passing arithmetic mean hides. Both must deterministically hit
# space-systems/ecss/e2008-coverglass-breaking-strength.
tasks:
  - id: cbs1
    query: "The supplier sent thirty break readings in newtons off a ring on ring rig, plus coupon thickness and both ring radii. Turn those forces into stress at failure and tell me whether this coverglass batch meets what the drawing demands."
    intent: "ECSS-E-ST-20-08C clause 8.7.15; coverglass breaking strength against the control drawing limit"
    expected_skill: "space-systems/ecss/e2008-coverglass-breaking-strength"
  - id: cbs2
    query: "fit a Weibull modulus and characteristic strength over the broken coverglass sample set and show whether the low-probability design allowable clears the drawing minimum when the arithmetic mean already does"
    intent: "ECSS-E-ST-20-08C clause 8.7.15; Weibull allowable behind the coverglass strength verdict"
    expected_skill: "space-systems/ecss/e2008-coverglass-breaking-strength"
