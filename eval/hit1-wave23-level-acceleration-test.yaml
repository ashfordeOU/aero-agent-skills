# Hit@1 wave-23 fragment: level-acceleration-test (flight-test-operations)
# Two tasks per new leaf skill. w23-level-acceleration-test-1 routes on
# reducing a recorded level acceleration run: smoothing the airspeed
# trace, central-difference acceleration, specific excess power by the
# total energy method and excess thrust at the test weight.
# w23-level-acceleration-test-2 routes on the sustained acceleration
# capability and thrust available check at altitude from an accelerated
# level flight test. Both use the total-energy vocabulary so they do not
# route to climb-performance-flight-test (steady climb rate of climb
# wording), engine-flight-test (fuel flow, EGT or thrust determination
# wording) or flight-test-data-reduction (calibration and uncertainty
# wording).
tasks:
  - id: w23-level-acceleration-test-1
    query: "reduce the level acceleration run from the flight test: smooth the airspeed trace with a moving average over the odd window, compute the acceleration and the specific excess power with the total energy method, and estimate the excess thrust at the test weight from the measured P_s"
    intent: "flight-test-operations; reduction of an accelerated level flight run: smoothing the airspeed trace, central-difference acceleration, specific excess power by the total energy method and excess thrust at the test weight"
    expected_skill: "flight-test-operations/performance/level-acceleration-test"
  - id: w23-level-acceleration-test-2
    query: "determine the sustained acceleration capability and the thrust available at altitude from an accelerated level flight test using the total energy method: report the specific excess power and the acceleration, and check at which speeds the excess thrust stays positive against the drag from the polar"
    intent: "flight-test-operations; sustained level acceleration capability and thrust available estimate from an accelerated level flight test with the total energy method, excess thrust against the polar drag"
    expected_skill: "flight-test-operations/performance/level-acceleration-test"
