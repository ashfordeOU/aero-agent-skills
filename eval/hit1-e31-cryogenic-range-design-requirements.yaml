# Hit@1 fragment: e31-cryogenic-range-design-requirements (space-systems/ecss)
# cry1 routes on sensing and control hardware below the cryogenic boundary;
# cry2 routes on material property scatter in the cold and the heat-leak band
# it produces. Both must deterministically hit
# space-systems/ecss/e31-cryogenic-range-design-requirements.
tasks:
  - id: cry1
    query: "our detector assembly is controlled at 100 K with the same bimetal thermostat and sensor we fly at room temperature - check whether that control chain still works down there"
    intent: "ECSS-E-ST-31 clause 4.2.3; the sensor must cover the cold end with usable sensitivity and a mechanical thermostat below its qualification floor widens its deadband past the allowable control band"
    expected_skill: "space-systems/ecss/e31-cryogenic-range-design-requirements"
  - id: cry2
    query: "we sized the cold strap and the cooler on the catalogue conductivity but the strut runs from 80 K to room temperature - work out the heat leak we should actually be designing to"
    intent: "ECSS-E-ST-31 cryogenic annex; material properties scatter more below 200 K, so conductivity becomes a band and the cooler is sized on the high end rather than the nominal"
    expected_skill: "space-systems/ecss/e31-cryogenic-range-design-requirements"
