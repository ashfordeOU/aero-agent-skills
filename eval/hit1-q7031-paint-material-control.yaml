# Hit@1 fragment: q7031-paint-material-control (space-systems/ecss)
# Two tasks for the new leaf. pmc1 routes on shelf life dated from manufacture
# and the hot-storage penalty against it; pmc2 routes on the vacuum outgassing
# screening the batch has to carry. Both must deterministically hit
# space-systems/ecss/q7031-paint-material-control.
tasks:
  - id: pmc1
    query: "this primer tin was made eighteen months ago and sat a fortnight in a hot store - give me the expiry, the life left the day we mix it with hardener, and whether its outgassing figures still let the batch be released"
    intent: "ECSS-Q-ST-70-31C materials; shelf life from manufacture date, storage excursion penalty in days, release or retest disposition"
    expected_skill: "space-systems/ecss/q7031-paint-material-control"
  - id: pmc2
    query: "check the batch paperwork for this topcoat against the mass loss and condensable figures before it goes anywhere near the optical bench"
    intent: "ECSS-Q-ST-70-31C materials with the ECSS-Q-ST-70-02C screening limits; total mass loss and collected volatile condensable material fail independently, plus batch traceability"
    expected_skill: "space-systems/ecss/q7031-paint-material-control"
