# Hit@1 fragment: q7029-concentration-determination (space-systems/ecss)
# cdt1 routes on the calibration bracket and the blank ordering; cdt2 routes on
# the below-quantitation reporting rule, which is where a result is reported at
# the limit rather than as zero. Both must deterministically hit
# space-systems/ecss/q7029-concentration-determination.
tasks:
  - id: cdt1
    query: "turn these offgassing peak areas into micrograms per gram of sample and milligrams per cubic metre of vessel, remembering the blank run and the spike recovery of the desorption train"
    intent: "ECSS-Q-ST-70-29 analysis; blank subtraction before the calibration, bracketing interpolation, recovery correction and the two normalisations"
    expected_skill: "space-systems/ecss/q7029-concentration-determination"
  - id: cdt2
    query: "one compound came out above the detection limit but under the quantitation limit and another response is off the top of the calibration series - what do I report for each"
    intent: "ECSS-Q-ST-70-29 analysis; a below-quantitation result carries the limit with its marker, and an over-range response is refused rather than extrapolated"
    expected_skill: "space-systems/ecss/q7029-concentration-determination"
