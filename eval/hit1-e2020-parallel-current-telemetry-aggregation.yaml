# Hit@1 fragment: e2020-parallel-current-telemetry-aggregation (space-systems/ecss)
# Two tasks for the new leaf. pct1 routes on one telemetry reading standing for
# the total current of a paralleled limiter group; pct2 routes on a full scale
# inherited from a single member and on a member left out of the sum. Both must
# deterministically hit
# space-systems/ecss/e2020-parallel-current-telemetry-aggregation.
tasks:
  - id: pct1
    query: "each limiter in the paralleled group has its own sensing and one housekeeping number must speak for all of them, so show me the figure we report really is the group total and whether the range we picked for one unit now clips"
    intent: "ECSS-E-ST-20-20C clause 5.2.12.5.1; current telemetry of paralleled limiters reporting the total current flowing through the group"
    expected_skill: "space-systems/ecss/e2020-parallel-current-telemetry-aggregation"
  - id: pct2
    query: "the group current reading sits flat at the top of its range and we later found the third limiter was never added into the sum"
    intent: "ECSS-E-ST-20-20C clause 5.2.12.5.1; a paralleled limiter telemetry full scale sized for one member saturating on the group total, and a member omitted from the aggregation"
    expected_skill: "space-systems/ecss/e2020-parallel-current-telemetry-aggregation"
