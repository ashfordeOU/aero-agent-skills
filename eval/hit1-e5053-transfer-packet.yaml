  - id: tp2
    query: "our SpaceWire receive path logs every transfer that belongs to some other protocol identifier as an error, so tell me what the entity owes traffic that is not this protocol and whether we must look at the terminator before parsing anything"
    intent: "ECSS-E-ST-50-53C clause 5.5.3; the protocol identifier demultiplexes to an entity, another protocol's transfer is handed on rather than discarded as an error"
    expected_skill: "space-systems/ecss/e5053-transfer-packet"
