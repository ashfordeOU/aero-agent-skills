# Hit@1 fragment: e1024-requirements (space-systems/ecss)
# Case 1 routes on category coverage across the four mandatory requirement categories.
# Case 2 routes on per-requirement field validity and an unrecognized category label.
tasks:
  - id: e1024-requirements-1
    query: "The requirements document for our payload-to-platform boundary has plenty of shall statements on connectors, loads and thermal limits, but nothing about packet structure, data rate or timing. Does that leave a coverage gap we have to declare?"
    intent: "ECSS-E-ST-10-24C 5.3; the case turns on the data-characteristic category being one of four that must each hold at least one entry for the interface"
