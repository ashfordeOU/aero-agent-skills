  - id: e1024-requirements-2
    query: "Someone entered rows in our IRD with a category of optical, left the verification method and rationale empty, and gave two requirements the same unique identifier. How do those grade against the four mandatory interface requirement categories?"
    intent: "ECSS-E-ST-10-24C 5.3; the case turns on mandatory field validation, an out-of-vocabulary category not counting toward coverage, and duplicate identifiers"
    expected_skill: "space-systems/ecss/e1024-requirements"
