# Hit@1 fragment: q6005-acceleration-and-shock-screening (space-systems/ecss,
# Q-ST-60-05 10.3.5). Two tasks for the new leaf. acs1 routes on the level and
# the axes a package mass and its element mounting together owe; acs2 routes on
# the shock pulse as a peak-and-duration pair and on the attachment the screen
# itself can break. Both must deterministically hit
# space-systems/ecss/q6005-acceleration-and-shock-screening.
tasks:
  - id: acs1
    query: "grade the hybrid-constant-acceleration-condition this package mass owes and the hybrid-screening-axis-selection its cantilevered element needs before the run is signed off"
    intent: "ecss hybrids; the mechanical screen level and the axes it has to act along"
    expected_skill: "space-systems/ecss/q6005-acceleration-and-shock-screening"
  - id: acs2
    query: "judge the hybrid-shock-pulse-waveform peak against its duration window and the hybrid-die-attach-inertial-load the level puts across the bond, then the hybrid-post-screen-drift-limit"
    intent: "ecss hybrids; a shock pulse is a peak and a duration, and a screen can exceed what the attach medium carries"
    expected_skill: "space-systems/ecss/q6005-acceleration-and-shock-screening"
