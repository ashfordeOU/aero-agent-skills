  - id: e2006-material-characterization-testing-2
    query: "Our assembly-level qualification exceeded flight on particle-flux and exposure-duration, but its cold end reached only minus 40 where flight sees minus 70. Does one axis outside the test-envelope break the material-characterization waiver across every parameter?"
    intent: "ECSS-E-ST-20-06C 6.6.2; the case turns on the envelope comparison being axis by axis, with any single shortfall voiding the waiver across the whole parameter set"
    expected_skill: "space-systems/ecss/e2006-material-characterization-testing"
