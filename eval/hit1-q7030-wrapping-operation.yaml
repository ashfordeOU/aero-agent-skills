    query: "set the turn schedule for this wrap: the bare turns the conductor gauge owes plus the insulated turns the modified wrap configuration carries"
    intent: "ECSS-Q-ST-70-30C wrapping process; bare-turn schedule per conductor gauge and the insulated turn of a modified wrap"
