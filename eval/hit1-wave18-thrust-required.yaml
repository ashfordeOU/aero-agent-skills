# and minimum power speed. Both must deterministically hit
# flight-mechanics/performance/thrust-required.
tasks:
  - id: w18-thrust-required-1
    query: "compute the thrust required curve versus airspeed for level flight from the drag polar with the weight, wing area, and sea level density"
