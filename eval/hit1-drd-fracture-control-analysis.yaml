# Hit@1 fragment: drd-fracture-control-analysis (space-systems/ecss)
# Case 1 routes on what the analysis report must carry per item, including the
# non-critical entries. Case 2 routes on rolling the per-item checks into closure.
tasks:
  - id: drd-fracture-control-analysis-1
    query: "Assembling our Annex E report on fracture control analysis for the propulsion bracketry: what must appear against each load-carrying item, does damage-tolerance and leak-before-burst evidence go in per item, and must items judged non-critical still record why?"
    intent: "ECSS-E-ST-32 Annex E; the report content per item, including recording the rationale for items judged not critical rather than omitting them"
    expected_skill: "space-systems/ecss/drd-fracture-control-analysis"
  - id: drd-fracture-control-analysis-2
    query: "Closing out our fracture control analysis: applied net-section stress is 180 MPa, we assume an initial flaw at what our inspection can actually find, and toughness carries a safety factor. Is the computed stress intensity acceptable, and does the inspection method detect that flaw?"
    intent: "ECSS-E-ST-32 Annex E with E-ST-32-01; rolling the leak-before-burst, scatter-factored life and detectability checks into one report closure verdict"
    expected_skill: "space-systems/ecss/drd-fracture-control-analysis"
