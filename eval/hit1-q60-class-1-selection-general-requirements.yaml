# Hit@1 fragment: q60-class-1-selection-general-requirements (space-systems/ecss)
# Two tasks for the new leaf. csgr1 routes on the readiness of the ground a Class 1
# part choice stands on before a purchase order; csgr2 routes on a blocking
# prerequisite stopping a selection whatever the weighted index reads. Both must
# deterministically hit
# space-systems/ecss/q60-class-1-selection-general-requirements.
tasks:
  - id: csgr1
    query: "our Class 1 candidate has the mission environment prerequisite simply missing from the selection file and a signed purchase order is due next week; under clause 4.2.1 does silence read as open or is it rejected outright, and which single item moves the decision furthest for the effort"
    intent: "ECSS-Q-ST-60C clause 4.2.1; a prerequisite left undeclared is rejected rather than read as open, and the readiness index is weighted over the prerequisites that still apply"
    expected_skill: "space-systems/ecss/q60-class-1-selection-general-requirements"
  - id: csgr2
    query: "our component control plan is still unapproved and this part never made it onto the list of declared components; can this Class 1 candidate still go to procurement, and does that blocker cap the readiness index"
    intent: "ECSS-Q-ST-60C clause 4.2.1; blocking selection prerequisite and Class 1 procurement authorization"
    expected_skill: "space-systems/ecss/q60-class-1-selection-general-requirements"
