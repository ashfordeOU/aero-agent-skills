# Hit@1 wave-15 fragment: impact-point-prediction (gnc-autonomy/guidance)
# Two tasks per new leaf. ipp1 routes on the flat earth range equation
# from launch speed and flight path angle; ipp2 is the cross-domain
# adversarial task that mentions guidance law handoff but must hit the
# ballistic impact point leaf. Both must deterministically hit
# gnc-autonomy/guidance/impact-point-prediction.
tasks:
  - id: ipp1
    query: "predict the ballistic impact point from the launch speed and the flight path angle with the flat earth range equation"
    intent: "GNC; ballistic impact point prediction from launch speed and flight path angle via the range equation"
    expected_skill: "gnc-autonomy/guidance/impact-point-prediction"
  - id: ipp2
    query: "estimate where the ballistic round will land and the total time of flight before the pursuit guidance handoff begins"
    intent: "GNC; ballistic landing point and time of flight ahead of a guidance handoff"
    expected_skill: "gnc-autonomy/guidance/impact-point-prediction"
