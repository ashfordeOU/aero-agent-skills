# Hit@1 fragment: e2008-coverglass-production-control-document
# (space-systems/ecss, E-ST-20-08C 8.4). Two tasks per leaf; cpcd1 routes on
# coverage of the coverglass production processes the document declares, cpcd2
# on the control parameter bands and the qualification evidence dates. Both
# must deterministically hit
# space-systems/ecss/e2008-coverglass-production-control-document.
tasks:
  - id: cpcd1
    query: "review the coverglass-production-control-document submitted for qualification and grade its coverglass-process-step-coverage"
    intent: "ecss coverglasses; supplier process identification document for coverglass production"
    expected_skill: "space-systems/ecss/e2008-coverglass-production-control-document"
  - id: cpcd2
    query: "grade each coverglass-control-parameter-band against the coverglass-measurement-uncertainty-ratio and check the coverglass-qualification-evidence-date"
    intent: "ecss coverglasses; control parameters and qualification evidence in the production baseline"
    expected_skill: "space-systems/ecss/e2008-coverglass-production-control-document"
