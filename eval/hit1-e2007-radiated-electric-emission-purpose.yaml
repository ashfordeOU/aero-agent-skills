# Hit@1 fragment: e2007-radiated-electric-emission-purpose
# (space-systems/ecss, E-ST-20-07C 5.4.6.1). Two tasks per leaf; reep1 routes
# on the emitter pair the aim is stated over, reep2 on the limit margin and the
# polarization pair the aim is demonstrated across. Both must deterministically
# hit space-systems/ecss/e2007-radiated-electric-emission-purpose.
tasks:
  - id: reep1
    query: "state what the unit-enclosure-field-emission and interconnecting-cabling-field-emission scans have to show before the radiated method aim counts as demonstrated"
    intent: "ecss emc radiated electric field emission; the aim of the method stated over the unit enclosure and the interconnecting cabling"
    expected_skill: "space-systems/ecss/e2007-radiated-electric-emission-purpose"
  - id: reep2
    query: "grade each radiated-emission-limit-margin over the antenna-polarization-scan-pair then name the governing-radiated-emitter"
    intent: "ecss emc radiated electric field emission; margin against the applicable radiated limit and worst emitter at its worst frequency"
    expected_skill: "space-systems/ecss/e2007-radiated-electric-emission-purpose"
