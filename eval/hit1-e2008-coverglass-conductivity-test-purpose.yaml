    query: "Panel review is asking why we sweep the whole coated face of a coverglass instead of taking one probe reading. Give me the argument, plus how fast charge drains off and what voltage a dead island reaches with the plasma flux we quoted."
    intent: "ECSS-E-ST-20-08C clause 6.4.3.13.1; purpose of the coverglass surface conductivity uniformity survey"
