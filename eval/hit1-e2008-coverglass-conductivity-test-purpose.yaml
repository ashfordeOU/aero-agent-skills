# Hit@1 fragment: e2008-coverglass-conductivity-test-purpose (space-systems/ecss)
# Two tasks for the leaf. ccp1 routes on why the whole outer face of a
# conductive coverglass is surveyed rather than one spot; ccp2 routes on
# sizing the probe survey that has to see a non-uniform coating. Both must
# deterministically hit
# space-systems/ecss/e2008-coverglass-conductivity-test-purpose.
tasks:
