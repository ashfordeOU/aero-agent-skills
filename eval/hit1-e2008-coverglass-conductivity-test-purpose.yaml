  - id: ccp2
    query: "Nine probe sites are planned for the conductivity survey of a 100 mm conductive coverglass. Does that reach enough of the coated face, and is the spacing close enough that a non-conducting patch cannot hide between sites?"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.13.1; probe site coverage behind a coverglass uniformity claim"
    expected_skill: "space-systems/ecss/e2008-coverglass-conductivity-test-purpose"
