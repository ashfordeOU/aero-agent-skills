# Hit@1 fragment: q20-test-reviews (space-systems/ecss)
# Two tasks for the new leaf. rv1 routes on the readiness go/no-go and the
# waiver that cannot clear a mandatory criterion; rv2 routes on closing a
# finished test at the post-test review. Both must deterministically hit
# space-systems/ecss/q20-test-reviews.
tasks:
  - id: rv1
    query: "decide go or no-go before we put the article in the chamber when the facility calibration criterion is being waived and one blocking action is still open"
    intent: "ECSS-Q-ST-20C clause 5.6.5; readiness review criteria, waiver admissibility on a mandatory criterion and open blocking actions"
    expected_skill: "space-systems/ecss/q20-test-reviews"
  - id: rv2
    query: "the test finished last week, work out whether the post-test review actually closed it or whether the data and discrepancy criteria leave it open"
    intent: "ECSS-Q-ST-20C clause 5.6.5; post-test review criteria, its record and the date order between the review and the test window"
    expected_skill: "space-systems/ecss/q20-test-reviews"
