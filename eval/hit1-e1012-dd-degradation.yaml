# Hit@1 fragment: e1012-dd-degradation (space-systems/ecss)
# Case 1 routes on choosing a curve form and on a dose landing outside the
# characterised span. Case 2 routes on whether the margin factor is applied
# before the parameter floor comparison.
tasks:
  - id: e1012-dd-degradation-1
    query: "Our optocoupler has a tabular displacement damage curve with three measured points and the dose at mission end sits beyond the last one. Is linear interpolation off the end of that table acceptable, or must I flag the part and get more irradiation data?"
    intent: "ECSS-E-ST-10-12C 8.6; tabular curve form requires bracketing points, and a dose beyond the characterised span is a finding rather than an extrapolation"
    expected_skill: "space-systems/ecss/e1012-dd-degradation"
  - id: e1012-dd-degradation-2
    query: "A bipolar transistor gain falls to 0.62 of its beginning-of-life value by mission end from the fitted curve, and the circuit floor is 0.55. Do I compare those two numbers directly, or does a design margin for radiation come off the degraded value first?"
    intent: "ECSS-E-ST-10-12C 8.6; the compliance check uses the margin-adjusted fraction, not the raw degraded fraction, against a floor derived from the functional requirement"
    expected_skill: "space-systems/ecss/e1012-dd-degradation"
