# Hit@1 fragment: e7041-change-raw-memory-parameter-definitions (space-systems/ecss)
# Two tasks for the new leaf. crmp1 routes on re-pointing a raw memory
# parameter's window and screening its geometry; crmp2 routes on the bounds
# versus alignment versus length distinction and on the overlap hazard. Neither
# may reach the parameter report or set leaves, which act on values rather than
# memory windows. Both must deterministically hit
# space-systems/ecss/e7041-change-raw-memory-parameter-definitions.
tasks:
  - id: crmp1
    query: "a telecommand re-points three raw memory parameters at new base addresses in another memory area, what do I check about each window before the definition change is allowed to land"
    intent: "ECSS-E-ST-70-41C clause 6.20.5.2; unknown area, region bounds, access alignment and length against the representation width, screened in that order"
    expected_skill: "space-systems/ecss/e7041-change-raw-memory-parameter-definitions"
  - id: crmp2
    query: "the new base for a raw memory parameter is inside the area but is not word aligned, and after the change two parameter definitions would read the same bytes, which of those is a refusal and which is a hazard"
    intent: "ECSS-E-ST-70-41C clause 6.20.5.2; misaligned base is refused, a resulting overlap is applied and raised as a hazard"
    expected_skill: "space-systems/ecss/e7041-change-raw-memory-parameter-definitions"
