# Hit@1 fragment: q6013-class-1-destructive-physical-analysis (space-systems/ecss)
# Two tasks for the new leaf. dpa1 routes on sizing a teardown sample across a
# commercial shipment that spans two date codes; dpa2 routes on the die-attach
# voiding and bond pull criteria that decide the lot. Both must
# deterministically hit
# space-systems/ecss/q6013-class-1-destructive-physical-analysis.
tasks:
  - id: dpa1
    query: "our purchased shipment came in under two date codes and the draw for the smaller code would consume the whole of its own group; size the teardown for me and say which population each finding is charged against"
    intent: "ECSS-Q-ST-60-13C clause 4.3.9; destructive sample sizing per date-code group of a purchased commercial shipment"
    expected_skill: "space-systems/ecss/q6013-class-1-destructive-physical-analysis"
  - id: dpa2
    query: "the teardown sheet reports a largest single void larger than the whole voided area it also gives, and the average pull strength came in low; split the construction findings between major and minor and return the purchased lot disposition"
    intent: "ECSS-Q-ST-60-13C clause 4.3.9; die-attach void and bond pull criteria and the resulting lot disposition"
    expected_skill: "space-systems/ecss/q6013-class-1-destructive-physical-analysis"
