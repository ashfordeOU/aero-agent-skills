# Hit@1 corpus (gate 5)
# Fixed queries evaluated by scripts/router_eval.py (flat+tags token-overlap
# router per research/briefs/03-router-design.md section 5). No network.
#
# Active tasks cover every published skill. The Phase-0 baseline (5 canonical
# eval queries from brief 03 section 5 + brief 05 section 6 item 7 validation anchor)
# is reconciled as of the P2.1 rework (2026-08-31) and extended in P3.5:
#   1. DO-178C coverage (p1)          -> LIVE task (avionics/do178c/planning)
#   2. CubeSat battery (t1)           -> LIVE task (space-systems/subsystems/power-thermal-budget; promoted P3.5)
#   3. weight-and-balance (t2)        -> LIVE task (vehicle-design/sizing/weight-estimation; promoted P3.5)
#   4. engine overhaul (t3)           -> future_pin (manufacturing-quality/as9100/quality; nearest published skill until
#                                       an MRO/maintenance skill publishes)
#   5. XFOIL NACA 0012 polar (t4)     -> LIVE task (aerodynamics/airfoil/xfoil-analysis; promoted P3.5)
# P3.5 (2026-08-31): sixty-six active tasks across the twenty-seven skills: the
# P2.1 set plus two tasks per new skill (a1/a2, g1-g6, st1-st4, pt1/pt2, w1/w2,
# sa3/sa4, tr1/tr2, tq1/tq2, eq1/eq2, hv1/hv2, se1/se2, fai1/fai2) and five new
# adversarial cross-pair tasks xp4-xp8. future_pins keep t3 pinned to
# manufacturing-quality/as9100/quality.
#
# P2.1 rework also adds xp1-xp3: adversarial cross-pair tasks whose wording
# plausibly routes to 2+ domains. Each asserts a deterministic top-1 with no
# collision (verified against the router at authoring time).# P5.2 / Wave 2 (2026-08-31): fan-out build to sixty-nine verified
# skills (81 SKILL.md under gate 1: 12 routers + 69 leaves). Fourteen
# new leaves: avionics +3 (special-conditions, vertical-navigation,
# do254 configuration-management), gnc-autonomy +3 (root-locus-design,
# lqr-design, navigation-frames opening the navigation pack),
# manufacturing-quality +1 (delta-fai), space-systems +2
# (ecss software-verification, communication-link-budget), structures +3
# (modal-analysis, failure-criteria, residual-strength), propulsion +2
# (nozzle-design, bypass-ratio-trade). Corpus: 154 tasks (the 126 prior
# plus 28 domain tasks: sc1/sc2, vn1/vn2, rl1/rl2, lqr1/lqr2, nf1/nf2,
# df1/df2, dcm1/dcm2, sv1/sv2, ma1/ma2, fc1/fc2, res1/res2, lb1/lb2,
# nz1/nz2, bpr1/bpr2). Owner: Ops Manager, Wave 2 build.
# P5.2 / Wave 3 (2026-08-31, re-dispatch #2): fan-out continues to
# eighty-three verified skills (95 SKILL.md under gate 1: 12 routers +
# 83 leaves). Fourteen new leaves: flight-mechanics +2
# (climb-performance, turn-performance), cross-cutting +2
# (documentation/engineering-margins, numerics/convergence-verification),
# vehicle-design +2 (sizing/ws-tw-trade, cost-estimation/parametric-cost),
# flight-test-operations +2 (envelope/v-speeds,
# performance/accelerate-stop-distance), aerodynamics +2
# (high-speed/normal-shock, drag-polars/drag-polar),
# manufacturing-quality +1 (ndt-method-selection), propulsion +1
# (axial-compressor-stage), gnc-autonomy +1 (proportional-navigation),
# space-systems +1 (sun-synchronous-inclination). Corpus: 182 tasks
