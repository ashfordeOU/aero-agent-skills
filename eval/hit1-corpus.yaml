# Hit@1 corpus (gate 5)
# Fixed queries evaluated by scripts/router_eval.py (flat+tags token-overlap
# router per research/briefs/03-router-design.md section 5). No network.
#
# Active tasks cover every published skill. The Phase-0 baseline (5 canonical
# eval queries from brief 03 section 5 + brief 05 section 6 item 7 validation anchor)
# is reconciled as of the P2.1 rework (2026-08-31) and extended in P3.5:
#   1. DO-178C coverage (p1)          -> LIVE task (avionics/do178c/planning)
#   2. CubeSat battery (t1)           -> LIVE task (space-systems/subsystems/power-thermal-budget; promoted P3.5)
#   3. weight-and-balance (t2)        -> LIVE task (vehicle-design/sizing/weight-estimation; promoted P3.5)
#   4. engine overhaul (t3)           -> future_pin (manufacturing-quality/as9100/quality; nearest published skill until
#                                       an MRO/maintenance skill publishes)
#   5. XFOIL NACA 0012 polar (t4)     -> LIVE task (aerodynamics/airfoil/xfoil-analysis; promoted P3.5)
# P3.5 (2026-08-31): sixty-six active tasks across the twenty-seven skills: the
# P2.1 set plus two tasks per new skill (a1/a2, g1-g6, st1-st4, pt1/pt2, w1/w2,
# sa3/sa4, tr1/tr2, tq1/tq2, eq1/eq2, hv1/hv2, se1/se2, fai1/fai2) and five new
# adversarial cross-pair tasks xp4-xp8. future_pins keep t3 pinned to
# manufacturing-quality/as9100/quality.
#
# P2.1 rework also adds xp1-xp3: adversarial cross-pair tasks whose wording
# plausibly routes to 2+ domains. Each asserts a deterministic top-1 with no
# collision (verified against the router at authoring time).
tasks:
  - id: p1
    query: "determine the software level for a flight control function whose failure is catastrophic"
    intent: "DO-178C software level / DAL determination from failure-condition severity"
    expected_skill: "avionics/do178c/planning"

  - id: p2
    query: "draft a PSAC for a navigation system software update"
    intent: "DO-178C planning phase; PSAC artifact"
    expected_skill: "avionics/do178c/planning"

  - id: p3
