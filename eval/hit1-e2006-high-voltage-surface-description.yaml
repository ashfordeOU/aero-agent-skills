  - id: e2006-high-voltage-surface-description-2
    query: "Coverglass, exposed interconnect tabs and the triple junction at a cell gap all sit at different potentials relative to the plasma. How do I place each one in its collection regime and total the parasitic current against the budget?"
    intent: "ECSS-E-ST-20-06C 8.1; collecting area depends on the surface category, and each plasma-relative potential lands in exactly one regime before the currents are summed"
    expected_skill: "space-systems/ecss/e2006-high-voltage-surface-description"
