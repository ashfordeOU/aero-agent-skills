# Hit@1 fragment: e7041-abort-the-file-copy-operations (space-systems/ecss)
# Two tasks for the new leaf. abrt1 routes on the fate of the half-written
# target file; abrt2 routes on the space accounting an abort has to unwind.
# Both must deterministically hit
# space-systems/ecss/e7041-abort-the-file-copy-operations.
tasks:
  - id: abrt1
    query: "we aborted a file copy a third of the way through and the destination now holds a truncated target of the right name - tell me what that abort owed us, the list entry, the part file, and the octets it took"
    intent: "ECSS-E-ST-70-41C clause 6.23.5.4; a cancelled copy deletes the partially written target so no truncated file survives, and an untouched target needs no action because it was never created"
    expected_skill: "space-systems/ecss/e7041-abort-the-file-copy-operations"
  - id: abrt2
    query: "after cancelling all the on-board duplications the destination still reports less room than it should and the next request is being turned away for space that looks free, explain what the cancellation left behind in the accounting"
    intent: "ECSS-E-ST-70-41C clause 6.23.5.4; the octets of a deleted partial target must be returned to the destination free space as the entry leaves the list, and the discarded transfer effort is reported separately from the count of operations cancelled"
    expected_skill: "space-systems/ecss/e7041-abort-the-file-copy-operations"
