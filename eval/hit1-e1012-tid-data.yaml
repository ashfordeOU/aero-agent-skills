# Hit@1 fragment: e1012-tid-data (space-systems/ecss)
# Case 1 routes on reading a lab dose-response curve and the low-rate correction
# for bipolar parts. Case 2 routes on batch spread and the functional limit check.
tasks:
  - id: e1012-tid-data-1
    query: "Our bipolar op-amp comes with laboratory measurements of input bias current taken at 5, 10, 20 and 50 krad, all at a high rate. Design dose for the mission is 18 krad. How do I interpolate the parameter there, and what ELDRS correction factor applies?"
    intent: "ECSS-E-ST-10-12C 7.6; interpolating the measured dose-response curve and applying the enhanced low dose-rate correction for a bipolar part"
    expected_skill: "space-systems/ecss/e1012-tid-data"
  - id: e1012-tid-data-2
    query: "No batch data exists for this regulator. To bound the spread over production lots I applied a 20 percent margin toward the worst-case end, which lands the predicted parameter exactly at its functional limit. Is zero headroom a compliant TID result?"
    intent: "ECSS-E-ST-10-12C 7.7; bounding lot spread with a fractional allowance and deciding a zero-headroom prediction against the functional limit"
    expected_skill: "space-systems/ecss/e1012-tid-data"
