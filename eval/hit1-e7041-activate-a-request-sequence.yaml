# Hit@1 fragment: e7041-activate-a-request-sequence (space-systems/ecss)
# Two tasks for the new leaf. acrs1 routes on the accept-or-refuse decision an
# activation request faces; acrs2 routes on the specific preconditions -- a body
# still under load, a sequence already running, a full engine. Both must
# deterministically hit space-systems/ecss/e7041-activate-a-request-sequence.
tasks:
  - id: acrs1
    query: "ground sent a plain activation request naming one stored sequence and nothing is being uplinked with it; which preconditions must the engine clear, including its concurrent execution capacity, before the first request goes out, and what must the refusal notification name"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.5; activation preconditions and the refusal notification for one named sequence"
    expected_skill: "space-systems/ecss/e7041-activate-a-request-sequence"
  - id: acrs2
    query: "three activation requests hit the request sequence engine at once: one names a sequence still loading, one names a sequence already executing, and the third exceeds the concurrent execution capacity; which do I accept and what must each refusal report"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.5; load state, already-executing, body checksum and concurrent capacity as activation refusals"
    expected_skill: "space-systems/ecss/e7041-activate-a-request-sequence"
