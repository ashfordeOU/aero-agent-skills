# Hit@1 fragment: q60-class-2-self-made-magnetics (space-systems/ecss,
# Q-ST-60C 5.6.8). Two tasks for the leaf. sm2a routes on the class 2 design
# checks a house winding owes, sm2b on the screening sequence and the lot
# sampling floor. Both must deterministically hit
# space-systems/ecss/q60-class-2-self-made-magnetics.
tasks:
  - id: sm2a
    query: "check the class-2-magnetics-volt-second-flux-density and the class-2-magnetics-window-fill-factor on this transformer we wound in house for class 2 equipment"
    intent: "ECSS-Q-ST-60C clause 5.6.8; designing a class 2 self-made wound magnetic part to recognised practice"
    expected_skill: "space-systems/ecss/q60-class-2-self-made-magnetics"
  - id: sm2b
    query: "derive the class-2-magnetics-screening-sequence for this house-wound inductor, confirm the class-2-magnetics-hot-spot-margin and apply the class-2-magnetics-lot-sampling-floor"
    intent: "ECSS-Q-ST-60C clause 5.6.8; screening a class 2 self-made wound magnetic part and sampling its flight lot"
    expected_skill: "space-systems/ecss/q60-class-2-self-made-magnetics"
