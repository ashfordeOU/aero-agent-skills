  - id: csol2
    query: "a soldered harness termination was reheated twice with the iron; work out the thermal exposure budget scaled to the conductor cross-section and check the insulation clearance window at the termination"
    intent: "ECSS-Q-ST-20-30C section 7.3; thermal exposure budget scaled to conductor cross-section across reheats, and the insulation clearance window"
    expected_skill: "space-systems/ecss/q2030-comp-soldering"
