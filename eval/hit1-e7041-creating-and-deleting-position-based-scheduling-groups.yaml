# Hit@1 fragment: e7041-creating-and-deleting-position-based-scheduling-groups
# (space-systems/ecss). Two tasks for the new leaf. cdsg1 routes on what a group
# deletion takes with it; cdsg2 routes on the refusals a create/delete request
# returns. Both must deterministically hit
# space-systems/ecss/e7041-creating-and-deleting-position-based-scheduling-groups.
tasks:
  - id: cdsg1
    query: "a delete aimed at a group that is not in the registry was refused, and another delete hit a group still holding a load; count what that removal takes with it and say whether the group limit frees up once it is gone"
    intent: "ECSS-E-ST-70-41C clause 6.22.8.2; a delete is refused for a group the registry never held, and deleting one that still carries a load discards what it holds, so the count is taken before the deletion and the group limit is released after it"
    expected_skill: "space-systems/ecss/e7041-creating-and-deleting-position-based-scheduling-groups"
  - id: cdsg2
    query: "our create for a new group came back refused although the registry was nowhere near the group limit, and a delete of a different group was refused as well - say which reason belongs to which and what has to change"
    intent: "ECSS-E-ST-70-41C clause 6.22.8.2; a create is refused for an identifier already held or once the group limit is reached, a delete is refused for an unknown group or one still enabled, and each instruction is answered on its own"
    expected_skill: "space-systems/ecss/e7041-creating-and-deleting-position-based-scheduling-groups"
