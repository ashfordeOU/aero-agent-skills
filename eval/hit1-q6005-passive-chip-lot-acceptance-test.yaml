# Hit@1 fragment: q6005-passive-chip-lot-acceptance-test (space-systems/ecss)
# Two tasks for the new leaf. plat1 routes on the sample-size-versus-acceptance-
# number pairing that a destructive incoming test drives to zero; plat2 routes on
# the resubmission of a lot that already failed once. Both must deterministically
# hit space-systems/ecss/q6005-passive-chip-lot-acceptance-test.
tasks:
  - id: plat1
    query: "an incoming lot of passive chip capacitors for a hybrid assembly: size the attribute sample from the population, set the acceptance number given one test is destructive, and grade the defective fraction we observed against what that chip family allows"
    intent: "ECSS-Q-ST-60-05C clause 8.2.3; attribute sample size banded on lot population, and the zero acceptance number a destructive incoming test carries"
    expected_skill: "space-systems/ecss/q6005-passive-chip-lot-acceptance-test"
  - id: plat2
    query: "a chip resistor lot we rejected last month has come back resubmitted with no evidence of an approved rescreen; say whether it can be accepted and what lot tolerance the sampling plan we are using actually buys us"
    intent: "ECSS-Q-ST-60-05C clause 8.2.3; a rejected lot needs an approved rescreen before resubmission, and the lot tolerance percent defective states what the sampling really bought"
    expected_skill: "space-systems/ecss/q6005-passive-chip-lot-acceptance-test"
