# Hit@1 fragment: q7001-cleanliness-verification-plan (space-systems/ecss)
# Two tasks for the new leaf. cvp1 routes on matching a method detection floor to a
# requirement with margin and on the minimum sample area that will not fit the
# surface; cvp2 routes on where the verification point sits once the surface is
# closed out and on an indirect sample carrying a critical requirement alone. Both
# must deterministically hit
# space-systems/ecss/q7001-cleanliness-verification-plan.
tasks:
  - id: cvp1
    query: "I have a list of particulate and molecular cleanliness requirements and a shelf of measurement methods, work out which method can actually substantiate each one and which requirements are left with nothing"
    intent: "ECSS-Q-ST-70-01C verification; method detection floor against the limit with a margin factor, and the minimum sample area against the accessible surface"
    expected_skill: "space-systems/ecss/q7001-cleanliness-verification-plan"
  - id: cvp2
    query: "this panel is closed out before the fairing goes on; at which programme milestones does each cleanliness limit get measured, which method backs it, and does an indirect reading cover the critical optic or leave that requirement uncovered"
    intent: "ECSS-Q-ST-70-01C verification; verification points through to the last accessible milestone and the direct-versus-indirect rule on a criticality-driven surface"
    expected_skill: "space-systems/ecss/q7001-cleanliness-verification-plan"
