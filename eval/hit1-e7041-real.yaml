# Hit@1 fragment: e7041-real (space-systems/ecss)
# Two tasks for the new leaf. real1 routes on a measurement quantised by the
# floating encoding it was given; real2 routes on choosing the encoding against
# both a magnitude and a relative resolution. Both must deterministically hit
# space-systems/ecss/e7041-real.
tasks:
  - id: real1
    query: "this downlinked position value moves in visible steps near the top of its range but looks fine near zero, work out whether the sensor or the field it travels in is doing that"
    intent: "ECSS-E-ST-70-41C clause 7.3.6; floating point precision is relative, so the step between representable values grows with the magnitude and a narrow encoding quantises the top of the range while leaving the bottom untouched"
    expected_skill: "space-systems/ecss/e7041-real"
  - id: real2
    query: "pick the floating encoding for a parameter that has to reach ten to the thirty-eighth and still resolve one part in a hundred million, and say which of the two requirements forces the choice"
    intent: "ECSS-E-ST-70-41C clause 7.3.6; the encoding is chosen against the magnitude and the relative resolution independently, and a value past the range writes an infinity code while one below it stores flat as zero"
    expected_skill: "space-systems/ecss/e7041-real"
