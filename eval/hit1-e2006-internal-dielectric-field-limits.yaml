# Hit@1 fragment: e2006-internal-dielectric-field-limits (space-systems/ecss)
# Case 1 routes on the geometry that sets the governing field, planar mean
# against coaxial inner-radius gradient. Case 2 routes on the cap itself:
# temperature derating and what a demonstration record has to cover to raise it.
tasks:
  - id: e2006-internal-dielectric-field-limits-1
    query: "The insulator around a 0.8 mm inner conductor inside a 4 mm bore stands off 3 kV. Potential over wall thickness gives a comfortable number, but should I be checking the gradient right at that inner conductor surface against the material cap instead?"
    intent: "ECSS-E-ST-20-06C clause 9.2.3; a coaxial insulator peaks at the inner conductor, so the mean planar field reads compliant while the real gradient is higher"
    expected_skill: "space-systems/ecss/e2006-internal-dielectric-field-limits"
  - id: e2006-internal-dielectric-field-limits-2
    query: "Our polyimide part runs at 140 C, above the knee temperature. Does its cap derate linearly from there, and can a qualification record covering a different material at a lower temperature justify running above the derated value?"
    intent: "ECSS-E-ST-20-06C clause 9.2.3; the cap derates above the knee, and a demonstration record only applies when it names the same material and covers the operating temperature"
    expected_skill: "space-systems/ecss/e2006-internal-dielectric-field-limits"
