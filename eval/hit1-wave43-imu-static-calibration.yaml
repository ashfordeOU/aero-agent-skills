# Hit@1 wave-43 fragment: imu-static-calibration (gnc-autonomy)
# Two tasks per new leaf skill. w43-imu-static-calibration-1 routes on
# six-position-test and rate-table-calibration lab reduction to the
# per-axis bias and scale factors; w43-imu-static-calibration-2 routes
# on accelerometer-bias-scale and gyro bias and scale recovery with the
# misalignment matrix fit over all six positions.
tasks:
  - id: w43-imu-static-calibration-1
    query: "reduce the six-position-test accelerometer holds and the rate-table-calibration gyro runs of an imu-static-calibration lab campaign to the per-axis bias and scale factors with the residual fit errors"
    intent: "gnc-autonomy; offline IMU static calibration reducing six-position accelerometer means against the known +/- 1 g references and rate-table gyro rates against the commanded rates to the per-axis bias and scale factors with the residual fit errors"
    expected_skill: "gnc-autonomy/estimation-filtering/imu-static-calibration"
  - id: w43-imu-static-calibration-2
    query: "recover the accelerometer-bias-scale and gyro bias and scale factor from six-position-test lab data and commanded rate-table-calibration runs, including the misalignment matrix fit over all six positions and the residual fit errors"
    intent: "gnc-autonomy; six-position and rate-table lab data reduction to the IMU accelerometer and gyro bias and scale factors, the cross-axis misalignment matrix from the least-squares fit over all six positions, and the residual fit errors"
    expected_skill: "gnc-autonomy/estimation-filtering/imu-static-calibration"
