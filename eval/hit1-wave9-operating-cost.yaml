# Hit@1 wave-9 fragment: operating-cost (vehicle-design)
# Two tasks per new leaf skill; oc1 routes on the DOC element costs
# (block fuel, crew, maintenance per flight hour), oc2 routes on the
# per flight and per flight hour rollup with insurance and
# utilization. Both must deterministically hit
# vehicle-design/cost-estimation/operating-cost.
tasks:
  - id: oc1
    query: "estimate the direct-operating-cost of the regional jet from the block-fuel-cost the crew-cost and the maintenance-cost per flight hour"
    intent: "operating economics; DOC element costs: block fuel, crew, maintenance per flight hour"
    expected_skill: "vehicle-design/cost-estimation/operating-cost"
  - id: oc2
    query: "compute the cost-per-flight and the cost-per-flight-hour for the operating-cost assessment from the insurance-rate and the aircraft utilization"
