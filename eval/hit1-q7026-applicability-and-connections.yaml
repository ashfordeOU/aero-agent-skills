  - id: ac2
    query: "somebody wants two wires in one machined contact barrel and a third barrel has a solid conductor next to a stranded one, work out how many conductors each crimp type may take and whether the barrel fill ratio is inside its window"
    intent: "ECSS-Q-ST-70-26C framework clause; conductor-count limit per crimp category, refusal of a mixed solid-and-stranded barrel, and barrel fill against its floor and ceiling"
