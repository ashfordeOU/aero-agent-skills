# Hit@1 fragment: e2008-ultraviolet-exposure-test-purpose (space-systems/ecss)
# Two tasks for the leaf. uvp1 routes on why the accelerated exposure is run at
# all and what the mission ultraviolet dose is; uvp2 routes on the reciprocity
# ceiling that decides whether the acceleration is admissible. Both must
# deterministically hit
# space-systems/ecss/e2008-ultraviolet-exposure-test-purpose.
tasks:
  - id: uvp1
    query: "Seven years at 1.2 au with the array lit about 62 percent of each orbit. Before I write the test purpose, how many equivalent sun hours does that come to, and what is the ultraviolet run meant to establish about the stack?"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.15.1; purpose of the accelerated ultraviolet exposure of a photovoltaic assembly"
    expected_skill: "space-systems/ecss/e2008-ultraviolet-exposure-test-purpose"
  - id: uvp2
    query: "decide whether the planned lamp setting for the coverglass adhesive ultraviolet run stays under the reciprocity ceiling while still accumulating the mission ultraviolet dose"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.15.1; ultraviolet acceleration factor against the reciprocity ceiling"
    expected_skill: "space-systems/ecss/e2008-ultraviolet-exposure-test-purpose"
