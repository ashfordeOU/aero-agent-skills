# Hit@1 fragment: e2020-output-impedance-characterisation (space-systems/ecss).
# Two tasks for the leaf. ooic1 routes on the deliverable itself, gain AND
# phase supplied per protection-device class across the specified frequency
# band; ooic2 routes on whether the sweep that arrived is reviewable at all,
# reaching both band edges with enough points per decade and no single step
# wide enough to walk over a resonance. Both must deterministically hit
# space-systems/ecss/e2020-output-impedance-characterisation.
tasks:
  - id: ooic1
    query: "The supplier sent one impedance sweep for the whole LCL family. I need gain and phase for each class over the band we specified, and the worst-case magnitude called out in both ohms and dB with the frequency it happens at."
    intent: "ECSS-E-ST-20-20C clause 5.2.17.1.1; per-class output impedance gain and phase deliverable"
    expected_skill: "space-systems/ecss/e2020-output-impedance-characterisation"
  - id: ooic2
    query: "judge whether the delivered impedance sweep reaches both edges of the specified band, holds the points-per-decade floor and never steps between adjacent frequencies by more than the allowed ratio"
    intent: "ECSS-E-ST-20-20C clause 5.2.17.1.1; output impedance sweep band coverage and resolution review"
    expected_skill: "space-systems/ecss/e2020-output-impedance-characterisation"
