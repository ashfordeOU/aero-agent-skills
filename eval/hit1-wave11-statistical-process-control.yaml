# Hit@1 wave-11 fragment: statistical-process-control (manufacturing-quality)
# Two tasks per new leaf; spc1 routes on SPC formulas (X-bar/R chart
# control limits, process sigma, Cp/Cpk capability indices), spc2 routes
# on process monitoring vocabulary (control chart, out of control, in
# control) that spans quality management and production but must hit
# manufacturing-quality/as9100/statistical-process-control.
tasks:
  - id: spc1
    query: "compute the x-bar and r chart control limits and the cpk process capability index from the subgroup average and range with the a2 and d2 constants"
    intent: "manufacturing quality; X-bar/R chart limits and Cp/Cpk capability indices from subgroup data"
