# Hit@1 fragment: q60-class-2-handling-and-storage (space-systems/ecss)
# hand1 routes on the withstand band and the weakest custody leg; hand2 routes
# on the cumulative open-air minute budget and the store environment margins.
# Both must deterministically hit
# space-systems/ecss/q60-class-2-handling-and-storage.
tasks:
  - id: q60c2hand1
    query: "an ECSS-Q-ST-60C Class 2 part that withstands 500 volts went from the sealed transport container through a bonded store and across one open bench on the way to the line, what protection did it owe and which leg fails the chain"
    intent: "ECSS-Q-ST-60C clause 5.4; Class 2 discharge withstand band, the protection level and measures it owes, and grading every custody leg against the level its location held rather than averaging the chain"
    expected_skill: "space-systems/ecss/q60-class-2-handling-and-storage"
  - id: q60c2hand2
    query: "this Class 2 lot spent 105 minutes out of dry storage across four handling legs and the bonded store logged 32 degrees and 65 percent relative humidity, is it fit for issue or does it go back for reconditioning"
    intent: "ECSS-Q-ST-60C clause 5.4; Class 2 cumulative open-air minute budget excluding dry storage, store temperature and humidity as margins to their nearest limits, the re-inspection clock, and the handling chain disposition"
    expected_skill: "space-systems/ecss/q60-class-2-handling-and-storage"
