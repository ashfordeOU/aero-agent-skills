# Hit@1 fragment: e1024-eicd-element (space-systems/ecss)
# Case 1 routes on categorising the boundary and owing a document at the launcher interface.
# Case 2 routes on medium-family coverage and per-characteristic verification linkage.
tasks:
  - id: e1024-eicd-element-1
    query: "Do we still owe an EICD on the spacecraft side of the launch vehicle boundary when the launcher authority issues its own document, and how is that boundary categorized against an element-to-element one inside the space segment?"
    intent: "ECSS-E-ST-10-24C 5.8.3; the element-to-launcher boundary is its own interface category and the space-segment side is documented irrespective of who owns the other side"
    expected_skill: "space-systems/ecss/e1024-eicd-element"
  - id: e1024-eicd-element-2
    query: "Our EICD lists mechanical, electrical and thermal characteristics but nothing for the RF medium, and several characteristic identifiers have no provision pointing at them. Which of those blocks acceptance, and does a system-level test count as linkage?"
    intent: "ECSS-E-ST-10-24C 5.8.3; an uncovered medium family and an unlinked characteristic are distinct gaps, and a provision has to name the characteristic to count"
    expected_skill: "space-systems/ecss/e1024-eicd-element"
