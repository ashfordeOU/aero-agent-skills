# Hit@1 fragment: e2001-detection-capability-verification (space-systems/ecss)
# Case 1 routes on the ratio itself: response over measured noise floor per channel, and what the whole arrangement may then claim.
# Case 2 routes on the evidence: record ordering against the first run, shelf life, and reconciling records with the declared channel set.
tasks:
  - id: e2001-detection-capability-verification-1
    query: "Before we drive the RF item, each multipactor detection channel has to show it registers an injected reference event. One reads minus 42 dBm against a minus 58 dBm noise floor. How do I judge that against the required registration ratio, and what detectable amplitude may the arrangement as a whole claim?"
    intent: "ECSS-E-ST-20-01C 7.3.1; per-channel ratio over its own measured noise floor against the required registration ratio, and the arrangement capability set by the worst passing channel"
    expected_skill: "space-systems/ecss/e2001-detection-capability-verification"
  - id: e2001-detection-capability-verification-2
    query: "Our chamber has demonstration records for two detection channels, but one is dated three days after the first campaign run, the other came from last year's set-up, and a third declared channel has no record at all. Which of those still stand as evidence for this campaign?"
    intent: "ECSS-E-ST-20-01C 7.3.1; timestamp direction against the first run, the validity window on a stale demonstration, and reconciling records against the declared channel set"
    expected_skill: "space-systems/ecss/e2001-detection-capability-verification"
