# Hit@1 fragment: e2008-sca-thermal-cycling-purpose (space-systems/ecss,
# E-ST-20-08C 6.4.3.7.1). Two tasks per leaf; stcp1 routes on why the cycling
# is applied at all, stcp2 on whether the planned run represents the orbital
# year. Both must deterministically hit
# space-systems/ecss/e2008-sca-thermal-cycling-purpose.
tasks:
  - id: stcp1
    query: "write the rationale for the solar-cell-assembly-thermal-cycling-purpose and say which objectives such as sca-interconnect-thermal-fatigue the sample demonstrates"
    intent: "ecss solar cell assemblies; purpose and reliability objectives of the thermal cycling test"
    expected_skill: "space-systems/ecss/e2008-sca-thermal-cycling-purpose"
  - id: stcp2
    query: "derive the orbital-eclipse-cycle-count for one year and check the planned run meets the eclipse-representative-cycle-budget and the extremes"
    intent: "ecss solar cell assemblies; does the planned cycling represent a year of orbital eclipses"
    expected_skill: "space-systems/ecss/e2008-sca-thermal-cycling-purpose"
