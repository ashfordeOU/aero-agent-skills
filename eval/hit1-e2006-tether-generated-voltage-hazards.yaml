# Hit@1 fragment: e2006-tether-generated-voltage-hazards (space-systems/ecss)
# Case 1 routes on deriving the induced voltage and where the floating point sits.
# Case 2 routes on the separate limits an end and a span are graded against.
tasks:
  - id: e2006-tether-generated-voltage-hazards-1
    query: "A 5 km tether flies at 7.6 km per second through 30 microtesla, its line 25 degrees off the induced field. How do I reach the end-to-end electromotive force, and is an even split about the plasma floating point safe when one end carries an emitter?"
    intent: "ECSS-E-ST-20-06C 10.2.1; the induced field must be projected along the deployed line, and the floating point follows the current balance rather than sitting at the midpoint"
    expected_skill: "space-systems/ecss/e2006-tether-generated-voltage-hazards"
  - id: e2006-tether-generated-voltage-hazards-2
    query: "One tether end sits 90 V negative and a technician can reach it on the bench. It is inside the arc-onset band for that surface, so is it compliant, and how do I check an insulated span withstand against the fraction of the end-to-end voltage it sees?"
    intent: "ECSS-E-ST-20-06C 10.2.1; clearing the arc onset does not clear the handling touch limit, and an insulated span is graded on its withstand-to-stress ratio instead"
    expected_skill: "space-systems/ecss/e2006-tether-generated-voltage-hazards"
