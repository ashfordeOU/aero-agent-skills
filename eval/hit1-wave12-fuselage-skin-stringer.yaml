# sizing, fss2 cross-cutting stiffened panel closure check across the
# skin, stringer, and frame sizing steps.
tasks:
  - id: fss1
    query: "size the fuselage-skin-stringer panel: compute the skin-thickness from the hoop-stress of the pressurized cabin differential pressure with the 1.5 factor of safety and set the stringer-spacing and the frame-pitch from the panel-buckling allowable"
