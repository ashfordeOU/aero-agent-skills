# Hit@1 fragment: e2007-cable-injection-susceptibility-procedure
# (space-systems/ecss, E-ST-20-07C 5.4.8.4). Two tasks per leaf; cisp1 routes
# on the warm-up dwell and the stepped injection frequency list, cisp2 on the
# forward-power cap and the per-step grading. Both must deterministically hit
# space-systems/ecss/e2007-cable-injection-susceptibility-procedure.
tasks:
  - id: cisp1
    query: "check the cable-injection-warm-up-dwell then build the cable-injection-frequency-list and size the bulk-current-injection-step-dwell for a harness current injection"
    intent: "ecss emc; bulk cable-injection procedure, settling dwell and stepped frequency list"
    expected_skill: "space-systems/ecss/e2007-cable-injection-susceptibility-procedure"
  - id: cisp2
    query: "convert the required injection current into forward power, apply the cable-injection-forward-power-limit and do the cable-injection-step-grading for each injected step"
    intent: "ecss emc; injection drive capped by the amplifier and per-step immunity grading"
    expected_skill: "space-systems/ecss/e2007-cable-injection-susceptibility-procedure"
