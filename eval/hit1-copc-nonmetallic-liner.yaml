# Hit@1 fragment: copc-nonmetallic-liner (space-systems/ecss)
# Case 1 routes on polymer-family categorization plus the gas permeation allowable.
# Case 2 routes on the liner-versus-overwrap stiffness share and the pressure factors.
tasks:
  - id: copc-nonmetallic-liner-1
    query: "Our composite overwrapped container uses an HDPE liner holding xenon at 15.5 MPa MEOP, and permeation testing shows 0.04 g per day escaping. Which non-metallic family is that, elastomer, thermoset or thermoplastic, and how is the rate judged?"
    intent: "ECSS-E-ST-32 4.5.3; the case turns on mapping the liner to one of the three polymer families and grading its gas permeation against the project allowable"
    expected_skill: "space-systems/ecss/copc-nonmetallic-liner"
  - id: copc-nonmetallic-liner-2
    query: "On our COPC the liner carries roughly a quarter of the combined axial stiffness, so what does that load-sharing figure oblige us to do, and is the proof factor demonstrated on the overwrap alone or on the whole container?"
    intent: "ECSS-E-ST-32 4.5.3; the case turns on the liner load-share ratio triggering design review and on the factors applying to the container as a system"
    expected_skill: "space-systems/ecss/copc-nonmetallic-liner"
