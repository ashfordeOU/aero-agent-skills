  - id: to2
    query: "the project wants to waive two of the unknowns on this Class 3 procurement, tell me which waivers stand and which programme elements are still owed afterwards"
    intent: "ECSS-Q-ST-60C clause 6.2.3.1; refusing a waiver against a hard trigger or one with no written justification, then returning the outstanding evaluation elements"
    expected_skill: "space-systems/ecss/q60-class-3-evaluation-general-requirements"
