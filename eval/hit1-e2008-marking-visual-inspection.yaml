# Hit@1 fragment: e2008-marking-visual-inspection (space-systems/ecss)
# Two tasks for the new leaf. mkv1 routes on presence and adhesion - the
# drawing-to-part reconciliation and the two lifted fractions; mkv2 routes
# on placement - the rectangular tolerance box and the face check. Both must
# deterministically hit
# space-systems/ecss/e2008-marking-visual-inspection.
tasks:
  - id: mkv1
    query: "reconcile the identification markings the assembly drawing calls out against those on the coupon and grade how much of each marking footprint and perimeter has lifted"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.18; marking presence and adhesion grading"
    expected_skill: "space-systems/ecss/e2008-marking-visual-inspection"
  - id: mkv2
    query: "disposition an identification marking on the larger of its two axis errors inside the rectangular placement box and on whether it was applied to the face the drawing nominates"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.18; marking location tolerance box and face check"
    expected_skill: "space-systems/ecss/e2008-marking-visual-inspection"
