# Hit@1 fragment: e2006-electric-propulsion-description (space-systems/ecss)
# Case 1 routes on net exhaust charge, not acceleration family, deciding the
# neutraliser requirement. Case 2 routes on deriving extracted beam current from
# thrust, specific impulse and propellant ion charge to mass.
tasks:
  - id: e2006-electric-propulsion-description-1
    query: "We fly a pulsed plasma thruster and a Hall thruster, both in the same acceleration family. Does that shared family mean both need an electron-emitting neutraliser, and which charging interactions does each one actually drive?"
    intent: "ECSS-E-ST-20-06C 11.1.1; the neutraliser requirement keys off whether the exhaust carries net charge, not off the acceleration family the unit belongs to"
    expected_skill: "space-systems/ecss/e2006-electric-propulsion-description"
  - id: e2006-electric-propulsion-description-2
    query: "Our hall-effect-thruster gives 145 millinewtons at 1750 seconds specific impulse. For the ECSS spacecraft charging survey, how is the extracted beam current derived from those figures, and what does a doubly-charged ion population change?"
    intent: "ECSS-E-ST-20-06C 11.1.1; beam current follows from exhaust velocity, mass flow and the propellant charge-to-mass ratio at the operating point being assessed"
    expected_skill: "space-systems/ecss/e2006-electric-propulsion-description"
