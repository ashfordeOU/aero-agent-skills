# Hit@1 fragment: q60-class-3-handling-and-storage (space-systems/ecss)
# Two tasks for the leaf. hs60a routes on spending a moisture floor-life budget
# at a rate per environment, with sealed nitrogen free; hs60b routes on a bake
# that resets the spend rather than discounting it, and on the protective
# packaging chain read innermost first. Both must deterministically hit
# space-systems/ecss/q60-class-3-handling-and-storage.
tasks:
  - id: hs60a
    query: "these class 3 parts spent forty hours out on the cleanroom bench and five hundred more in sealed dry nitrogen, work out how much of their open-exposure budget is actually gone and whether they can still be issued"
    intent: "ECSS-Q-ST-60C clause 6.4; moisture floor-life budget spent at a per-environment rate, with sealed nitrogen costing nothing against it"
    expected_skill: "space-systems/ecss/q60-class-3-handling-and-storage"
  - id: hs60b
    query: "the lot went over its exposure budget and stores ran a three hour bake at 125 C, then repacked it with the cushioned outer inside the barrier bag, decide whether it is fit to issue, needs baking again or has to be repacked"
    intent: "ECSS-Q-ST-60C clause 6.4; bake qualification resetting rather than discounting the spend, and the protective packaging chain read innermost first"
    expected_skill: "space-systems/ecss/q60-class-3-handling-and-storage"
