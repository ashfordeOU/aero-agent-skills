# Hit@1 fragment: q40-verification-planning (space-systems/ecss)
# Two tasks for the new leaf. vp1 routes on severity withdrawing the weaker
# verification methods and on an analysis needing correlated test data behind
# it; vp2 routes on the closure milestone a severity allows and on the planned
# verification report. Both must deterministically hit
# space-systems/ecss/q40-verification-planning.
tasks:
  - id: vp1
    query: "the plan verifies a catastrophic safety requirement by similarity to the previous build and leans on analysis with no correlated test data to support it; grade whether that method assignment is supportable at that severity before I sign"
    intent: "ECSS-Q-ST-40C safety verification planning; severity fixes the admissible method set and an analysis at catastrophic severity needs correlated test data"
    expected_skill: "space-systems/ecss/q40-verification-planning"
  - id: vp2
    query: "half our safety requirements are planned to close only at acceptance review and none of them has a verification report planned at all; grade this safety verification plan and say which severities cannot wait that late for closure"
    intent: "ECSS-Q-ST-40C safety verification planning; closure milestone by severity, a planned verification report per requirement, and coverage across the plan"
    expected_skill: "space-systems/ecss/q40-verification-planning"
