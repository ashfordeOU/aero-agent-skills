# Hit@1 wave-5 fragment: calibration-control (manufacturing-quality/as9100)
# Two tasks per new leaf; cal1 routes on TAR and due-date verdicts, cal2
# on the out-of-tolerance recall decision. Both must deterministically
# hit manufacturing-quality/as9100/calibration-control.
tasks:
  - id: cal1
    query: "calculate the test accuracy ratio verdict for a calibration standard versus the unit under test and check whether the instrument is past its calibration due date"
    intent: "manufacturing quality; TAR verdict and calibration due status per AS9100"
    expected_skill: "manufacturing-quality/as9100/calibration-control"
  - id: cal2
    query: "decide whether to recall product or review records when an out of tolerance calibration standard drifted during the affected period"
    intent: "manufacturing quality; out-of-tolerance impact, recall versus review decision"
    expected_skill: "manufacturing-quality/as9100/calibration-control"
