# Hit@1 fragment: q6013-class-2-self-made-magnetics (space-systems/ecss)
# Two tasks for the new leaf. smm2a routes on the build basis of a magnetic a
# supplier wound to the project's drawing; smm2b routes on the split between
# per-unit and sample-drawn screening and on sizing that sample from the lot.
# Both must deterministically hit
# space-systems/ecss/q6013-class-2-self-made-magnetics.
tasks:
  - id: smm2a
    query: "our subcontractor wound this transformer to our drawing, check the build basis: is the drawing issue on the acceptance data, is their winding process released, and does the core still have margin at the hot case"
    intent: "ECSS-Q-ST-60-13C clause 5.6.8; supplier build standard and issue, released winding process, winding current density and hot-case flux utilization for an intermediate class magnetic"
    expected_skill: "space-systems/ecss/q6013-class-2-self-made-magnetics"
  - id: smm2b
    query: "how many units of this wound inductor lot do we have to screen on sample versus every piece, and which screening steps were never run on the delivery"
    intent: "ECSS-Q-ST-60-13C clause 5.6.8; per-unit against sample-drawn screening coverage and sample size derived from the delivery lot"
    expected_skill: "space-systems/ecss/q6013-class-2-self-made-magnetics"
