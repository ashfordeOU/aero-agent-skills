# Hit@1 fragment: inspectability-and-serviceability-design (space-systems/ecss)
# Case 1 routes on access clearance for the nominated inspection method.
# Case 2 routes on the dismounting cycle rating and the galling-risk pairing.
tasks:
  - id: inspectability-and-serviceability-design-1
    query: "A primary joint on our thrust tube leaves only 9 mm of clearance and the plan calls for direct visual inspection. The margin of safety there is comfortable. Does a healthy margin excuse the access, or must the method change?"
    intent: "ECSS-E-ST-32C clause 4.5.1; a physical access path meeting the method's clearance is required, and analysis confidence is not a substitute for it"
    expected_skill: "space-systems/ecss/inspectability-and-serviceability-design"
  - id: inspectability-and-serviceability-design-2
    query: "A titanium to titanium bolted joint must be dismounted six times during integration. What assembly and disassembly cycle count does the design owe for dismountability, and does that metal pair need anti-galling treatment on record?"
    intent: "ECSS-E-ST-32C clause 4.5.4; the joint is rated for the programme cycle count, and a same-family metal pair under clamp load owes a specified anti-galling treatment"
    expected_skill: "space-systems/ecss/inspectability-and-serviceability-design"
