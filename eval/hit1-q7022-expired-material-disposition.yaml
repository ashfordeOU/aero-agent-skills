# Hit@1 fragment: q7022-expired-material-disposition (space-systems/ecss)
# Two tasks for the new leaf. emd1 routes on the re-test-or-scrap eligibility
# screen for a lot found past its date; emd2 routes on sizing the extension a
# clean re-validation earns and the budget that shrinks it. Both must
# deterministically hit
# space-systems/ecss/q7022-expired-material-disposition.
tasks:
  - id: emd1
    query: "stores found a drum ninety days past its expiry, so give me the overrun against its original shelf life as a fraction, check whether the lot is even eligible for re-validation, and close it as re-test, extension, refusal or scrap"
    intent: "ECSS-Q-ST-70-22C use control; overrun as a fraction of the original shelf life, families with no re-validation route, and a storage excursion that removes eligibility outright"
    expected_skill: "space-systems/ecss/q7022-expired-material-disposition"
  - id: emd2
    query: "the re-validation results on this expired epoxy all came back inside their acceptance windows, how much extra life does that buy and what new expiry do I issue"
    intent: "ECSS-Q-ST-70-22C use control; extension sized as a bounded fraction of the original shelf life, halving with each extension already granted"
    expected_skill: "space-systems/ecss/q7022-expired-material-disposition"
