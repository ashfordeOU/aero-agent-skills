# Hit@1 fragment: e2008-photovoltaic-assembly-scope-description (space-systems/ecss)
# Two tasks for the new leaf. pas1 routes on what the assembly covers and where
# its boundary of supply stops; pas2 routes on the configuration family derived
# from the array attributes and the provisions that family pulls in. Both must
# deterministically hit
# space-systems/ecss/e2008-photovoltaic-assembly-scope-description.
tasks:
  - id: pas1
    query: "establish what the photovoltaic assembly covers and where its boundary of supply stops at the array connector and the panel mounting interface"
    intent: "ECSS-E-ST-20-08C clause 5.1.1; extent of the photovoltaic assembly and its boundary of supply"
    expected_skill: "space-systems/ecss/e2008-photovoltaic-assembly-scope-description"
  - id: pas2
    query: "This wing rides on a spinning drum, rigid substrate, nothing deploys, concentration ratio one. Which configuration family does that make it, and which provisions ride along with that family on top of the ones every array carries?"
    intent: "ECSS-E-ST-20-08C clause 5.1.1; array configurations the clause addresses and their provisions"
    expected_skill: "space-systems/ecss/e2008-photovoltaic-assembly-scope-description"
