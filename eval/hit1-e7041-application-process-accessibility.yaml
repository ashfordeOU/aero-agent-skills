# Hit@1 fragment: e7041-application-process-accessibility (space-systems/ecss)
# Two tasks for the new leaf. apac1 routes on the declaration that bounds what a
# connection test can address at all; apac2 routes on the declared entry naming no
# defined process. Both must deterministically hit
# space-systems/ecss/e7041-application-process-accessibility.
tasks:
  - id: apac1
    query: "the test service refused to even build a request against that on-board process, the process is definitely alive and sending telemetry, work out what the refusal is telling us"
    intent: "ECSS-E-ST-70-41C clause 6.17.4.1; reach is declared per test-service instance and is never implied by a process existing, so a refusal is a statement about the declaration and nothing was learned about the target"
    expected_skill: "space-systems/ecss/e7041-application-process-accessibility"
  - id: apac2
    query: "compare what the test service says it can address against the application processes the mission actually defines and tell me how much of the platform a clean sweep would have covered"
    intent: "ECSS-E-ST-70-41C clause 6.17.4.1; a declared entry naming no defined process is a stale declaration that reaches nothing, and coverage against the defined set is the honest summary while a count of declared entries rises with the stale ones"
    expected_skill: "space-systems/ecss/e7041-application-process-accessibility"
