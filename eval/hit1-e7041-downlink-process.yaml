# Hit@1 fragment: e7041-downlink-process (space-systems/ecss)
# Two tasks for the new leaf. dlp1 routes on the first/intermediate/last part
# run and its numbering; dlp2 routes on what the subservice emits when the
# transfer is abandoned part way. Both must deterministically hit
# space-systems/ecss/e7041-downlink-process.
tasks:
  - id: dlp1
    query: "split this large message into the run of downlink parts the subservice sends and check the numbering and the octets really cover the whole message with nothing short in the middle"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.3; first, intermediate and last downlink part run, numbering from one and contiguous coverage"
    expected_skill: "space-systems/ecss/e7041-downlink-process"
  - id: dlp2
    query: "the store read failed while we were half way through sending a large message down, say what the subservice still has to emit and what the ground ends up holding"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.3; truncated part run, downlink abort report and the named failure reason"
    expected_skill: "space-systems/ecss/e7041-downlink-process"
