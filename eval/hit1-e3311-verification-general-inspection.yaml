# Hit@1 fragment: e3311-verification-general-inspection (space-systems/ecss)
# Two tasks for the new leaf. vgi1 routes on the method choice when the proving
# test consumes the article; vgi2 routes on the inspection coverage a critical
# characteristic cannot be averaged out of. Both must deterministically hit
# space-systems/ecss/e3311-verification-general-inspection.
tasks:
  - id: vgi1
    query: "the only way to prove the initiator fires is to fire it, so work out how each requirement on it gets closed, which article the evidence belongs to and how many units to draw from a lot of sixty"
    intent: "ECSS-E-ST-33-11C clause 4.14.1; method and article selection for a one-shot device, the test moved onto a lot sample and the sample sized from the lot"
    expected_skill: "space-systems/ecss/e3311-verification-general-inspection"
  - id: vgi2
    query: "our inspection sheet covers thirty nine of forty characteristics and the one left out is marked critical, tell me whether that coverage is acceptable and what the flight unit still owes after the sample was fired"
    intent: "ECSS-E-ST-33-11C clause 4.14.2; inspection coverage graded with no exemption for a critical characteristic, plus the companion inspection the flight article inherits"
    expected_skill: "space-systems/ecss/e3311-verification-general-inspection"
