# Hit@1 wave-8 fragment: magnetorquer-control (space-systems/adcs)
# Two tasks per new leaf; magnetorquer-control-w8-1 routes on dipole
# moment computation from a torque demand against the local magnetic
# field (cross-product torque = m x B) and the torque authority
# limit, magnetorquer-control-w8-2 routes on the B-dot detumbling law
# and torque rod coil sizing. Both must deterministically hit
# space-systems/adcs/magnetorquer-control.
tasks:
  - id: magnetorquer-control-w8-1
    query: "compute the magnetorquer dipole moment from a torque demand and the local magnetic field vector and check the torque authority limit"
    intent: "ADCS; magnetic dipole moment from torque demand and local B-field, cross-product torque = m x B, torque authority limit"
    expected_skill: "space-systems/adcs/magnetorquer-control"
  - id: magnetorquer-control-w8-2
    query: "detumbling spacecraft with the b-dot law magnetorquer dipole torque rod"
    intent: "ADCS; B-dot detumbling law for rate damping with magnetorquer dipoles and torque rod coil sizing"
    expected_skill: "space-systems/adcs/magnetorquer-control"
