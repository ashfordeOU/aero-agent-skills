# Hit@1 fragment: e2006-tether-description-and-applicability (space-systems/ecss)
# Case 1 routes on the membership gate itself: geometry and the spanning of two bodies, not mission intent.
# Case 2 routes on what the decision drags in: the hazard family set from conductor and orbit regime, and a family with no named owner.
tasks:
  - id: e2006-tether-description-and-applicability-1
    query: "Our configuration deploys a 40 m umbilical 3 mm across between the mothercraft and a free-flying inspector, and also carries a 2 m rigid boom. Which of those deployed elements do the electrical provisions attach to, and does slenderness or the spanning of two separated bodies settle it?"
    intent: "ECSS-E-ST-20-06C 10.1; membership decided by deployed length, length-to-diameter slenderness and the spanning of two separated bodies rather than by mission function"
    expected_skill: "space-systems/ecss/e2006-tether-description-and-applicability"
  - id: e2006-tether-description-and-applicability-2
    query: "Our conducting deployed line flies a geostationary transfer leg rather than a dense low orbit. Once the motional end-potential and the plasma current collection fall away, which hazard families does it still bring into the design, and what do I record for a family nobody owns?"
    intent: "ECSS-E-ST-20-06C 10.1; hazard family enumeration gated by conductor construction and orbit regime, and the finding raised for an in-scope family with no control owner"
    expected_skill: "space-systems/ecss/e2006-tether-description-and-applicability"
