# Hit@1 fragment: e2008-failed-bare-cell-components (space-systems/ecss)
# Two tasks for the new leaf. fbcc1 routes on the treatment a component
# exhibiting a listed mode receives; fbcc2 routes on rework against scrap, the
# retained test article and the delivered quantity the withdrawals leave. Both
# must deterministically hit
# space-systems/ecss/e2008-failed-bare-cell-components.
tasks:
  - id: fbcc1
    query: "a bare cell component exhibits one listed failure mode; withdraw it from the deliverable population, segregate it and raise the non-conformance entry against it"
    intent: "ECSS-E-ST-20-08C clause 7.6.2; treatment of a component exhibiting any listed failure mode"
    expected_skill: "space-systems/ecss/e2008-failed-bare-cell-components"
  - id: fbcc2
    query: "say whether a withdrawn bare cell component may be reworked or has to be scrapped, whether a failed test article is retained, and how short the withdrawals leave the ordered quantity"
    intent: "ECSS-E-ST-20-08C clause 7.6.2; rework admissibility, scrap disposition, retained test article and lot quantity shortfall"
    expected_skill: "space-systems/ecss/e2008-failed-bare-cell-components"
