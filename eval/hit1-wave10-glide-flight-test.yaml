# and lift to drag wording overlaps flight-mechanics/performance/
# glide-performance (unpowered glide math), so the idle thrust and
# flight test anchors must deterministically route it to the leaf.
tasks:
  - id: glf1
    query: "measure the sink rate and the lift to drag ratio from the idle thrust glide test and locate the best glide speed for the flight test"
    intent: "flight test; idle thrust glide test sink rate and L/D measurement"
    expected_skill: "flight-test-operations/performance/glide-flight-test"
  - id: glf2
    query: "correct the glide test sink rate for the weight change and the residual idle thrust and report the lift to drag ratio for the flight test program"
    intent: "flight test; glide test corrections for weight and idle thrust"
    expected_skill: "flight-test-operations/performance/glide-flight-test"
