# Hit@1 fragment: e2008-thermal-cycling-qualification-coupon (space-systems/ecss)
# Two tasks for the leaf; tq1 routes on recording the cycling coupon by drawing
# or definition matrix, tq2 on the coupon feature-family register and its
# representativeness. Both must deterministically hit
# space-systems/ecss/e2008-thermal-cycling-qualification-coupon.
tasks:
  - id: tq1
    query: "define the solar-array cycling coupon and tie every coupon feature to a drawing reference or a definition-matrix cell"
    intent: "space systems ECSS; cycling coupon definition recorded by drawing or matrix"
    expected_skill: "space-systems/ecss/e2008-thermal-cycling-qualification-coupon"
  - id: tq2
    query: "does the cycling coupon register cover the cell, interconnect, coverglass, adhesive, substrate and wiring-termination families of the flight photovoltaic assembly"
    intent: "space systems ECSS; coupon feature-family register and representativeness coverage"
    expected_skill: "space-systems/ecss/e2008-thermal-cycling-qualification-coupon"
