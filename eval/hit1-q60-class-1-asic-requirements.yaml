# Hit@1 fragment: q60-class-1-asic-requirements (space-systems/ecss)
# Two tasks for the leaf. car1 routes on the referral of a class 1 ASIC to the
# dedicated development standard; car2 routes on the heritage delta axes that
# decide full development against delta qualification against reuse. Both must
# deterministically hit space-systems/ecss/q60-class-1-asic-requirements.
tasks:
  - id: car1
    query: "A brand new ASIC is being developed for a class 1 payload. Our parts standard appears to pass the job across to a separate ASIC and FPGA standard. Which development flow does the part land in there, and which activities does that route carry?"
    intent: "ECSS-Q-ST-60C clause 4.6.2; class 1 ASIC development routing and referral to the dedicated standard"
    expected_skill: "space-systems/ecss/q60-class-1-asic-requirements"
  - id: car2
    query: "Vendor calls this ASIC flight proven, yet the foundry changed, the process node shrank, a new mask set was cut and the package differs. Their qualification closed seven years ago. Against that heritage, is this reuse or a delta qualification?"
    intent: "ECSS-Q-ST-60C clause 4.6.2; ASIC heritage delta axes, reuse evidence gap and qualification currency"
    expected_skill: "space-systems/ecss/q60-class-1-asic-requirements"
