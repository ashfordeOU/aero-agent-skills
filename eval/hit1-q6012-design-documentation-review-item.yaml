  - id: ddr2
    query: "in this die design record the qualification report cites a test plan number nothing in the record contains, and the layout drawing cites nothing at all; trace each chain of derivation upward and tell a dangling reference from a loop and from an orphan"
    intent: "ECSS-Q-ST-60-12C clause 7.3.13; walking each derivation chain to a root separates a reference the record does not contain and a loop, which break the structure, from an orphan document with nothing above it"
    expected_skill: "space-systems/ecss/q6012-design-documentation-review-item"
