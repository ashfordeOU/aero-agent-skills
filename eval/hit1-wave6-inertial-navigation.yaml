# Hit@1 wave-6 fragment: inertial-navigation (gnc-autonomy/navigation)
# Two tasks per new leaf; in1 routes on INS position error growth from
# accelerometer bias and gyro drift, in2 routes on Schuler tuning,
# strapdown mechanization, gyrocompass alignment, and INS/GPS
# integration. Both must deterministically hit
# gnc-autonomy/navigation/inertial-navigation.
tasks:
  - id: in1
    query: "estimate the position error growth of the inertial navigation system from the accelerometer bias and the gyro drift"
    intent: "inertial navigation; position error growth from accelerometer bias double integration and gyro drift"
    expected_skill: "gnc-autonomy/navigation/inertial-navigation"
  - id: in2
    query: "check the schuler period and the leveling response of the strapdown inertial navigation system and scope the gyrocompass alignment and the ins gps integration"
    intent: "inertial navigation; Schuler tuning, strapdown mechanization, gyrocompass alignment, INS/GPS integration"
    expected_skill: "gnc-autonomy/navigation/inertial-navigation"
