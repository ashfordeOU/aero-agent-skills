# Hit@1 fragment: e2006-secondary-arc-test-exemption (space-systems/ecss)
# Case 1 routes on how the worst-case voltage is built rather than quoted.
# Case 2 routes on the current side of the exemption and the record behind it.
tasks:
  - id: e2006-secondary-arc-test-exemption-1
    query: "Our array runs on a 52 V nominal bus. Can I claim the low-voltage exemption from the secondary-arc campaign on that nameplate figure, or must the string-to-string worst case be assembled from the cold open-circuit point plus the regulator transient contribution?"
    intent: "ECSS-E-ST-20-06C 7.2.3.1; the cold open-circuit excursion and the regulation transient routinely lift a low-voltage array past an onset the nameplate clears"
    expected_skill: "space-systems/ecss/e2006-secondary-arc-test-exemption"
  - id: e2006-secondary-arc-test-exemption-2
    query: "Eight parallel strings feed the same array section. Judging whether an arc could be sustained there, do I take one string current or the accumulated one, and what becomes of the exemption when the evidence record is missing items?"
    intent: "ECSS-E-ST-20-06C 7.2.3.1; the sustaining current is the sum every parallel string can feed one site, and an incomplete evidence package refuses the exemption on its own"
    expected_skill: "space-systems/ecss/e2006-secondary-arc-test-exemption"
