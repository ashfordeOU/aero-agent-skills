# Hit@1 fragment: q7026-microsection-verification (space-systems/ecss)
# Two tasks for the new leaf. mv1 routes on grading the compression seen in a
# sectioned barrel; mv2 routes on a cut taken outside the crimp zone and the
# sectioning rate. Both must deterministically hit
# space-systems/ecss/q7026-microsection-verification.
tasks:
  - id: mv1
    query: "grade the crimp microsection: compression ratio from the sectioned conductor area, the voids between the strands and the thinnest barrel wall"
    intent: "ECSS-Q-ST-70-26 quality; crimp cross-section compression, voids and wall thinning"
    expected_skill: "space-systems/ecss/q7026-microsection-verification"
  - id: mv2
    query: "the polished cut was taken outside the crimp zone and only one section was taken for the whole lot, what does that do to the sectioning programme"
    intent: "ECSS-Q-ST-70-26 quality; section plane location and microsection sample frequency"
    expected_skill: "space-systems/ecss/q7026-microsection-verification"
