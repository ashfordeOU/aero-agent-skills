# Hit@1 wave-23 fragment: key-characteristic-management (manufacturing-quality/as9103)
# Two tasks per new leaf skill. w23-key-characteristic-management-1 routes on
# AS9103-style KC identification, risk ranking, and variation management plan
# assignment with Cpk targets; w23-key-characteristic-management-2 routes on the
# KC revalidation trigger and evidence after a tooling change. Both must hit
# manufacturing-quality/as9103/key-characteristic-management and must NOT route
# to as9102/delta-fai (change classification there is FAI-scope specific),
# statistical-process-control (chart math), or nonconformance-control.
tasks:
  - id: w23-key-characteristic-management-1
    query: "identify the key characteristics from the drawing and process history for the actuator housing: classify each characteristic record as a key characteristic or non-key, rank the KCs by risk score, and assign the variation management plan with control method, sampling frequency, and Cpk targets for the key characteristics"
    intent: "manufacturing-quality; AS9103 key characteristic identification, KC risk ranking, and variation management plan assignment with Cpk targets"
    expected_skill: "manufacturing-quality/as9103/key-characteristic-management"
  - id: w23-key-characteristic-management-2
    query: "the tooling changed for a key characteristic part, does the change trigger KC revalidation and what evidence is needed before production restarts"
    intent: "manufacturing-quality; KC revalidation trigger decision and required evidence for a tooling change on a key characteristic"
    expected_skill: "manufacturing-quality/as9103/key-characteristic-management"
