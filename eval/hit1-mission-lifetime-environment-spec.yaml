# Hit@1 fragment: mission-lifetime-environment-spec (space-systems/ecss)
# Case 1 routes on the declared duration and the factors that turn it into qualification and acceptance endurance.
# Case 2 routes on the environment inventory: origin category per family, phase assignment, and entries with no number.
tasks:
  - id: mission-lifetime-environment-spec-1
    query: "We are declaring a 12 year design lifetime for our spacecraft structure programme. What qualification and acceptance durations follow, is a 1.4 qualification life factor acceptable, and must this be locked before margins, allowables and fatigue life are sized?"
    intent: "ECSS-E-ST-32 4.2.1; the reference design duration and the minimum life factors that derive qualification and acceptance endurance from it"
    expected_skill: "space-systems/ecss/mission-lifetime-environment-spec"
  - id: mission-lifetime-environment-spec-2
    query: "Our inventory names atomic oxygen and thruster plume heating but neither carries a number, and debris is written against every phase including launch. How do I split natural from induced, and does an entry with no quantified level count towards completeness?"
    intent: "ECSS-E-ST-32 4.2.2; single-origin assignment of each environment family, explicit phase activation, and an unquantified entry treated as an open finding rather than a pass"
    expected_skill: "space-systems/ecss/mission-lifetime-environment-spec"
