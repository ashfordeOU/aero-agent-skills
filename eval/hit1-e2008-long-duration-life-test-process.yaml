# Hit@1 fragment: e2008-long-duration-life-test-process (space-systems/ecss)
# Two tasks for the leaf. ldx1 routes on the closed menu of four approaches and
# the single documented choice; ldx2 routes on the approach-specific evidence
# set and the laboratory hours the choice costs. Both must deterministically hit
# space-systems/ecss/e2008-long-duration-life-test-process.
tasks:
  - id: ldx1
    query: "Our photovoltaic assembly supplier describes their life test in prose but never names which of the permitted methods it is, and one subgroup shows up under two of them. Which single approach have they committed to, and is that choice written down anywhere?"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.18.2; selection of one accepted long duration life test approach"
    expected_skill: "space-systems/ecss/e2008-long-duration-life-test-process"
  - id: ldx2
    query: "hold an accelerated life test approach to the activation energy and factor derivation a real time run does not need, then check the laboratory hours it costs fit the programme window"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.18.2; approach-specific documentation record and schedule feasibility"
    expected_skill: "space-systems/ecss/e2008-long-duration-life-test-process"
