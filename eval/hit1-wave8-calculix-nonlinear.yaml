# Hit@1 wave-8 fragment: calculix-nonlinear (structures/fem)
# Two tasks per new leaf; calculix-nonlinear-w8-1 routes on the
# Newton-Raphson solve of the state-dependent stiffness bar,
# calculix-nonlinear-w8-2 routes on load stepping and the convergence
# verdict. Both must deterministically hit structures/fem/calculix-nonlinear.
tasks:
  - id: calculix-nonlinear-w8-1
    query: "solve the nonlinear bar equilibrium by Newton-Raphson with the state dependent stiffness and tangent stiffness"
    intent: "structures; nonlinear FEM Newton-Raphson solve with state-dependent stiffness"
    expected_skill: "structures/fem/calculix-nonlinear"
  - id: calculix-nonlinear-w8-2
    query: "apply the total load in equal load steps and report the convergence verdict from the residual norm for the calculix nonlinear run"
    intent: "structures; load stepping with residual convergence verdict for a nonlinear ccx run"
    expected_skill: "structures/fem/calculix-nonlinear"
