# Hit@1 fragment: e2008-working-standard-visual-requirements (space-systems/ecss)
# Two tasks for the new leaf. wsvr1 routes on deciding which of the cell and
# assembly defect rules reach a secondary working standard; wsvr2 routes on the
# current bias that obscured active area puts on every transfer made with the
# device. Both must deterministically hit
# space-systems/ecss/e2008-working-standard-visual-requirements.
tasks:
  - id: wsvr1
    query: "work out which of the solar cell and cell assembly visible defect rules reach the secondary working standard and disposition the marks found on it"
    intent: "ECSS-E-ST-20-08C clause 10.2.2.3.1; visible defect rules applied to a secondary working standard"
    expected_skill: "space-systems/ecss/e2008-working-standard-visual-requirements"
  - id: wsvr2
    query: "add the shaded and missing active area on the working standard up and say what short circuit current bias a transfer through it would inherit"
    intent: "ECSS-E-ST-20-08C clause 10.2.2.3.1; working standard active area obscuration and fitness for transfer"
    expected_skill: "space-systems/ecss/e2008-working-standard-visual-requirements"
