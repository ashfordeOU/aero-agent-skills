# Hit@1 fragment: e7041-enumerated (space-systems/ecss)
# Two tasks for the new leaf. enum1 routes on a received code the database does
# not define and the refusal to substitute a symbol for it; enum2 routes on
# sizing the code field from the largest declared code rather than the entry
# count. Both must deterministically hit
# space-systems/ecss/e7041-enumerated.
tasks:
  - id: enum1
    query: "a housekeeping report came back carrying a code our enumeration table does not hold, so do we map it onto the nearest symbol we know or hand it back as undefined, and how many spare codes does the field width still leave"
    intent: "ECSS-E-ST-70-41C clause 7.3.3; a code outside the declared symbol set is an undefined value and is reported as undefined rather than resolved to a default symbol"
    expected_skill: "space-systems/ecss/e7041-enumerated"
  - id: enum2
    query: "we are adding two more states to a mode parameter whose codes run 0, 1, 2 and 7, tell me how many bits the coded field actually needs and whether the new states fit"
    intent: "ECSS-E-ST-70-41C clause 7.3.3; the width of an enumerated code field comes from the bit length of the largest declared code, not from the number of entries, and the unclaimed codes are the only headroom a new state has"
    expected_skill: "space-systems/ecss/e7041-enumerated"
