# Hit@1 fragment: q7050-tape-lift-sampling (space-systems/ecss)
# Two tasks for the new leaf. tls1 routes on the recovery correction and the
# cumulative form a surface cleanliness level is stated in; tls2 routes on the
# blank lift and the small patch scaled onto the reference area. Both must
# deterministically hit space-systems/ecss/q7050-tape-lift-sampling.
tasks:
  - id: tls1
    query: "we pulled a tape off the bracket and counted the particles by size under the microscope, how do I correct for what the tape left behind and read it against the cleanliness level on the drawing"
    intent: "ECSS-Q-ST-70-50C surface clause; recovery efficiency divides the lifted count and the bands accumulate from the largest size down before grading"
    expected_skill: "space-systems/ecss/q7050-tape-lift-sampling"
  - id: tls2
    query: "nobody ran a blank lift and the patch we took was only a few square centimetres; what does that do to the recovery efficiency correction and the cumulative band counts once they are scaled up to the reference area behind the cleanliness level"
    intent: "ECSS-Q-ST-70-50C surface clause; a blank lift removes the tape's own inclusions, and the area ratio multiplies sampling variance along with the particles"
    expected_skill: "space-systems/ecss/q7050-tape-lift-sampling"
