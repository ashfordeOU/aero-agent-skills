# Hit@1 fragment: e20-electrical-design-verification-provisions (space-systems/ecss)
# Case 1 routes on which method actually produces evidence for a given requirement characteristic.
# Case 2 routes on milestone feasibility and the completeness of the provision matrix.
tasks:
  - id: e20-electrical-design-verification-provisions-1
    query: "Each electrical or electronic requirement in our unit spec needs a verification provision. Workmanship, part-selection and an EMC margin requirement sit side by side: which method is admissible for each, and which may never close on a design-data narrative?"
    intent: "ECSS-E-ST-20C 4.3.1; the characteristic constrains the admissible method, so an observable closes by inspection while a quantitative one cannot rest on a design argument"
    expected_skill: "space-systems/ecss/e20-electrical-design-verification-provisions"
  - id: e20-electrical-design-verification-provisions-2
    query: "Our electrical verification matrix puts an inspection closing at PDR and an analysis at SRR. May a provision name a milestone that its method cannot physically deliver by, and how do I prove no requirement is uncovered and no provision is an orphan?"
    intent: "ECSS-E-ST-20C 4.3.1; a provision cannot close before the evidence its method needs exists, and the matrix is complete only with no uncovered requirement and no orphan provision"
    expected_skill: "space-systems/ecss/e20-electrical-design-verification-provisions"
