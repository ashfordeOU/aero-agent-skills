# Hit@1 fragment: q7080-process-window-qualification (space-systems/ecss)
# Two tasks for the new leaf. pwq1 routes on grading the coupon campaign that
# was actually run against the declared window; pwq2 routes on the difference
# between a missing window bound and a thin interior. Both must deterministically
# hit space-systems/ecss/q7080-process-window-qualification.
tasks:
  - id: pwq1
    query: "our declared window has bounds nobody ever ran at - every run in this campaign sat comfortably in the interior. Grade the evidence: is the window qualified as declared, or does it stand only with a coverage gap recorded against it"
    intent: "ECSS-Q-ST-70-80 process clause; window-bound coverage, a declared window is not qualified by a campaign whose runs only ever sat in its interior"
    expected_skill: "space-systems/ecss/q7080-process-window-qualification"
  - id: pwq2
    query: "one run in this campaign left a setting blank in the log and nothing was ever run at the top of the declared range - does an unrecorded value count as an excursion and fail the window, or is it just a coverage note"
    intent: "ECSS-Q-ST-70-80 process clause; an unrecorded parameter is an excursion, a missing window bound is fatal, thin interior coverage is a standing finding"
    expected_skill: "space-systems/ecss/q7080-process-window-qualification"
