# Hit@1 wave-25 fragment: spoiler-sizing (vehicle-design)
# Two tasks per new leaf skill. w25-spoiler-sizing-1 routes on the
# ground spoiler lift dump plus flight spoiler roll assist share and
# the speed brake drag increment; w25-spoiler-sizing-2 routes on the
# flight spoiler panel area and deflection for the roll damping
# assist and the actuator hinge moment. Both must deterministically
# hit vehicle-design/sizing/spoiler-sizing.
tasks:
  - id: w25-spoiler-sizing-1
    query: "size the ground spoiler panels to dump 60 percent of the wing lift on touchdown and the flight spoilers for the roll assist share, then estimate the speed brake drag increment at the landing speed"
    intent: "vehicle-design; ground spoiler lift dump sizing and flight spoiler roll assist share with the speed brake drag increment at the landing speed"
    expected_skill: "vehicle-design/sizing/spoiler-sizing"
  - id: w25-spoiler-sizing-2
    query: "compute the spoiler panel area and deflection that deliver the roll damping assist for the outboard wing and the hinge moment for the actuator at the maneuver dynamic pressure"
    intent: "vehicle-design; flight spoiler panel area and deflection for the roll damping assist with the actuator hinge moment at the maneuver dynamic pressure"
    expected_skill: "vehicle-design/sizing/spoiler-sizing"
