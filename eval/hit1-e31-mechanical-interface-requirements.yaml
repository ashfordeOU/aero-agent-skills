# Hit@1 fragment: e31-mechanical-interface-requirements (space-systems/ecss)
# Two tasks for the new leaf. mir1 routes on the mounting-interface conductance
# the bolt preload and the declared filler actually deliver; mir2 routes on the
# expansion-mismatch growth becoming an alignment contribution at the mount.
# Both must deterministically hit
# space-systems/ecss/e31-mechanical-interface-requirements.
tasks:
  - id: mir1
    query: "the structure team gave me a bolt torque for the transponder baseplate, work out whether that mount actually passes enough watts per kelvin for the dissipation and the baseplate rise we allowed"
    intent: "ECSS-E-ST-31C clause 4.3.2; bolted mount contact pressure, declared filler conductance coefficient and the W/K the thermal requirement demands"
    expected_skill: "space-systems/ecss/e31-mechanical-interface-requirements"
  - id: mir2
    query: "aluminium box on a carbon panel over a ninety kelvin qualification swing, tell me how much the outer fastener walks and what that costs the pointing budget in arcseconds"
    intent: "ECSS-E-ST-31C clause 4.3.2; expansion-coefficient mismatch at the thermal mount turned into interface slip and an alignment contribution"
    expected_skill: "space-systems/ecss/e31-mechanical-interface-requirements"
