  - id: hrp2
    query: "the unit is sealed and passed its leak tests but a bond has lifted, decide whether we can take the lid off to rebond it and what screening we would owe afterwards"
    intent: "ECSS-Q-ST-60-05C clause 10.5; lid removal as a repair route, the pre-cap state a de-lidded unit reverts to, and the full re-screen it forces"
    expected_skill: "space-systems/ecss/q6005-hybrid-repair-provisions"
