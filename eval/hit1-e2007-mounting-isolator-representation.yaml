# Hit@1 fragment: e2007-mounting-isolator-representation (space-systems/ecss)
# Case 1 routes on the category match between flight and bench, and an unfixed flight build.
# Case 2 routes on the stack resistance and how a bonding strap is graded.
tasks:
  - id: e2007-mounting-isolator-representation-1
    query: "Our reaction wheel flies on four elastomeric isolators but the compatibility lab bolted it straight onto the bench ground plane since fitting them was awkward. Is a hard mount the conservative choice, and what if our flight arrangement has not been fixed yet?"
    intent: "ECSS-E-ST-20-07C 5.2.6.3; a hard mount is not conservative in either direction, and an arrangement neither known nor bounded by a declared worst case is a finding in itself"
    expected_skill: "space-systems/ecss/e2007-mounting-isolator-representation"
  - id: e2007-mounting-isolator-representation-2
    query: "Four wire-rope isolators still give the chassis a direct-current path through the stack, while a dielectric washer set does not. How is that isolator stack resistance built from the per-isolator figure and the count, and why is bonding-strap aspect ratio graded alongside its resistance?"
    intent: "ECSS-E-ST-20-07C 5.2.6.3; paralleled feet lower the stack resistance with count, and a strap is graded on its shape as well as its resistance because a narrow strap turns inductive"
    expected_skill: "space-systems/ecss/e2007-mounting-isolator-representation"
