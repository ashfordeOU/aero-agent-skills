# Hit@1 wave-20 fragment: unscented-kalman-filter (gnc-autonomy)
# Two tasks per new leaf skill; ukf1 routes on sigma-point generation
# and the scaled unscented transform, ukf2 routes on the nonlinear
# measurement update, innovation covariance, and Kalman gain. Both must
# deterministically hit gnc-autonomy/estimation-filtering/unscented-kalman-filter,
# not navigation/kalman-filter-design (linear) or
# estimation-filtering/alpha-beta-filter (constant-velocity tracker).
tasks:
  - id: w20-unscented-kalman-filter-1
    query: "estimate the state of a nonlinear system with an unscented Kalman filter using sigma points and the scaled unscented transform"
    intent: "GNC; sigma-point based nonlinear state estimation"
    expected_skill: "gnc-autonomy/estimation-filtering/unscented-kalman-filter"
  - id: w20-unscented-kalman-filter-2
    query: "propagate a Gaussian state through a nonlinear measurement model and compute the innovation covariance and Kalman gain"
    intent: "GNC; UKF measurement update and innovation covariance"
    expected_skill: "gnc-autonomy/estimation-filtering/unscented-kalman-filter"
