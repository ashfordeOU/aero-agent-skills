# Hit@1 fragment: e2006-sputtering-simulation-analysis (space-systems/ecss)
# Case 1 routes on sorting the simulated populations and testing interception.
# Case 2 routes on yield to removed depth against the surface allowance.
tasks:
  - id: e2006-sputtering-simulation-analysis-1
    query: "The plume run gives simulated ion trajectories over a range of emission angles measured off the exit-plane of the thruster. How do I categorize each population, which are primary-beam, which are beam-wing, and which are charge-exchange or backflow, and which of them cross the angular span our radiator subtends?"
    intent: "ECSS-E-ST-20-06C 11.3.4; population categorisation and the geometric test of whether a trajectory reaches the surface at all"
    expected_skill: "space-systems/ecss/e2006-sputtering-simulation-analysis"
  - id: e2006-sputtering-simulation-analysis-2
    query: "Each xenon ion arrives near 280 eV onto a coated external surface, with the thruster firing for 8000 hours. What sputter-yield does that target material give above its sputter-threshold, what thickness is removed over that duration, and does the erosion-depth stay inside the erosion-allowance?"
    intent: "ECSS-E-ST-20-06C 11.3.4; the energy and angle dependent yield integrated into a removed depth and compared with the recorded allowance"
    expected_skill: "space-systems/ecss/e2006-sputtering-simulation-analysis"
