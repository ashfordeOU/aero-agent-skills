  - id: rel60b
    query: "we have nineteen expired class 3 lots on the shelf and only enough relife test slots for a handful, decide which lots to put through and which to write off so the build gets the most parts back"
    intent: "ECSS-Q-ST-60C clause 6.3.10; ordering an expired-stock relife campaign by build demand released per test slot, with the owed evidence set per lot"
    expected_skill: "space-systems/ecss/q60-class-3-stock-relifing"
