# Hit@1 fragment: q60-class-3-stock-relifing (space-systems/ecss)
# Two tasks for the leaf. rel60a routes on the decaying grant a second relife
# cycle earns and the total-life headroom read off the date code; rel60b routes
# on spending a limited relife test capacity across a store by build demand.
# Both must deterministically hit
# space-systems/ecss/q60-class-3-stock-relifing rather than the commercial-part
# relifing leaf, which grades the store rather than the stock.
tasks:
