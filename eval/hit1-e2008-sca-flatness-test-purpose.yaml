# Hit@1 fragment: e2008-sca-flatness-test-purpose (space-systems/ecss, E-ST-20-08C 6.4.3.17.1)
# Two tasks per leaf; sfp1 routes on why the flatness measurement is bought
# before integration, sfp2 on whether the planned run is placed where it can
# report the shape the panel receives. Both must deterministically hit
# space-systems/ecss/e2008-sca-flatness-test-purpose.
tasks:
  - id: sfp1
    query: "state and defend the pre-integration-flatness-demand behind a sca-flatness-purpose case and work out whether sca-bond-line-thickness-control and sca-coverglass-clamp-down-stress earn the measurement at all"
    intent: "ecss solar cell assemblies; purpose and justification of establishing assembly flatness before integration"
    expected_skill: "space-systems/ecss/e2008-sca-flatness-test-purpose"
  - id: sfp2
    query: "review whether a planned cell assembly flatness run follows every shape-setting operation, sits before integration and meets sca-flatness-subgroup-sampling"
    intent: "ecss solar cell assemblies; whether the planned flatness measurement serves its purpose"
    expected_skill: "space-systems/ecss/e2008-sca-flatness-test-purpose"
