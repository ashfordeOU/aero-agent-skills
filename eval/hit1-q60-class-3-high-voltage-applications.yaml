# Hit@1 fragment: q60-class-3-high-voltage-applications (space-systems/ecss,
# Q-ST-60C 6.6.7). Two tasks for the leaf. hv3a routes on the pressure regime
# deciding whether gas breakdown governs and on the breakdown margin left;
# hv3b routes on the frequency-gap susceptibility band and the provisions a
# high power microwave stage owes. Both must deterministically hit
# space-systems/ecss/q60-class-3-high-voltage-applications.
tasks:
  - id: hv3a
    query: "resolve the q60-c3-hv-pressure-regime for a Class 3 part that sees a few hundred pascals during ascent and take the q60-c3-hv-paschen-breakdown-margin across its electrode gap at eight hundred volts"
    intent: "ECSS-Q-ST-60C clause 6.6.7; Class 3 high voltage provisions, pressure regime selection and the gas breakdown margin"
    expected_skill: "space-systems/ecss/q60-class-3-high-voltage-applications"
  - id: hv3b
    query: "group this Class 3 high power microwave stage against the q60-c3-hv-multipaction-susceptibility-band and list the additional provisions it owes on top of the ordinary Class 3 rules"
    intent: "ECSS-Q-ST-60C clause 6.6.7; Class 3 high power microwave provisions, frequency-gap product and multipaction susceptibility"
    expected_skill: "space-systems/ecss/q60-class-3-high-voltage-applications"
