# Hit@1 wave-9 fragment: monte-carlo-sampling (cross-cutting)
# Two tasks per new leaf skill; mc1 routes on leaf terminology
# (monte carlo sampling, random seed, sample statistics), mc2 routes
# on the wider phrasing (percentile confidence interval, histogram of
# the sampled distribution). Both must deterministically hit
# cross-cutting/numerics/monte-carlo-sampling.
tasks:
  - id: mc1
    query: "run a monte carlo sampling with 10000 random draws and a fixed random seed to estimate the mean and the standard deviation of the output distribution"
    intent: "numerics; Monte Carlo sampling with seeded random draws and sample statistics"
    expected_skill: "cross-cutting/numerics/monte-carlo-sampling"
  - id: mc2
    query: "estimate the 95 percent confidence interval and the histogram of the sampled distribution from the random draws"
    intent: "numerics; percentile confidence interval and histogram of the sampled distribution"
    expected_skill: "cross-cutting/numerics/monte-carlo-sampling"
