# Hit@1 fragment: e2008-sca-solar-cell-defects (space-systems/ecss)
# Two tasks for the new leaf. scd1 routes on the permitted position of a chip
# against the inactive border; scd2 routes on a corner break measured on the
# diagonal and on the cumulative area a cell is allowed to lose. Both must
# deterministically hit space-systems/ecss/e2008-sca-solar-cell-defects.
tasks:
  - id: scd1
    query: "on this assembled cell body one corner break goes right through the wafer thickness, with two more along the same edge - should it pass, go to a board, or be rejected, and flag separately anything that has bitten into active area"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.4; permitted position of a cell body chip against the inactive border, the tighter allowance where a break goes through the wafer, and active-area encroachment named apart"
    expected_skill: "space-systems/ecss/e2008-sca-solar-cell-defects"
  - id: scd2
    query: "grade the corner chip and the nicks on this solar cell body for size against the single defect and cumulative area allowances"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.4; permitted size of cell body chips, corner diagonal reach"
    expected_skill: "space-systems/ecss/e2008-sca-solar-cell-defects"
