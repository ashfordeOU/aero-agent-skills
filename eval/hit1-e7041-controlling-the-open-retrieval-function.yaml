# Hit@1 fragment: e7041-controlling-the-open-retrieval-function (space-systems/ecss)
# Two tasks for the new leaf. corf1 routes on the start/suspend/resume/abort state
# machine and its refusals; corf2 routes on a suspension keeping the overwrite
# protection on a circular store. Both must deterministically hit
# space-systems/ecss/e7041-controlling-the-open-retrieval-function.
tasks:
  - id: corf1
    query: "which packet stores can accept a start of the retrieval that keeps following the store forward, and what happens if one is already running a by-time-range read"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.4; one cursor per store, start refused on a store engaged in either retrieval kind"
    expected_skill: "space-systems/ecss/e7041-controlling-the-open-retrieval-function"
  - id: corf2
    query: "I suspended the open retrieval running against a circular store and it stopped accepting fresh packets at its head; does overwrite protection hold through the suspension, where does the cursor sit, and is a resume or an abort next"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.4; a suspended open retrieval still pins its cursor and holds the overwrite protection"
    expected_skill: "space-systems/ecss/e7041-controlling-the-open-retrieval-function"
