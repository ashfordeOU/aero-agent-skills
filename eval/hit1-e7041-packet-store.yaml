# Hit@1 fragment: e7041-packet-store (space-systems/ecss)
# Two tasks for the new leaf. pkst1 routes on which end of the record a full
# store loses, bounded against circular; pkst2 routes on the overwrite that an
# open retrieval must block. Both must deterministically hit
# space-systems/ecss/e7041-packet-store.
tasks:
  - id: pkst1
    query: "the on-board store filled up before the next pass and we are missing packets, work out whether we lost the run-up to the event or the hour after it and which store setting decided that"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.1; a bounded store keeps the oldest and turns away the newest while a circular store overwrites the oldest to keep the newest, so the store type decides which end of the record is lost"
    expected_skill: "space-systems/ecss/e7041-packet-store"
  - id: pkst2
    query: "a dump is halfway through reading that store out and the store is still taking new packets, tell me what has to happen to the oldest packets so the dump does not come back with a gap in the middle"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.1; a circular store must not overwrite content an open retrieval has not yet handed over, so it discards the incoming packet instead of tearing an unmarked hole in the record"
    expected_skill: "space-systems/ecss/e7041-packet-store"
