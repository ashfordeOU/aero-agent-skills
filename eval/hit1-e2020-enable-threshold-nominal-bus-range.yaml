# Hit@1 fragment: e2020-enable-threshold-nominal-bus-range (space-systems/ecss)
# Two tasks for the leaf. etnbr1 routes on the adjustment ladder of a turn on
# threshold quoted as a percentage of the NOMINAL main bus and whether it
# covers the required percentage band at both ends; etnbr2 routes on the volts
# one ladder step buys and which settings the bus can actually cross. Both
# must deterministically hit
# space-systems/ecss/e2020-enable-threshold-nominal-bus-range.
tasks:
  - id: etnbr1
    query: "walk the adjustment ladder of a turn on threshold quoted as a percentage of the nominal main bus voltage, from its lowest step to its highest, and say whether it covers the required percentage band at both ends"
    intent: "ECSS-E-ST-20-20C clause 5.4.4.1.1; enable setting ladder referred to the nominal main bus and its coverage of the required percentage band"
    expected_skill: "space-systems/ecss/e2020-enable-threshold-nominal-bus-range"
  - id: etnbr2
    query: "Our unit sets its enable point as a percentage referred to the nominal main bus of 28 V, in 2 percent detents. How many volts per detent, and with a 22 V equipment floor and the bus never under 24.5 V, how many are usable?"
    intent: "ECSS-E-ST-20-20C clause 5.4.4.1.1; turn-on setting step resolution in volts and usable settings inside the bus window"
    expected_skill: "space-systems/ecss/e2020-enable-threshold-nominal-bus-range"
