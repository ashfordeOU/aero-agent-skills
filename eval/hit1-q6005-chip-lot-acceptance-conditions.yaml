# Hit@1 fragment: q6005-chip-lot-acceptance-conditions (space-systems/ecss)
# Two tasks for the new leaf. clac1 routes on the homogeneity condition - one
# container holding two wafer lots against one set of acceptance data. clac2
# routes on the delivery-note-versus-goods reconciliation and the lost lot
# identity that inspection cannot recover. Both must deterministically hit
# space-systems/ecss/q6005-chip-lot-acceptance-conditions.
tasks:
  - id: clac1
    query: "the bare die delivery arrived as two sublots from different wafer lots, packed together - work out the homogeneity ratio across everything that came, say how many dice carry both a wafer and a diffusion identity, and whether stores can accept it"
    intent: "ECSS-Q-ST-60-05C clause 8.1.4; wafer-lot homogeneity of a delivered chip batch and when a split delivery is a reservation rather than a rejection"
    expected_skill: "space-systems/ecss/q6005-chip-lot-acceptance-conditions"
  - id: clac2
    query: "the delivery note claims a thousand bare dice but the waffle packs come up short and one pack carries no diffusion lot identity - reconcile the sublot counts against the order and tell me how this delivery should be dispositioned"
    intent: "ECSS-Q-ST-60-05C clause 8.1.4; sublot quantity reconciliation against the delivery note and the order, and quantity-weighted traceability coverage"
    expected_skill: "space-systems/ecss/q6005-chip-lot-acceptance-conditions"
