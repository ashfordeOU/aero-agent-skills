# Hit@1 fragment: q6005-chip-lot-acceptance-conditions (space-systems/ecss)
# Two tasks for the new leaf. clac1 routes on the homogeneity condition - one
# container holding two wafer lots against one set of acceptance data. clac2
# routes on the delivery-note-versus-goods reconciliation and the lost lot
# identity that inspection cannot recover. Both must deterministically hit
# space-systems/ecss/q6005-chip-lot-acceptance-conditions.
tasks:
