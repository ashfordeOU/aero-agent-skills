# where most delivered diode batches have no data file; bddd2 routes on a
# screening record that is present, approved and covers a fraction of the
# serials the batch delivered while citing a superseded approval. Both must
# deterministically hit
# space-systems/ecss/e2008-blocking-diode-data-documentation.
tasks:
