# Hit@1 fragment: q7080-material-property-verification (space-systems/ecss)
# Two tasks for the new leaf. mpv1 routes on coupon provenance and the build
# direction orientation; mpv2 routes on grading each coupon against the minimum
# and on the orientation ratio. Both must deterministically hit
# space-systems/ecss/q7080-material-property-verification.
tasks:
  - id: mpv1
    query: "we are short of tensile bars for this build so the lab wants to make the numbers up with coupons off last week's plate, and all of ours were laid flat, tell me whether that population carries the batch"
    intent: "ECSS-Q-ST-70-80 quality clause; witness coupons are evidence only for their own build and furnace lot, and the build direction has to be sampled"
    expected_skill: "space-systems/ecss/q7080-material-property-verification"
  - id: mpv2
    query: "the average tensile of the printed coupons clears the minimum but the vertical ones came out well under the flat ones, work out whether the batch is acceptable"
    intent: "ECSS-Q-ST-70-80 quality clause; every coupon graded against the minimum rather than the mean, plus the weakest-to-strongest orientation ratio as a process finding"
    expected_skill: "space-systems/ecss/q7080-material-property-verification"
