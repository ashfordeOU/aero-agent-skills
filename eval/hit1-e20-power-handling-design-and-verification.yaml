# Hit@1 fragment: e20-power-handling-design-and-verification (space-systems/ecss)
# Case 1 routes on resolving the owed margin and the level the element must reach.
# Case 2 routes on grading the evidence offered, not the capability claimed.
tasks:
  - id: e20-power-handling-design-and-verification-1
    query: "Our Ku-band isolator is rated 45 W maximum operating RF power. How do I resolve the power-handling margin we owe from its element category plus the fact its capability rests on analysis rather than measurement, and what design level must it then reach?"
    intent: "ECSS-E-ST-20C 7.3.2.2; the owed margin combines the category allowance with an allowance for the substantiation route, and the required level is the operating level raised by it"
    expected_skill: "space-systems/ecss/e20-power-handling-design-and-verification"
  - id: e20-power-handling-design-and-verification-2
    query: "Our supplier substantiates a waveguide switch by similarity to a flight unit but offers no delta-environment statement, and another element has a measured record giving an applied level with no dwell recorded. Are those acceptable as evidence of power handling?"
    intent: "ECSS-E-ST-20C 7.3.2.2; a similarity argument without the environment delta asserts what it should prove, and an applied level without a dwell exercises none of the onset mechanisms"
    expected_skill: "space-systems/ecss/e20-power-handling-design-and-verification"
