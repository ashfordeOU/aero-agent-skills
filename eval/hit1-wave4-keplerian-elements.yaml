# Hit@1 wave-4 fragment: keplerian-elements (space-systems/orbit-mechanics)
# ke1 routes on the rv2coe state-vector conversion (semimajor axis,
# eccentricity, inclination, RAAN, argument of periapsis, true anomaly);
# ke2 routes on the derived quantities (orbital period, periapsis and
# apoapsis radii, ascending node from the state vector). Both must
# deterministically hit space-systems/orbit-mechanics/keplerian-elements.
tasks:
  - id: ke1
    query: "compute the classical orbital elements from a position and velocity state vector using the rv2coe method and report the semimajor axis, eccentricity, inclination, raan, argument of periapsis and true anomaly"
    intent: "orbit mechanics; rv2coe conversion of a state vector to classical orbital elements"
    expected_skill: "space-systems/orbit-mechanics/keplerian-elements"
  - id: ke2
    query: "determine the orbital period and the periapsis and apoapsis radii from the semimajor axis and eccentricity of an elliptical orbit and find the right ascension of the ascending node from the state vector"
    intent: "orbit mechanics; orbital period, periapsis and apoapsis radii, and RAAN from elements and state vector"
    expected_skill: "space-systems/orbit-mechanics/keplerian-elements"
