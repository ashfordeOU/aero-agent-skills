# order line and the bill of materials against the nominal class 3 tier;
# c3hyb2 routes on the acceptance work that shortfall buys back and the cap the
# project set for it. Both must deterministically hit
# space-systems/ecss/q60-class-3-hybrid-procurement.
tasks:
