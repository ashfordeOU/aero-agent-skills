    query: "Three elements in this thick film hybrid sit below the tier they ought to, one of them an unscreened die. What extra incoming work does that oblige us to pay for, does the die force a radiation check, and can our budget carry it?"
    intent: "ECSS-Q-ST-60C clause 6.6.3; class 3 hybrid compensating acceptance steps, effort total against the project cap and the hybrid-supplier-audit-route"
    expected_skill: "space-systems/ecss/q60-class-3-hybrid-procurement"
