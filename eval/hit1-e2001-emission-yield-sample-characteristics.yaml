# Hit@1 fragment: e2001-emission-yield-sample-characteristics (space-systems/ecss)
# Case 1 routes on which attribute mismatches void representativeness outright versus which a written justification can close.
# Case 2 routes on the physical usability of the coupon: area against the probe spot with keep-out, and storage age against shelf life.
tasks:
  - id: e2001-emission-yield-sample-characteristics-1
    query: "The coupon for our yield measurement is the same aluminium alloy as the waveguide, but it was milled from plate while the flight part is additively built, and it was solvent wiped instead of vapour degreased. Which of those two differences kills representativeness and which can a written justification close?"
    intent: "ECSS-E-ST-20-01C 9.4.3; governing attributes (material, treatment, production route) that void representativeness against supporting attributes that only need recorded justification"
    expected_skill: "space-systems/ecss/e2001-emission-yield-sample-characteristics"
  - id: e2001-emission-yield-sample-characteristics-2
    query: "Our emission yield coupon offers an 8 mm measurement area against a 6 mm probe footprint, and its age is fourteen months past the conversion coating, well beyond our shelf-life allowance after uncontrolled storage. Is representativeness still defensible, or does a written justification close it?"
    intent: "ECSS-E-ST-20-01C 9.4.3; coupon measurement area against the probe footprint with its keep-out factor, and storage age against the shelf-life allowance"
    expected_skill: "space-systems/ecss/e2001-emission-yield-sample-characteristics"
