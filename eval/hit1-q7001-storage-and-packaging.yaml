# Hit@1 fragment: q7001-storage-and-packaging (space-systems/ecss)
# sp1 routes on the re-verification interval for a bagged and purged item;
# sp2 routes on barrier layers and refused contact materials. Both must
# deterministically hit space-systems/ecss/q7001-storage-and-packaging.
tasks:
  - id: sp1
    query: "the focal plane module goes into the store for eighteen months bagged and purged, work out when it has to be opened and the cleanliness demonstrated again and whether the purge or the residue projection is what binds that date"
    intent: "cleanliness re-verification interval as the earliest of the residue projection, the purge pressure hold and the policy ceiling, with the binding limit named"
    expected_skill: "space-systems/ecss/q7001-storage-and-packaging"
  - id: sp2
    query: "they bagged the precision clean item in one layer of plasticised film inside a board box with no desiccant, tell me what the packaging should have been and whether that store can even be used to unbag it"
    intent: "barrier layer count against the sensitivity, packaging materials refused in contact with flight hardware, desiccant and purge state, store class graded against the item"
    expected_skill: "space-systems/ecss/q7001-storage-and-packaging"
