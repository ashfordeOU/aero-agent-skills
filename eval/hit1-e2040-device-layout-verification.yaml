# Hit@1 fragment: e2040-device-layout-verification (space-systems/ecss)
# Two tasks for the new leaf. dlv1 routes on a check answered on a netlist view
# that cannot carry it; dlv2 routes on reconciling violations against waivers and
# on planned checks that never ran. Both must deterministically hit
# space-systems/ecss/e2040-device-layout-verification.
tasks:
  - id: dlv1
    query: "the timing run in the verification report was taken on the synthesised netlist rather than the extracted one, does that count as having done post layout timing"
    intent: "ECSS-E-ST-20-40C 5.6.3; netlist-view suitability per check, static timing and power integrity answerable only on the extracted view, formal equivalence legitimately pre-layout"
    expected_skill: "space-systems/ecss/e2040-device-layout-verification"
  - id: dlv2
    query: "reconcile the antenna violations against the waivers covering them and tell me which planned checks never executed at all"
    intent: "ECSS-E-ST-20-40C 5.6.3; violations reconciled against waivers needing a rationale and an approver, planned-versus-executed coverage with aborted runs excluded"
    expected_skill: "space-systems/ecss/e2040-device-layout-verification"
