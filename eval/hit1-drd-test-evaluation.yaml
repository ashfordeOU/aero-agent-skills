# Hit@1 fragment: drd-test-evaluation (space-systems/ecss)
# Case 1 routes on objective-by-objective status and the blocking effect of an undispositioned anomaly.
# Case 2 routes on measured-versus-predicted deviation against the tolerance band and the post-test article record.
tasks:
  - id: drd-test-evaluation-1
    query: "Our modal survey ran to completion, but the channel on the critical bracket died mid-sweep and one unexplained bang still sits in the anomaly log with no disposition. Can the evaluation report for this structural campaign land on accepted, or is each test objective graded on its own first?"
    intent: "ECSS-E-ST-32C Annex P; per-objective met/partial/not-met grading and the rule that an undispositioned anomaly blocks an accepted verdict"
    expected_skill: "space-systems/ecss/drd-test-evaluation"
  - id: drd-test-evaluation-2
    query: "First lateral mode came out eight percent under the approved forecast and the shaker adapter shows a scuff afterwards. How do I build the deviation table against the tolerance band and record the article condition so the report supports a defensible pass or reject?"
    intent: "ECSS-E-ST-32C Annex P; measured-to-predicted deviation binning and the mandatory post-test condition record, not the production of the prediction itself"
    expected_skill: "space-systems/ecss/drd-test-evaluation"
