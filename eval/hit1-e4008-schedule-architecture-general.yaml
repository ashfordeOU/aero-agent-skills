# Hit@1 fragment: e4008-schedule-architecture-general (space-systems/ecss)
# Two tasks for the new leaf. sag1 routes on the utilisation sum and the cycle
# and offset validity; sag2 routes on the hyperperiod enumeration that finds two
# items sharing a release instant and a priority. Both must deterministically hit
# space-systems/ecss/e4008-schedule-architecture-general.
tasks:
  - id: sag1
    query: "here is the list of items the simulator will arm, each with a cycle, an offset and a worst case execution time, work out whether the load fits and whether any offset sits outside its own cycle"
    intent: "ECSS-E-ST-40-08C clause 4.2.4.1; schedule utilisation as the sum of execution over cycle against the budget, plus the positive-cycle and inside-the-cycle offset items"
    expected_skill: "space-systems/ecss/e4008-schedule-architecture-general"
  - id: sag2
    query: "enumerate the hyperperiod of this simulator schedule and show me the releases landing on the same instant at the same priority; also check each offset stays within its own cycle and sum worst-case execution into a utilisation against our budget"
    intent: "ECSS-E-ST-40-08C clause 4.2.4.1; the determined release order item, enumerated over the hyperperiod least common multiple of the cycle times in whole microseconds"
    expected_skill: "space-systems/ecss/e4008-schedule-architecture-general"
