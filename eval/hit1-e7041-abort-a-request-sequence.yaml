# Hit@1 fragment: e7041-abort-a-request-sequence (space-systems/ecss)
# abrs1 routes on stopping one named running sequence; abrs2 routes on the limits
# of an abort -- released requests are not recalled, the body is not unloaded.
# Both must deterministically hit
# space-systems/ecss/e7041-abort-a-request-sequence.
tasks:
  - id: abrs1
    query: "abort the slew sequence that is part way through and tell me the step boundary it reached, plus what the engine does if the identifier turns out to name a sequence that never started or already finished"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.7; abort one executing sequence at a request boundary and report the step reached, refusing an identifier that is not executing with the state it was actually in"
    expected_skill: "space-systems/ecss/e7041-abort-a-request-sequence"
  - id: abrs2
    query: "if I abort a sequence that already sent four of its ten requests, do those four get cancelled too, and can I start the sequence again afterwards without uplinking it"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.7; released requests are not recalled, pending ones are discarded not deferred, the body stays loaded"
    expected_skill: "space-systems/ecss/e7041-abort-a-request-sequence"
