# Hit@1 wave-13 fragment: liquid-penetrant-inspection (manufacturing-quality/ndt)
# Two tasks per new leaf; lpi1 routes on the Washburn equation capillary
# penetration of a dye penetrant during the dwell time, lpi2 routes on
# bleed-out indication sizing and developer time for a fluorescent
# penetrant process with wording that could route to ndt-method-selection
# but must top-1 to manufacturing-quality/ndt/liquid-penetrant-inspection.
tasks:
  - id: lpi1
    query: "compute the washburn-equation penetration-depth for the dye-penetrant in the surface crack after the dwell-time"
    intent: "manufacturing quality; liquid penetrant capillary penetration depth via the Washburn equation over the dwell time"
    expected_skill: "manufacturing-quality/ndt/liquid-penetrant-inspection"
  - id: lpi2
    query: "estimate the indication-sizing bleed-out width and the developer-time for the fluorescent-penetrant inspection of the surface crack"
    intent: "manufacturing quality; penetrant bleed-out indication sizing and developer time, adversarial against NDT method selection"
    expected_skill: "manufacturing-quality/ndt/liquid-penetrant-inspection"
