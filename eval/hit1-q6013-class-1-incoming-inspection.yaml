  - id: ii2
    query: "The dry bag arrived with a nicked seal, the card inside has gone pink past its spot, and the reel sat open on the line 70 hours against a level 3 rating. Does this delivery go to bonded store or straight to quarantine?"
    intent: "ECSS-Q-ST-60-13C clause 4.3.7; moisture barrier readings and the release-or-quarantine disposition on receipt"
    expected_skill: "space-systems/ecss/q6013-class-1-incoming-inspection"
