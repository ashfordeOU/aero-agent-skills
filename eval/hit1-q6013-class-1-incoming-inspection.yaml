# Hit@1 fragment: q6013-class-1-incoming-inspection (space-systems/ecss)
# Two tasks for the leaf. ii1 routes on reconciling a delivery against the
# purchase order on receipt and sizing the external visual sample; ii2 routes on
# the dry-pack readings and the quarantine disposition at the dock. Both must
# deterministically hit space-systems/ecss/q6013-class-1-incoming-inspection.
tasks:
  - id: ii1
    query: "on receipt of a commercial parts delivery reconcile part number, date code and quantity against the purchase order, size the external visual sample from what actually arrived and judge the defects found against the accept number"
    intent: "ECSS-Q-ST-60-13C clause 4.3.7; purchase-order reconciliation and visual sample sizing at goods-in"
    expected_skill: "space-systems/ecss/q6013-class-1-incoming-inspection"
  - id: ii2
    query: "read the dry-pack bag seal, the humidity indicator card and the elapsed floor-life exposure of the declared moisture sensitivity level and decide whether the received lot goes into bonded store or into quarantine"
    intent: "ECSS-Q-ST-60-13C clause 4.3.7; moisture barrier readings and the release-or-quarantine disposition on receipt"
    expected_skill: "space-systems/ecss/q6013-class-1-incoming-inspection"
