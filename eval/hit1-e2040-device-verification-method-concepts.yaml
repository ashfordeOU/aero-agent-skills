# Hit@1 fragment: e2040-device-verification-method-concepts (space-systems/ecss)
# Two tasks for the new leaf. dvmc1 routes on review of design allocated to a
# requirement carrying a number; dvmc2 routes on the heritage a similarity claim
# needs before it is evidence at all. Both must deterministically hit
# space-systems/ecss/e2040-device-verification-method-concepts.
tasks:
  - id: dvmc1
    query: "our matrix closes the 40 milliampere quiescent current limit by reviewing the design; is examining a drawing an admissible method for a requirement that carries a number, or does that allocation leave the limit undemonstrated until someone measures it"
    intent: "ECSS-E-ST-20-40C clause 4.2; a requirement carrying a numeric limit is settled by producing a number, so the documentary methods leave the admissible set"
    expected_skill: "space-systems/ecss/e2040-device-verification-method-concepts"
  - id: dvmc2
    query: "our matrix allocates the vibration requirement to similarity with a unit flown last mission; what must be true of that heritage article, its severity envelope and whether the design moved, before the allocation counts as admissible device evidence rather than an assertion"
    intent: "ECSS-E-ST-20-40C clause 4.2; a similarity claim needs a named heritage item qualified to at least the claimed severity and unchanged in the respect being claimed"
    expected_skill: "space-systems/ecss/e2040-device-verification-method-concepts"
