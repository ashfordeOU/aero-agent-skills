# Hit@1 fragment: e1012-segr-seb (space-systems/ecss)
# Case 1 routes on which destructive effects the device type admits and whether the test bias
# still covers service. Case 2 routes on the Weibull integration and the design margin factor.
tasks:
  - id: e1012-segr-seb-1
    query: "Our power MOSFET in the PCU runs at 80 V drain-source but the heavy-ion characterisation was taken at 50 V. Can I still use those gate-rupture and burnout numbers, and does a bipolar pass transistor beside it need both checks or only one?"
    intent: "ECSS-E-ST-10-12C 9.4.1.6; gate rupture applies only where there is a gate oxide, and cross-section data is valid only at or above the bias it was taken at"
    expected_skill: "space-systems/ecss/e1012-segr-seb"
  - id: e1012-segr-seb-2
    query: "I have Weibull cross-section parameters for a hardened FET and a differential LET spectrum for a GEO mission. How do I integrate the two into a rate of destructive events per device-day, and what factor must the result sit below the requirement by?"
    intent: "ECSS-E-ST-10-12C 9.4.1.6; the cross-section curve folded against the differential spectrum on a consistent time base, then the standard order-of-magnitude design margin"
    expected_skill: "space-systems/ecss/e1012-segr-seb"
