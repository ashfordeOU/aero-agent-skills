# Hit@1 fragment: q60-class-1-eqm-component-usage (space-systems/ecss,
# Q-ST-60C 4.1.6). Two tasks per leaf; eqmu1 routes on the quality-ladder step a
# fitted part sits at and the permission it earns, eqmu2 on the spent life and
# the disposition the part leaves the campaign with. Both must deterministically
# hit space-systems/ecss/q60-class-1-eqm-component-usage.
tasks:
  - id: eqmu1
    query: "measure the q60-eqm-quality-level-relaxation-depth of each fitted part and the q60-eqm-fitted-part-usage-permission it earns"
    intent: "ecss eee components; whether a part may be fitted to an engineering qualification model"
    expected_skill: "space-systems/ecss/q60-class-1-eqm-component-usage"
  - id: eqmu2
    query: "accumulate the q60-eqm-consumed-life-fraction then return the q60-eqm-post-use-disposition and the q60-eqm-flight-build-reuse-position"
    intent: "ecss eee components; where a model-fitted part goes once the campaign is over"
    expected_skill: "space-systems/ecss/q60-class-1-eqm-component-usage"
