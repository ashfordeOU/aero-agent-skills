# Hit@1 fragment: e2008-sca-coverglass-adhesive-defects (space-systems/ecss)
# Two tasks for the new leaf. cad1 routes on the rear weld zone carve-out for
# adhesive delamination; cad2 routes on an indication that straddles the edge
# of an exempt zone. Both must deterministically hit
# space-systems/ecss/e2008-sca-coverglass-adhesive-defects.
tasks:
  - id: cad1
    query: "which coverglass adhesive delaminations fall inside the rear weld exempt zones and which are charged in full - and where two welds overlap the same indication, may that area be exempted twice or only once"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.6; adhesive free of delamination and discolouration outside the rear weld zones, with only one exempt zone credited where two welds cover the same indication"
    expected_skill: "space-systems/ecss/e2008-sca-coverglass-adhesive-defects"
  - id: cad2
    query: "the discoloured patch overhangs the edge of the exempt zone behind a rear weld, how much of it counts against the adhesive"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.6; straddling indication credit and grade weighted transmission loss"
    expected_skill: "space-systems/ecss/e2008-sca-coverglass-adhesive-defects"
