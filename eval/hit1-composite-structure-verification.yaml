# Hit@1 fragment: composite-structure-verification (space-systems/ecss)
# Case 1 routes on the failure modes the clause requires and on knock-down
# completeness. Case 2 routes on conditioning the article and on the mandatory
# levels of the building-block pyramid.
tasks:
  - id: composite-structure-verification-1
    query: "A reviewer says our laminate work is incomplete because it only checks fibre rupture. Which failure modes does composite verification require beyond that, and how many knock-down factors need a traceable derivation behind each design allowable?"
    intent: "ECSS-E-ST-32C clause 4.6.4; matrix cracking, delamination and inter-laminar shear are required alongside fibre failure, with three traceable knock-down factors"
    expected_skill: "space-systems/ecss/composite-structure-verification"
  - id: composite-structure-verification-2
    query: "We conditioned coupons hot and wet, but the component article was tested dry at room temperature against a hot wet allowable. Which building block levels are mandatory here, and is that conditioning mismatch on the component a finding?"
    intent: "ECSS-E-ST-32C clause 4.6.4; conditioning must match the environment the allowable represents at every level, and coupon plus component evidence are both mandatory"
    expected_skill: "space-systems/ecss/composite-structure-verification"
