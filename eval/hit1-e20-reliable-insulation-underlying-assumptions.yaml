# Hit@1 fragment: e20-reliable-insulation-underlying-assumptions (space-systems/ecss)
# Case 1 routes on layer independence and the shared material or process that
# destroys it. Case 2 routes on the survivor margin and the qualification
# envelope, in particular the low-pressure band crossed during ascent.
tasks:
  - id: e20-reliable-insulation-underlying-assumptions-1
    query: "The harness drawing shows two heat shrink sleeves of the same material applied in one shrink operation as our two protective layers. Does that pair survive the single defect argument or is it a common cause?"
    intent: "ECSS-E-ST-20C clause 4.2.1.2.1; independence needs distinct parts plus a difference in material or process, else one mechanism takes both layers"
    expected_skill: "space-systems/ecss/e20-reliable-insulation-underlying-assumptions"
  - id: e20-reliable-insulation-underlying-assumptions-2
    query: "Can the two protective layers have their withstand voltages added together to show margin, and is a coupon qualified at sea level and at hard vacuum enough to cover the ascent pressure range where corona starts easiest?"
    intent: "ECSS-E-ST-20C clause 4.2.1.2.1; the margin belongs to the surviving layer alone, and the low-pressure corona band is not covered by ambient or hard-vacuum evidence"
    expected_skill: "space-systems/ecss/e20-reliable-insulation-underlying-assumptions"
