# Hit@1 fragment: e2008-humidity-test-pass-fail-criteria (space-systems/ecss)
# Two tasks for the leaf; hp1 routes on the corrected output-power comparison
# across the humidity exposure, hp2 on the per-circuit continuity screening.
# Both must deterministically hit
# space-systems/ecss/e2008-humidity-test-pass-fail-criteria.
tasks:
  - id: hp1
    query: "the photovoltaic coupon humidity exposure has ended, correct the pre-exposure and post-exposure illuminated power to reference irradiance and cell temperature and judge the output-power loss against its limit"
    intent: "space systems ECSS; post-humidity output-power retention of a photovoltaic coupon"
    expected_skill: "space-systems/ecss/e2008-humidity-test-pass-fail-criteria"
  - id: hp2
    query: "screen every interconnect circuit of the humidity-exposed coupon for an open circuit and for a series-resistance increase past its allowance after the recovery period"
    intent: "space systems ECSS; continuity and series-resistance screening after humidity exposure"
    expected_skill: "space-systems/ecss/e2008-humidity-test-pass-fail-criteria"
