# Hit@1 fragment: q6012-flight-model-die-lot-procurement (space-systems/ecss)
# Two tasks for the new leaf. fmdl1 routes on the reverse yield cascade to die
# starts and whole wafers; fmdl2 routes on grading the foundry qualification at
