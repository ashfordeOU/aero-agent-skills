# Hit@1 fragment: fracture-material-data (space-systems/ecss)
# Case 1 routes on the data-source category and the knockdowns it forces before the values become allowables.
# Case 2 routes on the growth side: fitting the exponent from too few pairs and scaling the threshold to the spectrum load ratios.
tasks:
  - id: fracture-material-data-1
    query: "There is no coupon campaign against our flight lot, so the toughness figure comes from a published handbook and the threshold from a limited three-point run. What knockdown does each source carry before they become design allowables, and what must the adjusted record state?"
    intent: "ECSS-E-ST-32C 7.2.5; test-derived, handbook or limited source categorisation and the knockdown each forces on toughness and threshold before the adjusted record is issued"
    expected_skill: "space-systems/ecss/fracture-material-data"
  - id: fracture-material-data-2
    query: "We hold only two coupon pairs of growth rate against stress intensity range, and the mission spectrum runs at load ratios as high as 0.7. Can a Paris-law exponent be fitted from two points, and how do I scale the zero-ratio threshold to those higher ratios?"
    intent: "ECSS-E-ST-32C 7.2.5; minimum pair count before a growth-rate fit is usable, and Walker-type scaling of the threshold from the reference ratio to the ratios the spectrum actually contains"
    expected_skill: "space-systems/ecss/fracture-material-data"
