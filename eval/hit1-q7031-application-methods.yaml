# Hit@1 fragment: q7031-application-methods (space-systems/ecss)
# Two tasks for the new leaf. am1 routes on the approved-method screen and the
# surface role that rules a brushed film out; am2 routes on the wet-film
# conversion, pass count and transfer losses. Both must deterministically hit
# space-systems/ecss/q7031-application-methods.
tasks:
  - id: am1
    query: "the shop wants to brush this coat because the item is awkward to spray, so tell me whether the specification approves that on a surface whose thermo-optical properties matter, and how much paint the job needs after transfer losses"
    intent: "ECSS-Q-ST-70-31C application; approved method list, brushed and rolled films on a thermo-optical surface, dipping against a keep-out area"
    expected_skill: "space-systems/ecss/q7031-application-methods"
  - id: am2
    query: "spec calls for sixty microns dry at fifty percent volume solids - tell me the wet film to lay down, how many passes it takes and how much paint to order once overspray is counted"
    intent: "ECSS-Q-ST-70-31C application; wet film from dry film through volume solids, pass count at the method per-pass build, theoretical coverage and transfer efficiency"
    expected_skill: "space-systems/ecss/q7031-application-methods"
