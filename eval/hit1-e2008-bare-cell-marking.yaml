# Hit@1 fragment: e2008-bare-cell-marking (space-systems/ecss, E-ST-20-08C 7.1.3)
# Two tasks per leaf; bcm1 routes on the permanence and placement of the
# mark on a bare cell, bcm2 on the traceability depth the coded fields and
# the delivery register reach. Both must deterministically hit
# space-systems/ecss/e2008-bare-cell-marking.
tasks:
  - id: bcm1
    query: "review the bare-cell-permanent-marking scheme for bare-cell-mark-placement-admissibility and the bare-cell-active-area-mark-loss it costs"
    intent: "ecss bare solar cells; permanent code marked on delivered cells and where it is put"
    expected_skill: "space-systems/ecss/e2008-bare-cell-marking"
  - id: bcm2
    query: "check the bare-cell-traceability-depth the coded fields reach against the wafer-lot-traceability-claim and audit the bare-cell-code-uniqueness-register"
    intent: "ecss bare solar cells; marking depth against the process identification document"
    expected_skill: "space-systems/ecss/e2008-bare-cell-marking"
