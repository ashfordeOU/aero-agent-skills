    query: "our mission profile raises no radiation driver, so that element should leave the denominator, and our heritage claim differs only in assembly site, so downgrade it instead of breaking it; grade this campaign at the intermediate class against its coverage threshold"
    intent: "ECSS-Q-ST-60-13C clause 5.2.3.1; evaluation element applicability from the mission profile, class 2 heritage downgrade on assembly site"
    expected_skill: "space-systems/ecss/q6013-class-2-evaluation-overview"
