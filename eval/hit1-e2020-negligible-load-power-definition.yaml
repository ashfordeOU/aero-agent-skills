# Hit@1 fragment: e2020-negligible-load-power-definition (space-systems/ecss)
# Two tasks for the leaf. nlpd1 routes on writing the negligibility rule itself
# — the tighter of an absolute watt figure and a share of the reference power;
# nlpd2 routes on the collective check, where many excused consumers add up
# against the aggregate cap and leave an unbudgeted residual. Both must
# deterministically hit
# space-systems/ecss/e2020-negligible-load-power-definition.
tasks:
  - id: nlpd1
    query: "write down what a load has to draw before the power budget stops tracking it, applying the tighter of the declared absolute watt threshold and the declared share of the reference power"
    intent: "ECSS-E-ST-20-20C clause 5.2.13.2.1; integrator declaration of the negligible consumption threshold for budgeting"
    expected_skill: "space-systems/ecss/e2020-negligible-load-power-definition"
  - id: nlpd2
    query: "sum every consumer the negligibility rule excuses, compare the total against the aggregate cap and report the unbudgeted residual against the budget uncertainty allowance"
    intent: "ECSS-E-ST-20-20C clause 5.2.13.2.1; aggregate cap on excused loads and the unbudgeted residual power"
    expected_skill: "space-systems/ecss/e2020-negligible-load-power-definition"
