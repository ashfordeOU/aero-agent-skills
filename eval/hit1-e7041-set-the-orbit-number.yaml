# Hit@1 fragment: e7041-set-the-orbit-number (space-systems/ecss)
# Two tasks for the new leaf. son1 routes on a forward orbit counter jump that
# steps over scheduled activities; son2 routes on a backward jump and the field
# range check. Both must deterministically hit
# space-systems/ecss/e7041-set-the-orbit-number.
tasks:
  - id: son1
    query: "we are about to set the on board orbit counter four orbits ahead after a propagator update, which scheduled activities does that step over without releasing them and what happens to them"
    intent: "ECSS-E-ST-70-41C clause 6.22.6.4; forward orbit counter jump, the position-based activities it skips and the disposition applied to them"
    expected_skill: "space-systems/ecss/e7041-set-the-orbit-number"
  - id: son2
    query: "what should the subservice do when the commanded orbit number is lower than the one held, or larger than the orbit number field can carry"
    intent: "ECSS-E-ST-70-41C clause 6.22.6.4; backward orbit jump returning executed activities to the future of the schedule and refusal of a value outside the orbit number field"
    expected_skill: "space-systems/ecss/e7041-set-the-orbit-number"
