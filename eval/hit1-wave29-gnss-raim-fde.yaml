# Hit@1 wave-29 fragment: gnss-raim-fde (gnc-autonomy)
# Two tasks per new leaf. w29-gnss-raim-fde-1 routes on RAIM fault
# detection and exclusion: horizontal protection level, chi-square
# test statistic at 1e-5 false alarm, normalized residual exclusion.
# w29-gnss-raim-fde-2 routes on GNSS integrity availability: HPL versus
# the 556 m non-precision approach alert limit under a 200 m
# single-satellite bias. Both must deterministically hit
# gnc-autonomy/navigation/gnss-raim-fde.
tasks:
  - id: w29-gnss-raim-fde-1
    query: "run RAIM fault detection and exclusion on a 6 satellite pseudorange set: compute the horizontal protection level and the chi-square test statistic at 1e-5 false alarm, then identify the faulty satellite by normalized residual"
    intent: "gnc-autonomy; RAIM fault detection and exclusion with horizontal protection level, chi-square threshold and normalized residual"
    expected_skill: "gnc-autonomy/navigation/gnss-raim-fde"
  - id: w29-gnss-raim-fde-2
    query: "check GNSS integrity availability: is the horizontal protection level below the 556 m non-precision approach alert limit when one satellite carries a 200 m bias?"
    intent: "gnc-autonomy; GNSS integrity availability verdict of horizontal protection level against the alert limit"
    expected_skill: "gnc-autonomy/navigation/gnss-raim-fde"
