# Hit@1 wave-6 fragment: descent-performance (flight-mechanics/performance)
# Two tasks per new leaf; de1 routes on rate of descent and descent
# gradient from groundspeed, de2 routes on descent segment time and fuel
# between flight levels. Both must deterministically hit
# flight-mechanics/performance/descent-performance.
tasks:
  - id: de1
    query: "compute the rate of descent from the groundspeed and the descent gradient for the descent profile"
    intent: "flight mechanics; rate of descent from groundspeed and descent gradient"
    expected_skill: "flight-mechanics/performance/descent-performance"
  - id: de2
    query: "estimate the time to descend between flight levels at a given rate of descent and the fuel burned in the descent segment"
    intent: "flight mechanics; descent segment time and fuel between flight levels"
    expected_skill: "flight-mechanics/performance/descent-performance"
