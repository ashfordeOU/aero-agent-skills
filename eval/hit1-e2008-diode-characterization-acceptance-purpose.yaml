# Hit@1 fragment: e2008-diode-characterization-acceptance-purpose
# (space-systems/ecss, E-ST-20-08C 9.4.5.2.1). Two tasks per leaf; dcap1
# routes on why the protection diode's electrical performance is
# characterised during acceptance, dcap2 on whether the planned
# characterisation reaches enough of the fitted population to sentence a
# lot. Both must deterministically hit
# space-systems/ecss/e2008-diode-characterization-acceptance-purpose.
tasks:
  - id: dcap1
    query: "state the protection-diode-acceptance-characterisation-purpose for a photovoltaic wing and derive the protection-diode-forward-dissipation-budget and the protection-diode-parasitic-leakage-loss it feeds"
    intent: "ecss photovoltaic assemblies; why protection diode electrical performance is characterised during acceptance"
    expected_skill: "space-systems/ecss/e2008-diode-characterization-acceptance-purpose"
  - id: dcap2
    query: "check the acceptance-lot-diode-sample-coverage is enough to sentence the lot and build the protection-diode-role-objective-map for the declared roles"
    intent: "ecss photovoltaic assemblies; does the planned diode characterisation stand as acceptance evidence"
    expected_skill: "space-systems/ecss/e2008-diode-characterization-acceptance-purpose"
