# Hit@1 wave-17 fragment: thermography (manufacturing-quality/ndt)
# Two tasks per new leaf; w17-thermography-1 routes on detecting a disbond
# or delamination with pulsed thermography and evaluating thermal contrast,
# w17-thermography-2 on selecting flash thermography inspection parameters
# (heating pulse energy and observation time window) for a composite panel.
# Both must deterministically hit manufacturing-quality/ndt/thermography and
# not ndt-method-selection, ultrasonic-inspection, or radiographic-inspection.
tasks:
  - id: w17-thermography-1
    query: "evaluate the thermal contrast of a disbond or delamination detected by pulsed thermography in a composite skin and estimate the time of maximum contrast"
    intent: "Disbond or delamination detection with pulsed thermography and thermal contrast evaluation"
    expected_skill: "manufacturing-quality/ndt/thermography"
  - id: w17-thermography-2
    query: "select the flash thermography inspection parameters, heating pulse energy and observation time window, for a composite panel with a subsurface disbond"
    intent: "Flash thermography inspection parameter selection, pulse energy and observation window, for a composite panel"
    expected_skill: "manufacturing-quality/ndt/thermography"
