# Hit@1 fragment: e2008-ionising-irradiation-pass-criteria (space-systems/ecss)
# Two tasks for the new leaf. ii1 routes on the two post-exposure readings
# judged against the control drawing; ii2 routes on the annealing recovery
# share and the residual the mission carries. Both must deterministically hit
# space-systems/ecss/e2008-ionising-irradiation-pass-criteria.
tasks:
  - id: ii1
    query: "these irradiated diodes came off a total-dose run and the limit set on them has nothing traceable behind it, hold both readings to the same bound and let a tie pass, then say what share of the lot we reject"
    intent: "ECSS-E-ST-20-08C clause 12.6.11.1.2; total ionising dose pass criteria - an untraceable limit set refused, both readings taken against the same bound with a tie admissible, and the lot reject share against its allowance"
    expected_skill: "space-systems/ecss/e2008-ionising-irradiation-pass-criteria"
  - id: ii2
    query: "split the total dose shift into the share the anneal recovered and the residual left, and flag a diode the soak made worse"
    intent: "ECSS-E-ST-20-08C clause 12.6.11.1.2; post irradiation annealing recovery"
    expected_skill: "space-systems/ecss/e2008-ionising-irradiation-pass-criteria"
