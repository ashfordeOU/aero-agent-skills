# Hit@1 fragment: e7041-abort-all-request-sequences-and-report (space-systems/ecss)
# aarp1 routes on the whole-engine sweep with no identifier list; aarp2 routes on
# fault isolation inside the sweep and the report totals. Both must
# deterministically hit
# space-systems/ecss/e7041-abort-all-request-sequences-and-report.
tasks:
  - id: aarp1
    query: "we are handing over to safe mode and I want every request sequence the engine is running stopped at once, I cannot name them"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.8; whole-engine abort sweep that takes no identifier list, with one report entry per running sequence"
    expected_skill: "space-systems/ecss/e7041-abort-all-request-sequences-and-report"
  - id: aarp2
    query: "one of the aborts in the sweep failed on a bad engine channel, should the sweep stop there and what totals does the abort report have to carry"
    intent: "ECSS-E-ST-70-41C clause 6.21.5.8; a failed abort does not stop the sweep and the totals are computed from the assembled entries"
    expected_skill: "space-systems/ecss/e7041-abort-all-request-sequences-and-report"
