# Hit@1 fragment: local-yielding-and-buckling-functionality (space-systems/ecss)
# Case 1 routes on the local plastic zone check at a stress raiser.
# Case 2 routes on crippling, interaction and the governing margin rollup.
tasks:
  - id: local-yielding-and-buckling-functionality-1
    query: "At a fillet in a machined rib the two-dimensional stress state peaks far above nominal. How do I show the local plastic zone there is still permissible when limit load is applied, and what von Mises yield ratio counts as an exceedance?"
    intent: "ECSS-E-ST-32 4.3.3; local yielding control at a stress raiser judged on the equivalent stress at limit load"
    expected_skill: "space-systems/ecss/local-yielding-and-buckling-functionality"
  - id: local-yielding-and-buckling-functionality-2
    query: "Metallic bay with stiffeners and columns: I need crippling of the thin-walled sections, plate buckling, and the combined-load interaction equations where axial and shear act together. How are margins of safety from each check gathered into one governing value before acceptance?"
    intent: "ECSS-E-ST-32 4.3.4; the stability side of the leaf, crippling and combined-load interaction rolled into the governing margin"
    expected_skill: "space-systems/ecss/local-yielding-and-buckling-functionality"
