# Hit@1 fragment: e5053-target-logical-address-field (space-systems/ecss)
# Two tasks for the new leaf. tla1 routes on choosing the octet that opens the
# unit when the destination node has no registered address. tla2 routes on
# splitting a received prefix into path bytes and the target address. Both must
# deterministically hit space-systems/ecss/e5053-target-logical-address-field.
tasks:
  - id: tla1
    query: "the destination node has never been given an address: decide what octet opens the packet transfer unit and what that choice costs on a network with two such nodes"
    intent: "ECSS-E-ST-50-53C clause 5.3.2; registry lookup, default logical address fallback, path-address prefix"
    expected_skill: "space-systems/ecss/e5053-target-logical-address-field"
  - id: tla2
    query: "a received spacewire unit begins with several low octets before the addressing looks sane: split it into path bytes and the target logical address and say where the next field starts"
    intent: "ECSS-E-ST-50-53C clause 5.3.2; path-address prefix decoding, address octet category, remainder offset"
    expected_skill: "space-systems/ecss/e5053-target-logical-address-field"
