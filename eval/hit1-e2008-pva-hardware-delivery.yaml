# Hit@1 fragment: e2008-pva-hardware-delivery (space-systems/ecss)
# Two tasks for the new leaf. hd1 routes on the delivery lot leaving with its
# documentation package; hd2 routes on the release decision for a short
# shipment whose certificate of conformity is not yet issued. Both must
# deterministically hit
# space-systems/ecss/e2008-pva-hardware-delivery.
tasks:
  - id: hd1
    query: "Twelve photovoltaic assemblies are crated, two serials carry open nonconformances, and the conformity paper still names the batch we shipped in March. Which serials can I dispatch, and does each as-built build standard match its issued documentation?"
    intent: "ECSS-E-ST-20-08C clause 5.8; PVA hardware delivery with its documentation package"
    expected_skill: "space-systems/ecss/e2008-pva-hardware-delivery"
  - id: hd2
    query: "Three of the four ordered photovoltaic assembly serials are physically shippable and the certificate of conformity is still a draft. Against the ordered quantity, reconcile what can actually leave and give me one lot verdict."
    intent: "ECSS-E-ST-20-08C clause 5.8; PVA delivery quantity reconciliation and documentation release"
    expected_skill: "space-systems/ecss/e2008-pva-hardware-delivery"
