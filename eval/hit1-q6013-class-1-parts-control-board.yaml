# Hit@1 fragment: q6013-class-1-parts-control-board (space-systems/ecss)
# Two tasks for the leaf. pcb1 routes on the board constitution and the quorum
# share of a decision; pcb2 routes on what a part approval record has to carry
# for the decision to be reconstructable. Both must deterministically hit
# space-systems/ecss/q6013-class-1-parts-control-board.
tasks:
  - id: pcb1
    query: "our class 1 board approved a commercial part, did all the voting roles the board needs sit, did attendance clear the quorum it declared, did anyone absent still cast a vote, and did any of them scrape through on the bare minimum quorum"
    intent: "ECSS-Q-ST-60-13C clause 4.1.3; required voting roles, attendance share against the declared quorum, a vote refused from a member not present, and an approval flagged when it rests on a bare quorum"
    expected_skill: "space-systems/ecss/q6013-class-1-parts-control-board"
  - id: pcb2
    query: "Going through minutes of the board that clears commercial devices on our highest assurance class hardware: several approvals name no data package, none records customer concurrence, and two were written up a fortnight after the purchase order. How much of that voids the approval?"
    intent: "ECSS-Q-ST-60-13C clause 4.1.3; part approval record completeness and approval share against its floor"
    expected_skill: "space-systems/ecss/q6013-class-1-parts-control-board"
