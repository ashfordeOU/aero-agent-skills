# Hit@1 fragment: q6013-class-3-relifing (space-systems/ecss)
# Two tasks for the leaf. rel3a routes on the period a stored lot earned in an
# uncontrolled store and the attribute sample this class inspects in place of
# every unit; rel3b routes on the repeatable re-tinning allowance and the
# cumulative life cap that ends the sequence. Both must deterministically hit
# space-systems/ecss/q6013-class-3-relifing.
tasks:
  - id: rel3a
    query: "our commercial reels sat on an open shelf rather than in a graded store and the period has run out, work out what period they earned at the lowest assurance class and how many units the relifing sample plan inspects"
    intent: "ECSS-Q-ST-60-13C clause 6.3.10; earned storage period grading, the attribute sample plan and the extra tests an uncontrolled store reopens"
    expected_skill: "space-systems/ecss/q6013-class-3-relifing"
  - id: rel3b
    query: "solderability was the only relifing test over the acceptance number and the lot has been re-tinned once already, decide whether it may be re-tinned again and how many further months the cumulative storage life cap still leaves"
    intent: "ECSS-Q-ST-60-13C clause 6.3.10; the repeatable re-tinning allowance, the cumulative life cap and the flat grant trimmed to its headroom"
    expected_skill: "space-systems/ecss/q6013-class-3-relifing"
