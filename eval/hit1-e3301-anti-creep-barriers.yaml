  - id: acb2
    query: "list every route the lubricant can take out of the gear mesh and tell me which ones reach a surface that is supposed to stay dry, like the friction brake face, and whether any of them is an open line of sight where a painted band will not stop the vapour"
    intent: "ECSS-E-ST-33-01C clause 4.7.3.3.3; migration path coverage to sensitive and deliberately un-lubricated surfaces, and vapour transport needing its own control"
    expected_skill: "space-systems/ecss/e3301-anti-creep-barriers"
