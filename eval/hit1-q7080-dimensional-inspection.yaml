# Hit@1 fragment: q7080-dimensional-inspection (space-systems/ecss)
# Two tasks for the new leaf. dimam1 routes on the guard band the measurement
# uncertainty forces on the acceptance limits; dimam2 routes on the first
# article releasing a reduced production check. Both must deterministically hit
# space-systems/ecss/q7080-dimensional-inspection.
tasks:
  - id: dimam1
    query: "dimensional inspection of an additively manufactured housing: the measurement uncertainty eats most of the tolerance band, work out the guard band on the acceptance limits and say whether the reading is conforming or indeterminate"
    intent: "ECSS-Q-ST-70-80C inspection, dimensional; expanded uncertainty as a share of the tolerance band and the guard band it forces"
    expected_skill: "space-systems/ecss/q7080-dimensional-inspection"
  - id: dimam2
    query: "the first article on the new printed housing is measured, decide which dimensions still have to be checked on every production part and which the demonstrated capability releases to a reduced check"
    intent: "ECSS-Q-ST-70-80C inspection; first-article full measurement establishing the mean and spread that earn a reduced production check"
    expected_skill: "space-systems/ecss/q7080-dimensional-inspection"
