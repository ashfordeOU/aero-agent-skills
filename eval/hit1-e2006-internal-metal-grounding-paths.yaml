# Hit@1 fragment: e2006-internal-metal-grounding-paths (space-systems/ecss)
# Case 1 routes on independence being tested at the intermediate tie-points rather
# than counted in straps. Case 2 routes on screening each route against its family
# resistance cap before independence is tested at all.
tasks:
  - id: e2006-internal-metal-grounding-paths-1
    query: "Three bonding straps leave the same shielded harness section but all three land on one secondary bracket en route to structure. Does that arrangement give the two-route redundancy the internal discharge control is after?"
    intent: "ECSS-E-ST-20-06C 9.2.2; two routes are independent only when they share no bond segment and no intermediate tie-point, so a common bracket collapses them into one"
    expected_skill: "space-systems/ecss/e2006-internal-metal-grounding-paths"
  - id: e2006-internal-metal-grounding-paths-2
    query: "One of the two grounding routes off a connector backshell totals twelve milliohms across its bond segments. Do I discard that route before testing independence against the family resistance cap, or keep it and log the resistance separately?"
    intent: "ECSS-E-ST-20-06C 9.2.2; a route over its family resistance cap is not usable and must be discarded before the surviving routes are searched for independence"
    expected_skill: "space-systems/ecss/e2006-internal-metal-grounding-paths"
