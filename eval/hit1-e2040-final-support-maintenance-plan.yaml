# Hit@1 fragment: e2040-final-support-maintenance-plan (space-systems/ecss)
# Two tasks for the leaf. fsmp1 routes on agreeing the definitive post-delivery
# plan and finding the shortest commitment that caps it; fsmp2 routes on the
# technology obsolescence horizon falling inside the support period and what a
# declared mitigation does to it. Both must deterministically hit
# space-systems/ecss/e2040-final-support-maintenance-plan.
tasks:
  - id: fsmp1
    query: "Supplier will keep the design database ten years but the tool licence only six, against eight years of contracted post-delivery cover. Can the maintenance and support plan be agreed at handover, and which commitment is capping it?"
    intent: "ECSS-E-ST-20-40C clause 5.8.3; final support and maintenance plan, per-commitment shortfall against the contracted support period and the binding constraint"
    expected_skill: "space-systems/ecss/e2040-final-support-maintenance-plan"
  - id: fsmp2
    query: "The technology this device uses goes obsolete five years into a ten-year contracted support obligation and the supplier has declared a last-time buy. Where does that leave the obsolescence horizon, and can the final plan still be agreed at delivery?"
    intent: "ECSS-E-ST-20-40C clause 5.8.3; device obsolescence horizon inside the post-delivery support period and the effect of a declared mitigation"
    expected_skill: "space-systems/ecss/e2040-final-support-maintenance-plan"
