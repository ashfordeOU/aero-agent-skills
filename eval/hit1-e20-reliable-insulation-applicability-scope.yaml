# Hit@1 fragment: e20-reliable-insulation-applicability-scope (space-systems/ecss)
# Case 1 routes on the granularity of the decision and on the energy drivers that
# admit a low-voltage net. Case 2 routes on the two finding lists the review ends
# with: nets that cannot be decided, and nets decided in but never implemented.
tasks:
  - id: e20-reliable-insulation-applicability-scope-1
    query: "One connector on our deployment electronics carries a pyro firing line alongside a low-level housekeeping sense wire, and the team has ruled the whole connector in for reliable insulation. Is that the right level to decide at, and does our primary bus at 28 V get pulled in by a large prospective fault current even though the voltage itself is modest?"
    intent: "ECSS-E-ST-20C clause 4.2.1.2.2; the case turns on deciding coverage per net rather than per connector, and on fault power admitting a low-voltage net"
    expected_skill: "space-systems/ecss/e20-reliable-insulation-applicability-scope"
  - id: e20-reliable-insulation-applicability-scope-2
    query: "Under ECSS my reliable insulation scope review has four nets with no stored energy value and two with no failure severity on record, plus eight nets already judged in scope where no insulation is declared anywhere. Are the undecidable ones out of scope by default, and what are those eight?"
    intent: "ECSS-E-ST-20C clause 4.2.1.2.2; the case turns on undecidable nets being a data finding rather than an exemption, and on decided-but-undeclared nets being a coverage gap"
    expected_skill: "space-systems/ecss/e20-reliable-insulation-applicability-scope"
