# Hit@1 fragment: e2008-pva-test-conditions-and-methods (space-systems/ecss)
# Two tasks for the new leaf. ptc1 routes on the governance of the method by
# the source control drawing; ptc2 routes on the illumination condition that
# has to be read as a fraction of the reference spectrum before the tolerance
# band is applied. Both must deterministically hit
# space-systems/ecss/e2008-pva-test-conditions-and-methods.
tasks:
  - id: pvatc1
    query: "confirm the source control drawing governs the test method and that the declared photovoltaic assembly test condition sits inside the drawing tolerance band"
    intent: "ECSS-E-ST-20-08C clause 5.2; PVA test-condition and method governance"
    expected_skill: "space-systems/ecss/e2008-pva-test-conditions-and-methods"
  - id: pvatc2
    query: "convert the measured irradiance into a fraction of the reference spectrum before applying the illumination tolerance on the photovoltaic assembly measurement and check the deviation approval for a substituted method"
    intent: "ECSS-E-ST-20-08C clause 5.2; reference-spectrum illumination condition and method deviation approval"
    expected_skill: "space-systems/ecss/e2008-pva-test-conditions-and-methods"
