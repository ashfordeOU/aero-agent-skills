# Hit@1 fragment: e7041-configuration (space-systems/ecss)
# Two tasks for the new leaf. cfg1 routes on the part data field left once the
# part report overhead is taken off the packet limit; cfg2 routes on the part
# sequence number field width that caps the largest message the configuration
# can carry. Both must deterministically hit
# space-systems/ecss/e7041-configuration.
tasks:
  - id: cfg1
    query: "we sized the message parts straight off the ECSS packet limit; subtract what the part report header itself eats, tell me how much large-message content is really left, and whether the sequence number field can index that many parts"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.1; usable part data field of a large packet transfer downlink part report and a configured part size the packet cannot carry"
    expected_skill: "space-systems/ecss/e7041-configuration"
  - id: cfg2
    query: "with an eight bit part number field and a thousand octet part, tell me the biggest large message this subservice can be configured to send down and whether our declared maximum fits"
    intent: "ECSS-E-ST-70-41C clause 6.13.3.1; part sequence number field ceiling, part count by ceiling division and the largest supported message size"
    expected_skill: "space-systems/ecss/e7041-configuration"
