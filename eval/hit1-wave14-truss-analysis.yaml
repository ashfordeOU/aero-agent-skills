# Hit@1 wave-14 fragment: truss-analysis (structures/fem)
# Two tasks per new leaf; tru1 routes on the direct stiffness method
# vocabulary (element and global stiffness matrices, support
# conditions, nodal displacements by Gaussian elimination, member and
# reaction forces). tru2 is adversarial: it names CalculiX linear
# static FEA and natural frequencies, which could route to
# calculix-linear or modal-analysis, but the element/global stiffness
# assembly and nodal displacement vocabulary must Hit@1
# structures/fem/truss-analysis.
tasks:
  - id: tru1
    query: "solve the 2D plane-truss truss-analysis with the direct-stiffness-method: compute the element-stiffness-matrix for each bar, assemble the global-stiffness-matrix, apply the support-conditions, solve for the nodal-displacements by gaussian-elimination and report the member-forces and reaction-forces"
    intent: "structures; 2D truss analysis by the direct stiffness method: element and global stiffness matrices, support conditions, nodal displacements, member forces and reactions"
    expected_skill: "structures/fem/truss-analysis"
  - id: tru2
    query: "before running the linear static finite element analysis in CalculiX, hand-solve the pin-jointed truss with the direct-stiffness-method: assemble the element-stiffness-matrix into the global-stiffness-matrix, apply the support-conditions and find the nodal-displacements, member-forces and reaction-forces rather than the natural frequencies"
    intent: "structures; hand truss solve with element/global stiffness assembly and Gaussian elimination, adversarial against CalculiX linear FEA and modal analysis"
    expected_skill: "structures/fem/truss-analysis"
