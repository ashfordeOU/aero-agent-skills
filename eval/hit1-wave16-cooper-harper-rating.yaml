# Hit@1 wave-16 fragment: cooper-harper-rating (flight-mechanics)
# Two tasks per new leaf skill; chr1 routes on handling qualities
# rating descriptors (controllable, pilot compensation), chr2 is
# adversarial (adequate performance wording must deterministically
# route to the cooper-harper-rating leaf, not to longitudinal-stability
# or dynamic-stability in the flight-mechanics pack).
tasks:
  - id: w16-cooper-harper-rating-1
    query: "rate the handling qualities of an aircraft that is controllable but requires considerable pilot compensation: assign the cooper-harper rating and classify the band"
    intent: "Cooper-Harper rating assignment from evaluation descriptors: controllable, adequate performance, adequate tolerances, considerable compensation"
    expected_skill: "flight-mechanics/handling-qualities/cooper-harper-rating"
  - id: w16-cooper-harper-rating-2
    query: "adequate performance is not attainable for the piloted evaluation task even with extensive compensation: determine the cooper-harper rating and the handling qualities level for the flyability assessment"
    intent: "adversarial: inadequate performance with extensive compensation must route to the cooper-harper-rating leaf for the rating and level, not to longitudinal-stability or dynamic-stability"
    expected_skill: "flight-mechanics/handling-qualities/cooper-harper-rating"
