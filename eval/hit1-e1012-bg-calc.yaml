# Hit@1 fragment: e1012-bg-calc (space-systems/ecss)
# Case 1 routes on building the per-bin deposited-energy spectrum from stopping
# power. Case 2 routes on the layer-by-layer attenuation chain and on what an
# unallocated dose allowance means for the verdict.
tasks:
  - id: e1012-bg-calc-1
    query: "Our star tracker sensor sits behind 4 mm of aluminium and I have a differential proton flux in twelve energy bins plus stopping power figures for silicon. How do I turn that into deposited energy bin by bin and an integrated absorbed dose in gray?"
    intent: "ECSS-E-ST-10C 10.4.9; binned convolution of flux with stopping power into a deposited-energy spectrum, rather than a single representative energy"
    expected_skill: "space-systems/ecss/e1012-bg-calc"
  - id: e1012-bg-calc-2
    query: "I want to knock the incident particle flux down exponentially through each extra mass layer before totting up absorbed dose in gray across every species, then check that against the allocated allowance. What if no allowance was ever set?"
    intent: "ECSS-E-ST-10C 10.4.9; attenuation applied per intervening layer before the dose sum, and an unset allowance treated as an open requirement rather than a pass"
    expected_skill: "space-systems/ecss/e1012-bg-calc"
