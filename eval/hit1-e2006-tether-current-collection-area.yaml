# Hit@1 fragment: e2006-tether-current-collection-area (space-systems/ecss)
# Case 1 routes on sizing the area: ambient flux times the geometry-specific
# enhancement. Case 2 routes on the two checks that run after the area passes, the
# material rating and the sheath regime the closed form assumes.
tasks:
  - id: e2006-tether-current-collection-area-1
    query: "Sizing the bare tape collector on our tether for 1.5 A at 200 V bias in a night-side plasma: do I take the random flux from ambient electron density plus temperature, then layer the orbital-motion-limited enhancement on for a flat tape, or is a sphere law close enough?"
    intent: "ECSS-E-ST-20-06C clause 10.2.2; the random-flux density and the geometry-specific enhancement are both needed, and a sphere law carried onto a tape gets the area wrong by a bias-dependent factor"
    expected_skill: "space-systems/ecss/e2006-tether-current-collection-area"
  - id: e2006-tether-current-collection-area-2
    query: "Our recorded collecting area meets the sizing margin, but operating current divided by it gives a surface current density near the material erosion rating, while the collector radius is comparable to the Debye length. Are those two checks independent of each other?"
    intent: "ECSS-E-ST-20-06C clause 10.2.2; a passed sizing check does not carry the material current-density rating, and a collector larger than the Debye length has left the thin-sheath regime the closed form assumes"
    expected_skill: "space-systems/ecss/e2006-tether-current-collection-area"
