# Hit@1 wave-14 fragment: frequency-response-design (gnc-autonomy/control)
# Two tasks per new leaf; fr1 routes on Bode magnitude and phase with the
# gain/phase margins and the stability verdict, fr2 is adversarial against
# root-locus and lead-lag vocabulary (gain selection, closed loop poles)
# but must Hit@1 frequency-response-design. Both must deterministically
# hit gnc-autonomy/control/frequency-response-design.
tasks:
  - id: fr1
    query: "compute the bode frequency response of the open loop transfer function and find the gain-margin, phase-margin, gain crossover frequency and phase crossover frequency for the closed loop stability verdict"
    intent: "guidance navigation control; Bode frequency response magnitude and phase with the gain/phase margins and the stability verdict"
    expected_skill: "gnc-autonomy/control/frequency-response-design"
  - id: fr2
    query: "before selecting the gain for the closed loop poles, estimate the phase-margin and gain-margin from the bode frequency response of the open loop plant transfer function"
    intent: "guidance navigation control; margins from the Bode frequency response before gain selection for the closed loop poles"
    expected_skill: "gnc-autonomy/control/frequency-response-design"
