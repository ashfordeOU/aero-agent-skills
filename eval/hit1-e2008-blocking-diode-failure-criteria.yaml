# Hit@1 fragment: e2008-blocking-diode-failure-criteria (space-systems/ecss)
# Two tasks for the new leaf. to1 routes on turning a tested blocking diode
# subgroup into per-part failure calls; to2 routes on the absolute-limit arm,
# the two function losses and the reference reverse bias. Both must
# deterministically hit
# space-systems/ecss/e2008-blocking-diode-failure-criteria.
tasks:
  - id: to1
    query: "a planar blocking diode subgroup was characterised, run through an endurance test and characterised again, work out which parts the test and the closing inspection leave failed"
    intent: "ECSS-E-ST-20-08C clause 12.7.1; conditions that mark a planar blocking diode failed within its subgroup test programme"
    expected_skill: "space-systems/ecss/e2008-blocking-diode-failure-criteria"
  - id: to2
    query: "one blocking diode drifted only slightly but its forward drop is now above the drawing ceiling, another reads no reverse blocking voltage, a third needs nine volts before it conducts and a fourth had its leakage taken at five volts, decide what each one is"
    intent: "ECSS-E-ST-20-08C clause 12.7.1; absolute limit breach, lost reverse blocking, lost forward conduction and a reverse reading taken below the reference bias"
    expected_skill: "space-systems/ecss/e2008-blocking-diode-failure-criteria"
