# Hit@1 fragment: mass-and-inertia-control (space-systems/ecss)
# Case 1 routes on the reserve a design phase requires and an unrecorded allocation.
# Case 2 routes on deriving the inertia properties that feed the mechanics summary.
tasks:
  - id: mass-and-inertia-control-1
    query: "Entering phase C, our current best estimate across the platform sits seven percent under the allocated figure. Is that reserve sufficient for the phase, and how does a unit with no allocation recorded against it get treated in the roll-up?"
    intent: "ECSS-E-ST-32 4.5.5; the case turns on the phase-specific minimum reserve and on a missing allocation being a finding rather than an unconstrained item"
    expected_skill: "space-systems/ecss/mass-and-inertia-control"
  - id: mass-and-inertia-control-2
    query: "I have every unit's estimate plus its coordinates in the spacecraft frame. How do I get the centre of mass and the three moments about the reference point so they can be written into the mechanics summary document the review expects?"
    intent: "ECSS-E-ST-32 4.5.5; the case turns on deriving system-level centre of mass and moments of inertia from component entries for the summary data requirement"
    expected_skill: "space-systems/ecss/mass-and-inertia-control"
