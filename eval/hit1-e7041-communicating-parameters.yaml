# Hit@1 fragment: e7041-communicating-parameters (space-systems/ecss)
# Two tasks for the new leaf. cpar1 routes on an activation argument the
# interface never declared; cpar2 routes on an omitted input taking a default
# and on a procedure writing back to an input-only parameter. Both must
# deterministically hit space-systems/ecss/e7041-communicating-parameters.
tasks:
  - id: cpar1
    query: "the ground swears it sent the soak-time argument with the procedure activation and the on-board run used something else entirely, work out what the engine does with an argument name the loaded procedure does not declare"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.7; an OBCP activation binds arguments to declared parameters by name and an undeclared name is refused rather than dropped, because it usually means the ground holds a different revision of the procedure than the one loaded"
    expected_skill: "space-systems/ecss/e7041-communicating-parameters"
  - id: cpar2
    query: "a procedure ran with a dwell count nobody supplied and then wrote a value back onto one of its own activation arguments, check what the declared direction and default of each communicated parameter actually permit"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.7; an omitted optional input takes the default declared with the parameter, a mandatory input has no default so its absence is detectable, and direction is a permission so a procedure writing to an input-only parameter is an interface violation"
    expected_skill: "space-systems/ecss/e7041-communicating-parameters"
