# Hit@1 wave-18 fragment: orbital-decay (orbit-mechanics)
# Two tasks per new leaf; q1 routes on drag decay rate and deorbit
# lifetime from the ballistic coefficient, q2 routes on ballistic
# coefficient sizing and the 25-year disposal rule. Both must
# deterministically hit space-systems/orbit-mechanics/orbital-decay.
tasks:
  - id: w18-orbital-decay-1
    query: "estimate the orbital decay rate and deorbit lifetime of a 500 km LEO satellite with mass 300 kg, drag area 1.5 m2 and drag coefficient 2.2, and check the 25-year disposal rule"
    intent: "orbit mechanics; drag decay rate and deorbit lifetime from mass, drag area, and drag coefficient"
    expected_skill: "space-systems/orbit-mechanics/orbital-decay"
  - id: w18-orbital-decay-2
    query: "compute the ballistic coefficient and decay per orbit for a small satellite so that atmospheric drag deorbits it within the 25-year lifetime limit from 600 km altitude"
    intent: "orbit mechanics; ballistic coefficient sizing and 25-year disposal compliance for LEO decay"
    expected_skill: "space-systems/orbit-mechanics/orbital-decay"
