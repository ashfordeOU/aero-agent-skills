# Hit@1 fragment: e2001-test-execution-control (space-systems/ecss)
# Case 1 routes on procedure content and the order the setup forces.
# Case 2 routes on the level schedule and how log departures are categorised.
tasks:
  - id: e2001-test-execution-control-1
    query: "Grading a written multipactor test procedure: what content must it carry, and is it a violation that the detection baseline was taken after power first reached the item, or that the chamber was vented before power-down?"
    intent: "ECSS-E-ST-20-01C 8.1; procedure content completeness and the precedence pairs the setup imposes on the declared step order"
    expected_skill: "space-systems/ecss/e2001-test-execution-control"
  - id: e2001-test-execution-control-2
    query: "The execution log shows one dwell skipped and two levels run out of sequence, and the top level never got to nominal plus the test-margin. Which of those count as uncontrolled departures rather than authorised deviations?"
    intent: "ECSS-E-ST-20-01C 8.1; grading the level schedule and sorting each departure into authorised, unauthorised or uncontrolled"
    expected_skill: "space-systems/ecss/e2001-test-execution-control"
