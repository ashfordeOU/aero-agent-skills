# Hit@1 wave-4 fragment: cg-envelope (vehicle-design/mass-properties)
# Two tasks per new leaf skill; cge1 routes on the cg envelope
# polygon check and the forward/aft limit violation at the operating
# weight, cge2 routes on the static margin from the neutral point
# and the cg excursion when the fuel burns. Both must
# deterministically hit vehicle-design/mass-properties/cg-envelope.
tasks:
  - id: cge1
    query: "check the cg position against the envelope polygon and report which limit is violated, forward or aft, at the operating weight"
    intent: "mass properties; cg envelope polygon membership and forward/aft limit violation"
    expected_skill: "vehicle-design/mass-properties/cg-envelope"
  - id: cge2
    query: "compute the static margin between the neutral point and the cg divided by the mac and the cg excursion as the fuel burns"
    intent: "mass properties; static margin vs neutral point and fuel-burn cg excursion"
    expected_skill: "vehicle-design/mass-properties/cg-envelope"
