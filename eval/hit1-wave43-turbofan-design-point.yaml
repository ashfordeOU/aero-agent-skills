# Hit@1 wave-43 fragment: turbofan-design-point (propulsion)
# Two tasks per new leaf skill. w43-turbofan-design-point-1 routes on the
# separate-exhaust-cycle station-level design point from OPR, turbine-inlet
# temperature, bypass ratio and fan pressure ratio; w43-turbofan-design-point-2
# routes on the two-spool-work-balance closure with the per-stream nozzle
# exit velocities and net thrust.
tasks:
  - id: w43-turbofan-design-point-1
    query: "analyze the turbofan-design-point of the two-spool separate-exhaust-cycle at mach 0.8 and 35000 feet: traverse the fan-stream-station-states and the core stream from the overall pressure ratio, the turbine-inlet temperature, the bypass ratio and the fan pressure ratio with the component efficiencies, and report the burner fuel-air ratio, the net thrust and the tsfc"
    intent: "propulsion; two-spool separate-exhaust turbofan design-point station-level cycle from OPR, turbine-inlet temperature, bypass ratio and fan pressure ratio with component efficiencies"
    expected_skill: "propulsion/turbofan/turbofan-design-point"
  - id: w43-turbofan-design-point-2
    query: "close the two-spool-work-balance of the turbofan-design-point: size the hp and lp turbine exit temperatures that drive the high-pressure compressor and the fan plus booster, then the core and fan nozzle exit velocities and the net thrust of the separate-exhaust-cycle"
    intent: "propulsion; HP and LP spool work balances of the turbofan design point with the per-stream nozzle exit velocities and net thrust"
    expected_skill: "propulsion/turbofan/turbofan-design-point"
