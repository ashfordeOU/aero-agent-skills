  - id: c2sgl2
    query: "the broker offers its own process instead of ours and the prime waived a rule with no approval reference, so which is a q60c2-equivalent-supplier-rule-acceptance, which is a q60c2-flow-down-break and which rule was never in force here at all"
    intent: "ECSS-Q-ST-60C clause 5.2.2.1; Class 2 equivalent supplier rule acceptance versus flow-down break and unapproved waiver"
    expected_skill: "space-systems/ecss/q60-class-2-selection-general-rules"
