# Hit@1 fragment: e7041-persistent-scheduling (space-systems/ecss)
# Two tasks for the new leaf. ps1 routes on the difference between an entry the
# release consumes and one it re-arms; ps2 routes on the residual occupancy of
# the schedule after a run of orbits. Both must deterministically hit
# space-systems/ecss/e7041-persistent-scheduling.
tasks:
  - id: ps1
    query: "half these position-based activities are meant to re-arm every third orbit and the rest are consumed the moment they fire, how is that declared on each entry and how often does each one actually release"
    intent: "ECSS-E-ST-70-41C clause 6.22.5; persistent entries with a re-arming orbit interval and repeat limit against one-shot entries consumed at release"
    expected_skill: "space-systems/ecss/e7041-persistent-scheduling"
  - id: ps2
    query: "after the next twelve orbits how many slots will the position based schedule still be holding and which entries never fired inside that window"
    intent: "ECSS-E-ST-70-41C clause 6.22.5; projection of releases over an orbit sweep and the residual schedule occupancy left when it ends"
    expected_skill: "space-systems/ecss/e7041-persistent-scheduling"
