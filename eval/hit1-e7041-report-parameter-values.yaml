# Hit@1 fragment: e7041-report-parameter-values (space-systems/ecss)
# Two tasks for the new leaf. rpv1 routes on reporting current values for a
# named identifier list in request order; rpv2 routes on the report path's own
# refusals - a stored value that no longer fits its definition is withheld, and
# a request where nothing resolves fails at start. Neither may reach
# e7041-set-parameter-values, which writes. Both must deterministically hit
# space-systems/ecss/e7041-report-parameter-values.
tasks:
  - id: rpv1
    query: "Ground wants the current readings for a handful of named on-board parameters, and wants them back in the same sequence they were asked for so they can line them up. What happens to an identifier nothing recognises?"
    intent: "ECSS-E-ST-70-41C clause 6.20.4.1; per-identifier value report in request order with reported, withheld and unknown totals"
    expected_skill: "space-systems/ecss/e7041-report-parameter-values"
  - id: rpv2
    query: "one of the parameters I asked to read back holds a stored value outside its own declared domain and another identifier does not exist, what goes in the value report and when does the request fail at start instead"
    intent: "ECSS-E-ST-70-41C clause 6.20.4.1; withhold the defective stored value, notify per unknown identifier, fail at start only when nothing resolved"
    expected_skill: "space-systems/ecss/e7041-report-parameter-values"
