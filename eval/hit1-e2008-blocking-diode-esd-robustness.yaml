# Hit@1 fragment: e2008-blocking-diode-esd-robustness (space-systems/ecss)
# Two tasks for the new leaf. bdesd1 routes on the human-contact discharge step
# stress for blocking diodes; bdesd2 routes on reading the post-pulse leakage
