# Hit@1 fragment: e2008-sca-spectral-response-process (space-systems/ecss)
# Two tasks for the new leaf. sr1 routes on the pre-irradiation short circuit
# current reading held against a reference device; sr2 routes on the correction
# back to reference conditions and the baseline a planned sample never got.
# Both must deterministically hit
# space-systems/ecss/e2008-sca-spectral-response-process.
tasks:
  - id: sr1
    query: "compare the short circuit current of the test samples against the reference cell before the irradiation campaign starts"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.5.2; pre-irradiation short circuit current baseline for solar cell assemblies"
    expected_skill: "space-systems/ecss/e2008-sca-spectral-response-process"
  - id: sr2
    query: "correct the pre-irradiation sample currents to reference irradiance and temperature and find the sample planned for exposure with no baseline reading"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.5.2; reference-condition current correction and irradiation baseline coverage"
    expected_skill: "space-systems/ecss/e2008-sca-spectral-response-process"
