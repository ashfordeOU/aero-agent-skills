# geometry terms (glide ratio, descent angle, lift to drag ratio),
# gl2 routes on the descent outputs (sink rate, time to descend,
# airspeed, altitude loss). Both must deterministically hit
# flight-mechanics/performance/glide-performance.
tasks:
  - id: gl1
    query: "compute the glide ratio and the descent angle from the lift to drag ratio for the unpowered glide"
    intent: "flight mechanics; glide ratio and descent angle from lift to drag ratio in unpowered glide"
    expected_skill: "flight-mechanics/performance/glide-performance"
  - id: gl2
    query: "find the sink rate and the time to descend from the airspeed and the altitude loss in the glide"
    intent: "flight mechanics; sink rate and time to descend from airspeed and altitude loss"
    expected_skill: "flight-mechanics/performance/glide-performance"
