# Hit@1 fragment: e2020-rlcl-limitation-mode-derating (space-systems/ecss)
# Two tasks for the leaf. rlcd1 routes on the limitation-mode stress corner and
# the derated comparison it feeds; rlcd2 routes on the retrigger duty deciding
# whether a part runs at the peak or the average. Both must deterministically
# hit space-systems/ecss/e2020-rlcl-limitation-mode-derating.
tasks:
  - id: rlcd1
    query: "Reviewers want proof the limiter survives a hard short, not just normal conduction. While it sits holding its foldback current with almost the whole bus across the pass element, are voltage, current, dissipation and junction temperature all still under the derated allowances?"
    intent: "ECSS-E-ST-20C clause 5.2.3.5.1; derating at the limitation-mode stress corner"
    expected_skill: "space-systems/ecss/e2020-rlcl-limitation-mode-derating"
  - id: rlcd2
    query: "work out whether the limiter pass device runs at the peak limitation dissipation or the retrigger duty-averaged value, and which series part ends up limiting the design"
    intent: "ECSS-E-ST-20C clause 5.2.3.5.1; retrigger duty averaging and the limiting component"
    expected_skill: "space-systems/ecss/e2020-rlcl-limitation-mode-derating"
