# Hit@1 fragment: e3301-mli-design-for-mechanisms (space-systems/ecss)
# Two tasks for the new leaf. mdm1 routes on the blanket billowing into a swept
# path once it relaxes in vacuum; mdm2 routes on what the clearance cut-outs cost
# in effective emittance and on layer grounding. Both must deterministically hit
# space-systems/ecss/e3301-mli-design-for-mechanisms.
tasks:
  - id: mdm1
    query: "twenty layers plus a cover sit right next to the deployment arm, work out whether the blanket still clears the sweep once it relaxes on orbit and whether the hole round the shaft is big enough"
    intent: "ECSS-E-ST-33-01C clause 4.7.4.3; blanket thickness, sweep envelope, tolerance chain and billow allowance stacked into a required clearance, and a cut-out sized on the swept diameter"
    expected_skill: "space-systems/ecss/e3301-mli-design-for-mechanisms"
  - id: mdm2
    query: "we opened the blanket up to keep the moving parts clear, tell me what that costs in heat leak and whether every layer still has a route to structure"
    intent: "ECSS-E-ST-33-01C clause 4.7.4.3; open-area fraction raising the effective emittance and the parasitic leak, plus ground-point count and series ground-path resistance"
    expected_skill: "space-systems/ecss/e3301-mli-design-for-mechanisms"
