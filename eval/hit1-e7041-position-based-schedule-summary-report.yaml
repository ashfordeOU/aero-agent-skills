# Hit@1 fragment: e7041-position-based-schedule-summary-report
# (space-systems/ecss). pbssum1 routes on what a summary entry carries and
# what it must leave out; pbssum2 routes on an orbit position window that
# wraps through the origin of the revolution. Both must deterministically hit
# space-systems/ecss/e7041-position-based-schedule-summary-report.
tasks:
  - id: pbssum1
    query: "decide what one entry of our position based schedule summary report should hold and whether the scheduled telecommand itself belongs in it, then give me the report order for two activities sitting at the same orbit position"
    intent: "ECSS-E-ST-70-41C clause 6.22.9.1; summary entry carries the request identification, orbit position and group but not the request content, positional ordering with the identification as tie break"
    expected_skill: "space-systems/ecss/e7041-position-based-schedule-summary-report"
  - id: pbssum2
    query: "the ground asked for a schedule summary from 350 degrees round to 10 degrees and we returned nothing; work out which scheduled activities that orbit position window should have selected"
    intent: "ECSS-E-ST-70-41C clause 6.22.9.1; wrap-aware orbit position window containment and inclusive bounds on the summary subset selection"
    expected_skill: "space-systems/ecss/e7041-position-based-schedule-summary-report"
