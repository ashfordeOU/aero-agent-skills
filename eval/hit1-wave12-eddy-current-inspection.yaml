  - id: eci2
    query: "select the eddy current test frequency for a subsurface flaw at 1 mm depth in aluminum with 30 percent IACS conductivity, keeping the flaw within one standard depth of penetration, and interpret the lift-off trajectory on the impedance plane"
    intent: "adversarial: frequency selection and material wording (select, aluminum, conductivity) must route to eddy-current-inspection"
    expected_skill: "manufacturing-quality/ndt/eddy-current-inspection"
