# Hit@1 wave-12 fragment: eddy-current-inspection (manufacturing-quality/ndt)
# Two tasks per new leaf skill; eci2 is cross-cutting (frequency selection
# wording that could route to ndt-method-selection, must deterministically
# route to eddy-current-inspection).
tasks:
  - id: eci1
    query: "compute the standard depth of penetration for an eddy current inspection of copper at 100 kHz with 5.8e7 S/m conductivity, and the phase lag at one depth of penetration for the impedance plane"
    intent: "manufacturing-quality; eddy current depth of penetration from frequency and conductivity, phase lag at one delta"
