# Hit@1 fragment: e2006-material-assembly-qualification-testing (space-systems/ecss)
# Case 1 routes on deriving the gradient polarity from measurement rather than a label.
# Case 2 routes on what makes a run qualifying and how items are tracked separately.
tasks:
  - id: e2006-material-assembly-qualification-testing-1
    query: "Our campaign log claims both gradient polarities were covered, but the bias supply may have been wired backwards. How do I derive each run's polarity out of the measured dielectric surface and structure potentials instead of trusting its label?"
    intent: "ECSS-E-ST-20-06C 6.6.3; polarity comes from the sign of surface potential against structure, so a reversed supply silently repeats one condition and leaves the other open"
    expected_skill: "space-systems/ecss/e2006-material-assembly-qualification-testing"
  - id: e2006-material-assembly-qualification-testing-2
    query: "A run at 4.5 kV against a worst-case predicted 3 kV differential came back quiet, but no discharge detection channel was recording. Does that qualify the inverted condition, and does qualifying the assembly close the material obligation as well?"
    intent: "ECSS-E-ST-20-06C 6.6.3; an uninstrumented quiet run is not evidence, and the assembly and the material inside it are tracked as separate items"
    expected_skill: "space-systems/ecss/e2006-material-assembly-qualification-testing"
