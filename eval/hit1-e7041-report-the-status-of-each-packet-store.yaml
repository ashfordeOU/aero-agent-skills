# Hit@1 fragment: e7041-report-the-status-of-each-packet-store (space-systems/ecss)
# Two tasks for the new leaf. rsps1 routes on the whole-set sweep of what each
# store is doing; rsps2 routes on deriving the activity from the three states and
# on the dormant loaded store. Both must deterministically hit
# space-systems/ecss/e7041-report-the-status-of-each-packet-store.
tasks:
  - id: rsps1
    query: "I want a sweep of every packet store on board saying which are recording and which are being read out, not how big they are or what type they are"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.6; whole-set status report carrying the storage state and both retrieval states per store"
    expected_skill: "space-systems/ecss/e7041-report-the-status-of-each-packet-store"
  - id: rsps2
    query: "one recorder is switched off with nothing reading it and still holds packets, and another reports an activity field that disagrees with its switches, what should the status report say"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.6; the activity is derived from the three states and a dormant loaded store is surfaced as a finding"
    expected_skill: "space-systems/ecss/e7041-report-the-status-of-each-packet-store"
