# Hit@1 fragment: q60-class-1-declared-components-list (space-systems/ecss,
# Q-ST-60C 4.1.4). Two tasks per leaf; dcl1 routes on the file form and the
# build revision a delivered list was issued against, dcl2 on the per-item
# obligation and the part-count-weighted coverage it is graded by. Both must
# deterministically hit
# space-systems/ecss/q60-class-1-declared-components-list.
tasks:
  - id: dcl1
    query: "assess the q60-dcl-exchange-format-editability of each delivered file and the q60-dcl-revision-currency it was issued against"
    intent: "ecss eee components; an editable declared components list delivered for one equipment item"
    expected_skill: "space-systems/ecss/q60-class-1-declared-components-list"
  - id: dcl2
    query: "weight the q60-dcl-item-coverage-fraction over the q60-dcl-per-equipment-item-issue obligation then return the q60-dcl-issue-verdict"
    intent: "ecss eee components; per-item list obligation and the coverage a build has to reach"
    expected_skill: "space-systems/ecss/q60-class-1-declared-components-list"
