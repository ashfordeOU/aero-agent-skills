# Hit@1 fragment: e2008-coverglass-coating-orientation-marking
# (space-systems/ecss, E-ST-20-08C 8.3.3). Two tasks per leaf; ccom1 routes on
# which face carries the coating and whether the indicator may sit where it is
# declared, ccom2 on the flip ambiguity and the lot convention. Both must
# deterministically hit
# space-systems/ecss/e2008-coverglass-coating-orientation-marking.
tasks:
  - id: ccom1
    query: "review the coverglass-coated-face-identification scheme for coverglass-orientation-indicator-admissibility and the coverglass-clear-aperture-indicator-loss it costs"
    intent: "ecss coverglasses; which face carries the coating and where the indicator sits"
    expected_skill: "space-systems/ecss/e2008-coverglass-coating-orientation-marking"
  - id: ccom2
    query: "check the coverglass-flip-ambiguity of the orientation cues and audit the coverglass-lot-orientation-convention across the delivered lot"
    intent: "ecss coverglasses; orientation that survives handling from tray to bond"
    expected_skill: "space-systems/ecss/e2008-coverglass-coating-orientation-marking"
