# Hit@1 fragment: q60-class-1-radiation-hardness-selection (space-systems/ecss)
# Two tasks for the new leaf. to1 routes on accumulating the mission dose over
# the declared phases and matching a part's tolerance to it over the whole
# lifetime; to2 routes on a rate-sensitive linear part characterised at a high
# dose rate and on a destructive single event threshold under the environment.
# Both must deterministically hit
# space-systems/ecss/q60-class-1-radiation-hardness-selection.
tasks:
  - id: to1
    query: "the operational phase stretched from nine years to nineteen, so re-run this class 1 part across the full mission lifetime: does its tolerance still cover the ionising dose plus the displacement damage behind its design shielding once margin is raised"
    intent: "ECSS-Q-ST-60C clause 4.2.2.4; accumulating total ionising dose and displacement damage phase by phase over the declared mission lifetime and raising each by the radiation design margin"
    expected_skill: "space-systems/ecss/q60-class-1-radiation-hardness-selection"
  - id: to2
    query: "this class 1 bipolar linear device was characterised only at high dose rate and its latch-up onset sits below the worst-case heavy ion flux - which mechanism binds selection, and can scrubbing be credited once recoverable consequences are split from destructive ones"
    intent: "ECSS-Q-ST-60C clause 4.2.2.4; enhanced low dose rate capability cut, destructive versus recoverable single event consequences, and mitigation credit"
    expected_skill: "space-systems/ecss/q60-class-1-radiation-hardness-selection"
