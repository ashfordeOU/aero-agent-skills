# Hit@1 fragment: e20-solar-cell-and-array-qualification (space-systems/ecss)
# Case 1 routes on the route decision and the item chain: heritage against the
# environment envelope, and which assemblies a bare-cell programme does not cover.
# Case 2 routes on the quantitative demands the chosen route then owes.
tasks:
  - id: e20-solar-cell-and-array-qualification-1
    query: "Our array reuses a flight-proven triple-junction cell but the new orbit doubles the eclipse cycles. Does that stay a similarity case on heritage, and does a bare-cell qualification carry the cell-coverglass assembly and the interconnect with it?"
    intent: "ECSS-E-ST-20C clause 5.5.1; an unchanged design in an environment the qualified envelope does not cover is a delta case, and each item category in the chain owns its own test set"
    expected_skill: "space-systems/ecss/e20-solar-cell-and-array-qualification"
  - id: e20-solar-cell-and-array-qualification-2
    query: "We planned 15000 thermal cycles because the mission sees 15000 eclipses, and the radiation test fluence equals the end-of-life equivalent dose. Is a qualification factor owed on each, and which degradation terms multiply into the end-of-life power?"
    intent: "ECSS-E-ST-20C clause 5.5.1; the cycle count and the fluence both carry a qualification factor above the mission value, and the end-of-life power is the product of every degradation term rather than the radiation one alone"
    expected_skill: "space-systems/ecss/e20-solar-cell-and-array-qualification"
