# Hit@1 fragment: q6005-standard-marking-requirements (space-systems/ecss,
# Q-ST-60-05 10.2.1). Two tasks per leaf; sm1 routes on the field set and the
# forms that carry traceability, sm2 on lettering height, contrast and the
# solvent-resistance evidence. Both must deterministically hit
# space-systems/ecss/q6005-standard-marking-requirements.
tasks:
  - id: sm1
    query: "check the hybrid-body-marking-fields a delivered unit carries and validate the hybrid-lot-date-code-format and the serial number behind them"
    intent: "ecss hybrids; the standard content of a hybrid package body mark"
    expected_skill: "space-systems/ecss/q6005-standard-marking-requirements"
  - id: sm2
    query: "size the hybrid-marking-character-height for the body area, compute the hybrid-marking-contrast-ratio and weigh hybrid-marking-solvent-resistance with post-test-marking-legibility"
    intent: "ecss hybrids; how hard-wearing and readable hybrid package lettering has to be"
    expected_skill: "space-systems/ecss/q6005-standard-marking-requirements"
