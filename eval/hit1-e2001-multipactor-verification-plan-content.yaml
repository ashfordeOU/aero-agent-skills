# Hit@1 fragment: e2001-multipactor-verification-plan-content (space-systems/ecss)
# Case 1 routes on whether an entry adds anything, and on weighting the
# additions unequally. Case 2 routes on the per-route extra fields and the
# engineering check on the detection pair.
tasks:
  - id: e2001-multipactor-verification-plan-content-1
    query: "Half the headings in our plan point back at the parent verification plan and three just say to be defined. Does a pointer to the parent count as content in the audit, and should a missing item list weigh the same as a missing facility annex?"
    intent: "ECSS-E-ST-20-01C clause 4.2.2; a cross-reference to the generic data item adds nothing, and the additions are weighted rather than counted"
    expected_skill: "space-systems/ecss/e2001-multipactor-verification-plan-content"
  - id: e2001-multipactor-verification-plan-content-2
    query: "One critical item is being closed by similarity and another by test. What extra fields does each route owe in the plan, and is a pair of identical local probes acceptable as the detection pair?"
    intent: "ECSS-E-ST-20-01C clause 4.2.2; the agreed route fixes which extra fields an item owes, and the detection pair must be two distinct methods of mixed scope"
    expected_skill: "space-systems/ecss/e2001-multipactor-verification-plan-content"
