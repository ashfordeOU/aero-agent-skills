# Hit@1 fragment: e2001-level-one-multicarrier-method (space-systems/ecss)
# Case 1 routes on building the in-phase crest and comparing it with the boundary.
# Case 2 routes on the dwell above the derated boundary against build-up time.
tasks:
  - id: e2001-level-one-multicarrier-method-1
    query: "Eight carriers at 90 W each feed a region whose single-carrier boundary voltage we already know. How do I turn each carrier power into a gap voltage and add the crests to see whether the in-phase peak breaks that boundary with the owed margin?"
    intent: "ECSS-E-ST-20-01C 5.3.2.2.4; converting carrier powers to gap voltages and summing crests into the worst-case envelope against the derated boundary"
    expected_skill: "space-systems/ecss/e2001-level-one-multicarrier-method"
  - id: e2001-level-one-multicarrier-method-2
    query: "Our crest lands 1 dB short of the margin the route owes. How long does the envelope hold over the derated boundary within one repetition, and how does that dwell sit against the build-up time for twenty gap crossings?"
    intent: "ECSS-E-ST-20-01C 5.3.2.2.4; the time argument that rescues a crest short of margin, dwell against the agreed gap-crossing build-up"
    expected_skill: "space-systems/ecss/e2001-level-one-multicarrier-method"
