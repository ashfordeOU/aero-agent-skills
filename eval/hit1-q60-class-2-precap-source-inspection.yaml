# Hit@1 fragment: q60-class-2-precap-source-inspection (space-systems/ecss)
# Two tasks for the new leaf. pc2a routes on which Class 2 packages present a
# pre-cap witness point at all and on who may hold the witness; pc2b routes on
# the in-line monitoring programme offered in place of a witness and on the
# witnessed coverage computed per part type. Both must deterministically hit
# space-systems/ecss/q60-class-2-precap-source-inspection.
tasks:
  - id: pc2a
    query: "half our Class 2 lots are moulded plastic and the buyer raised a nonconformance on each for having no pre-cap witness, while on the ceramic lots the manufacturer's own quality department signed the inspection"
    intent: "ECSS-Q-ST-60C clause 5.3.4; a pre-cap witness point exists only where a cavity is sealed, and the Class 2 witness may be delegated to an approved inspection agency but never held by the manufacturer"
    expected_skill: "space-systems/ecss/q60-class-2-precap-source-inspection"
  - id: pc2b
    query: "the vendor sealed two Class 2 cavity lots before we arrived and offered their in-line monitoring programme instead, and our witnessed lots are all one part type with none on the other, what coverage do we actually have"
    intent: "ECSS-Q-ST-60C clause 5.3.4; the accepted in-line monitoring programme route for an unwitnessed lot and the witnessed coverage computed per part type against the minimum required"
    expected_skill: "space-systems/ecss/q60-class-2-precap-source-inspection"
