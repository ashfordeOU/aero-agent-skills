# Hit@1 fragment: e2020-input-filter-charge-time (space-systems/ecss)
# Two tasks for the leaf. ifct1 routes on the charging window itself, where the
# total filter capacitance has to finish charging before the protection opens;
# ifct2 routes on the net charging current, where the unit's own draw during
# charging comes off the held limiting current first. Both must
# deterministically hit space-systems/ecss/e2020-input-filter-charge-time.
tasks:
  - id: ifct1
    query: "Three capacitor stages sit behind the protection switch on this ECSS load: common mode, differential, plus a 220 uF bulk. Add up what the bus actually sees and prove the whole lot is up to voltage before the limitation window expires."
    intent: "ECSS-E-ST-20-20C clause 5.3.2.3.1; load input filter charge time against the limitation charging window"
    expected_skill: "space-systems/ecss/e2020-input-filter-charge-time"
  - id: ifct2
    query: "Under the ECSS power interface rules: our load draws 120 mA of housekeeping while its input capacitors come up, and the switch holds 0.8 A. What is genuinely left for charging, and how much capacitance would still make the window?"
    intent: "ECSS-E-ST-20-20C clause 5.3.2.3.1; net charging current and the largest supportable input filter capacitance"
    expected_skill: "space-systems/ecss/e2020-input-filter-charge-time"
