# Hit@1 fragment: e1012-bg-scint (space-systems/ecss)
# Case 1 routes on the refractive-index threshold that gates Cerenkov emission in
# the detector window. Case 2 routes on the other emission channel, which has no
# threshold, and on how the charge number rescales it.
tasks:
  - id: e1012-bg-scint-1
    query: "Trapped belt electrons near 1.5 MeV cross the fused silica window of our photomultiplier. Above what kinetic energy does Cerenkov emission switch on at that refractive index, and would an MgF2 window lift the onset clear of the belt population?"
    intent: "ECSS-E-ST-10-12C 10.4.6; the Cerenkov onset condition set by the window refractive index, and what a lower-index window does to which electrons contribute"
    expected_skill: "space-systems/ecss/e1012-bg-scint"
  - id: e1012-bg-scint-2
    query: "Low-energy protons far too slow to radiate Cerenkov light still raise counts in our microchannel plate. How do I get the scintillation yield from the energy they deposit, how does an alpha at the same velocity compare, and what if the dark-count budget was never allocated?"
    intent: "ECSS-E-ST-10-12C 10.4.6; the ionisation-driven scintillation channel is non-zero below the radiation threshold, scales with the square of the charge number, and an unset budget is a missing requirement not a pass"
    expected_skill: "space-systems/ecss/e1012-bg-scint"
