# Hit@1 fragment: e7041-parameter-definition (space-systems/ecss)
# Two tasks for the new leaf. pdef1 routes on the definition itself -
# per-application-process identifier uniqueness and the declared value
# representation; pdef2 routes on deriving the representable domain from width
# and signedness and intersecting it with declared engineering limits. Neither
# may reach the report or set request leaves, which act on values rather than
# definitions. Both must deterministically hit
# space-systems/ecss/e7041-parameter-definition.
tasks:
  - id: pdef1
    query: "two application processes each declare an on-board parameter with the same name, is that a catalogue defect, and what must each parameter definition declare before a report or set request can be written against it"
    intent: "ECSS-E-ST-70-41C clause 6.20.3; parameter identifier unique within its application process, value representation declared"
    expected_skill: "space-systems/ecss/e7041-parameter-definition"
  - id: pdef2
    query: "work out the value domain a sixteen bit signed on-board parameter definition accepts, and what happens when its declared engineering limits sit outside what the width can hold"
    intent: "ECSS-E-ST-70-41C clause 6.20.3; representable domain derived from width and signedness, intersected with engineering limits"
    expected_skill: "space-systems/ecss/e7041-parameter-definition"
