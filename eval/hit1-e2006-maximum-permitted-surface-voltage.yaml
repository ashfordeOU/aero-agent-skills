# Hit@1 fragment: e2006-maximum-permitted-surface-voltage (space-systems/ecss)
# Case 1 routes on which of the two ceilings binds for a given layer thickness, and what thickening buys.
# Case 2 routes on the factor and override applied on top, and on grading the predicted potential against the result.
tasks:
  - id: e2006-maximum-permitted-surface-voltage-1
    query: "The outer polyimide layer on our radiator is 50 microns thick. Is it the dielectric-breakdown-field times that thickness that limits it, or the material family's differential-surface-potential ceiling, and would making the layer thicker buy us any margin at all?"
    intent: "ECSS-E-ST-20-06C 6.2.1; field-derived potential from layer thickness against the critical potential ceiling, and which of the two binds as a reportable design finding"
    expected_skill: "space-systems/ecss/e2006-maximum-permitted-surface-voltage"
  - id: e2006-maximum-permitted-surface-voltage-2
    query: "Once the material ceiling is fixed we divide by a mission safety-factor, and the project also declares its own override which happens to be the larger number. Does that override apply, and how is a predicted worst-case potential sitting just under the permitted value graded?"
    intent: "ECSS-E-ST-20-06C 6.2.1; safety factor and a mission override that can only tighten, then the compliant/marginal/discharge-onset grading of the predicted potential"
    expected_skill: "space-systems/ecss/e2006-maximum-permitted-surface-voltage"
