# Hit@1 fragment: e2008-bare-cell-chip-and-nick-limits (space-systems/ecss)
# Two tasks for the new leaf. bccn1 routes on the position and size allowed for
# a chip at a bare cell edge or corner; bccn2 routes on grading a face nick on
# depth against the wafer thickness. Both must deterministically hit
# space-systems/ecss/e2008-bare-cell-chip-and-nick-limits.
tasks:
  - id: bccn1
    query: "decide whether the chip at the corner of the bare solar cell stays inside the allowed reach and run for that position"
    intent: "ECSS-E-ST-20-08C clause 7.5.1.4.1; bare cell edge and corner chip position and dimension limits"
    expected_skill: "space-systems/ecss/e2008-bare-cell-chip-and-nick-limits"
  - id: bccn2
    query: "grade the nick on the bare cell face for depth against the wafer thickness and clearance from the busbar"
    intent: "ECSS-E-ST-20-08C clause 7.5.1.4.1; bare cell surface nick depth and contact clearance"
    expected_skill: "space-systems/ecss/e2008-bare-cell-chip-and-nick-limits"
