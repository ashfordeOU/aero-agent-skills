# Hit@1 wave-14 fragment: control-surface-sizing (vehicle-design/sizing)
# Two tasks per new leaf; css1 routes on the control power vocabulary
# (aileron-sizing area from the roll-rate-requirement, elevator-sizing
# area from the pitch-moment requirement, rudder-sizing area from the
# yaw-moment requirement, hinge-moment, deflection-limits). css2 is
# adversarial against tail-sizing (tail-volume-coefficient, horizontal
# tail area) and engine-sizing (engine-out yaw moment) but must Hit@1
# vehicle-design/sizing/control-surface-sizing. Both must
# deterministically hit vehicle-design/sizing/control-surface-sizing.
tasks:
  - id: css1
    query: "size the control-surface-sizing for the light twin: compute the aileron-sizing area from the roll-rate-requirement, the elevator-sizing area from the pitch-moment requirement, the rudder-sizing area from the yaw-moment requirement, then estimate the hinge-moment for the actuator and check the deflection-limits"
    intent: "vehicle design; control surface sizing from control power: aileron area from the roll rate requirement, elevator area from the pitch moment requirement, rudder area from the yaw moment requirement, hinge moment for the actuator, deflection limits"
    expected_skill: "vehicle-design/sizing/control-surface-sizing"
  - id: css2
    query: "the tail-volume-coefficient sets the horizontal tail area, but the control-surface-sizing must size the elevator-sizing area from the pitch-moment requirement for rotation and the rudder-sizing area from the yaw-moment requirement for the engine-out case, then verify the aileron roll-rate-requirement and the hinge-moment at the deflection-limits"
    intent: "vehicle design; elevator and rudder area from the pitch and yaw moment requirements with the roll-rate-requirement and hinge-moment checks, adversarial against tail volume coefficient and engine-out vocabulary"
    expected_skill: "vehicle-design/sizing/control-surface-sizing"
