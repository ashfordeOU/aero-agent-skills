# Hit@1 fragment: e5053-reserved-field-zero (space-systems/ecss)
# Two tasks for the new leaf. rfz1 routes on the receiver ignoring the field
# rather than rejecting over it; rfz2 routes on the field being an extension point
# a local use would spend.
# Both must deterministically hit
# space-systems/ecss/e5053-reserved-field-zero.
tasks:
  - id: rfz1
    query: "one supplier's sender writes something other than zero into the reserved octet and our receiver will reject every transfer that carries it; decide which of the two parties broke its obligations and whether refusing delivery over that field can ever be right"
    intent: "ECSS-E-ST-50-53C clause 5.5.4.2; the sender writes zero and the receiver ignores the contents, so a non-zero value is a sender defect and never a reason to discard"
    expected_skill: "space-systems/ecss/e5053-reserved-field-zero"
  - id: rfz2
    query: "somebody wants to park a vendor tag in the reserved octet of our SpaceWire transfer headers because nothing reads it today; say what that does to the sender's obligations and to the spare bits a future extension of the protocol would need"
    intent: "ECSS-E-ST-50-53C clause 5.5.4.2; the reserved field is an extension point kept at zero, local use spends it and collides with a later revision"
    expected_skill: "space-systems/ecss/e5053-reserved-field-zero"
