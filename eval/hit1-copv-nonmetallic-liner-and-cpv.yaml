# Hit@1 fragment: copv-nonmetallic-liner-and-cpv (space-systems/ecss)
# Case 1 routes on fibre rupture damage summed over sustained-pressure phases.
# Case 2 routes on the linerless configuration and its flaw-growth obligation.
tasks:
  - id: copv-nonmetallic-liner-and-cpv-1
    query: "Our COPV has a carbon overwrap over a polymer liner and holds pressure through ground hold, ascent and eight years on orbit at different fibre stress fractions. How do I accumulate stress-rupture damage over those phases and judge the total?"
    intent: "ECSS-E-ST-32C 4.3.4; sustained-load fibre rupture is time dependent, so each hold phase contributes a damage fraction that is summed against an allowable rather than checked as one stress-strength comparison"
    expected_skill: "space-systems/ecss/copv-nonmetallic-liner-and-cpv"
  - id: copv-nonmetallic-liner-and-cpv-2
    query: "We have an all-composite CPV with no liner at all. Does the VDT damage-tolerance route still bind a vessel like that, and what starting flaw size should I assume when our ultrasonic scan resolves no finer than 1.2 mm?"
    intent: "ECSS-E-ST-32C 4.3.4; a linerless vessel is still owed the damage-tolerance demonstration, and the assumed starting flaw may not be smaller than the inspection detection threshold"
    expected_skill: "space-systems/ecss/copv-nonmetallic-liner-and-cpv"
