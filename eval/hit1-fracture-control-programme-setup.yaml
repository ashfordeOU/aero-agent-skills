# Hit@1 fragment: fracture-control-programme-setup (space-systems/ecss)
# Case 1 routes on what actually triggers the programme and what tailoring can add.
# Case 2 routes on board chartering and sub-tier coverage.
tasks:
  - id: fracture-control-programme-setup-1
    query: "Our smallsat inventory has several items whose worst failure is critical but none catastrophic. Is any fracture control programme mandatory at all, and can tailoring still pull a pressurised line and a reaction wheel into scope?"
    intent: "ECSS-E-ST-32C 5.1; only a catastrophic hazard category triggers the programme, while tailoring may still widen the scope of items it covers"
    expected_skill: "space-systems/ecss/fracture-control-programme-setup"
  - id: fracture-control-programme-setup-2
    query: "A sub-tier supplier holds one fracture-critical item and has no board of its own. Which roles must our fracture control board charter name, and what written delegation closes that supplier gap before we can call the programme set up?"
    intent: "ECSS-E-ST-32C 5.1; the board charter is a dedicated document with named mandatory roles, and a sub-tier holder needs its own board or a written delegation upward"
    expected_skill: "space-systems/ecss/fracture-control-programme-setup"
