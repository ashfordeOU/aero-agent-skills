# Hit@1 fragment: e2006-conductive-surface-material-general-rule (space-systems/ecss)
# Case 1 routes on choosing between the two drain paths and which computed potential governs.
# Case 2 routes on inverting the rule into a resistivity ceiling plus the decay-constant grade.
tasks:
  - id: e2006-conductive-surface-material-general-rule-1
    query: "A 50 micron conductive coating over a grounded backing, with the closest grounded edge 200 mm off. Do I take the ohmic drop through the thickness or the lateral rise set by sheet resistance, and which drain path decides the surface potential?"
    intent: "ECSS-E-ST-20-06C 6.3.3.2; thickness helps one path and hurts the other, and the easier path is the one that governs rather than the higher potential"
    expected_skill: "space-systems/ecss/e2006-conductive-surface-material-general-rule"
  - id: e2006-conductive-surface-material-general-rule-2
    query: "I need a resistivity spec for an outer coating, not a pass or fail. Working back from the permitted potential ceiling and the worst-case current density, what maximum bulk resistivity should the material spec carry, and what decay constant does the bleed-off requirement allow?"
    intent: "ECSS-E-ST-20-06C 6.3.3.2; the rule inverts into a resistivity ceiling for the material, and charge must leave in time as well as in amplitude"
    expected_skill: "space-systems/ecss/e2006-conductive-surface-material-general-rule"
