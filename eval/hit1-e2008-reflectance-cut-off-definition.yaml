# Hit@1 fragment: e2008-reflectance-cut-off-definition (space-systems/ecss,
# E-ST-20-08C 8.7.5.3.1). Two tasks per leaf; rcoff1 routes on the level and
# side the edge is taken at, rcoff2 on interpolating that edge out of a
# measured trace. Both must deterministically hit
# space-systems/ecss/e2008-reflectance-cut-off-definition.
tasks:
  - id: rcoff1
    query: "define the coverglass-reflectance-cut-off at half-of-absolute-measured-reflectance and say why the reflectance-band-half-level-basis cannot be a normalised one"
    intent: "ecss photovoltaic assemblies; definition of the cut-off point of a reflectance band"
    expected_skill: "space-systems/ecss/e2008-reflectance-cut-off-definition"
  - id: rcoff2
    query: "do the long-wavelength-band-edge-interpolation on a measured trace and give the coating-band-width-between-half-levels"
    intent: "ecss photovoltaic assemblies; taking the cut-off out of a measured reflectance scan"
    expected_skill: "space-systems/ecss/e2008-reflectance-cut-off-definition"
