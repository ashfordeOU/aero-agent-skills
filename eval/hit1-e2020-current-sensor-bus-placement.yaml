# Hit@1 fragment: e2020-current-sensor-bus-placement (space-systems/ecss)
# Two tasks for the new leaf. csp1 routes on which rail the current sensing
# element of a limiter belongs to; csp2 routes on the trip-current
# consequence of a sensing element that reads only part of the branch.
# Both must deterministically hit
# space-systems/ecss/e2020-current-sensor-bus-placement.
tasks:
  - id: csp1
    query: "the LCL shunt is in the return leg so the sense amplifier sits near ground; does the current sensing element have to be on the energised main bus side of the device"
    intent: "ECSS-E-ST-20-20C clause 5.2.3.3.1; current sensing element on the energised main bus side"
    expected_skill: "space-systems/ecss/e2020-current-sensor-bus-placement"
  - id: csp2
    query: "Our lcl has its sense resistor on the return side, so a short going back through structure never crosses it. How much real branch current must flow before the trip threshold is reached, and does the harness rating cover that?"
    intent: "ECSS-E-ST-20-20C clause 5.2.3.3.1; unsensed fault path and effective trip current"
    expected_skill: "space-systems/ecss/e2020-current-sensor-bus-placement"
