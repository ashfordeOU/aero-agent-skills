# Hit@1 fragment: e2006-exposed-power-system-parts (space-systems/ecss)
# Case 1 routes on the two potentials an exposed element presents and the arcing regime they put it in.
# Case 2 routes on what that regime adds to the family baseline and on bonding proved by measurement rather than declaration.
tasks:
  - id: e2006-exposed-power-system-parts-1
    query: "Our array drive and the slip-ring assembly sit at string potential well outside the panel itself. For each, how do I derive the biggest conductor-to-conductor differential, plus the most negative potential seen by ambient plasma, and which arcing regime does that produce?"
    intent: "ECSS-E-ST-20-06C 7.3; the two independent figures for an exposed power-chain element and the regime derived from inception and sustaining thresholds"
    expected_skill: "space-systems/ecss/e2006-exposed-power-system-parts"
  - id: e2006-exposed-power-system-parts-2
    query: "A conditioning unit chassis on our vehicle is plasma exposed and lands in the sustained-arc band, and its bond to structure is listed in the drawing but no bonding-resistance reading exists. What does that regime add beyond the family baseline, and is a declared bond enough?"
    intent: "ECSS-E-ST-20-06C 7.3; provision set expanded by regime over the family baseline, and bonding verified by measured resistance rather than by a recorded declaration"
    expected_skill: "space-systems/ecss/e2006-exposed-power-system-parts"
