# Hit@1 fragment: e7041-packet-field-type-code-general (space-systems/ecss)
# Two tasks for the new leaf. pftc1 routes on the type-and-format pair deciding
# a width; pftc2 routes on the bit layout and the octet boundary. Both must
# deterministically hit
# space-systems/ecss/e7041-packet-field-type-code-general.
tasks:
  - id: pftc1
    query: "our reader took the second number of each parameter's type-and-format pair as a bit width and everything after the first enumerated field came out shifted; explain how a width is actually obtained for tabulated, arithmetic and deduced kinds"
    intent: "ECSS-E-ST-70-41C clause 7.3.1; the format number is a table index for the integer, real and time types and a size only for the enumerated and string types, so the pair has to be resolved through the rule for its type and an undefined pair refused rather than guessed"
    expected_skill: "space-systems/ecss/e7041-packet-field-type-code-general"
  - id: pftc2
    query: "this parameter structure mixes an enumerated field, a string and a couple of integers, and the size our decoder reports is a few bits off what the widths add up to; derive each width from its type and format numbers and find the discrepancy"
    intent: "ECSS-E-ST-70-41C clause 7.3.1; field offsets accumulate in bits, a structure closes on an octet boundary only when the widths happen to sum to a multiple of eight, and the pad bits to the next boundary are part of the reported layout"
    expected_skill: "space-systems/ecss/e7041-packet-field-type-code-general"
