# Hit@1 fragment: e2008-process-identification-document-requirements
# (space-systems/ecss). Two tasks for the new leaf. to1 routes on the content a
# process identification document has to carry when it describes assembly
# production processes; to2 routes on the control parameter bands and the stated
# process flow inside that document. Both must deterministically hit
# space-systems/ecss/e2008-process-identification-document-requirements.
tasks:
  - id: to1
    query: "review a process identification document that describes how an assembly is produced and work out which sections it never wrote and which process records leave a reader unable to re-run the step"
    intent: "ECSS-E-ST-20-08C Annex F; content expected in a process identification document describing assembly production processes"
    expected_skill: "space-systems/ecss/e2008-process-identification-document-requirements"
  - id: to2
    query: "the production document gives control parameters as bare nominals with no limits and its stated flow positions skip a number, decide whether the document content is acceptable as written"
    intent: "ECSS-E-ST-20-08C Annex F; process record fields, control parameter bands and process flow sequence inside the process identification document"
    expected_skill: "space-systems/ecss/e2008-process-identification-document-requirements"
