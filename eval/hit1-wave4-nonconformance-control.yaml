# Hit@1 wave-4 fragment: nonconformance-control (manufacturing-quality/as9100)
# Two tasks per new leaf; nc1 routes on the MRB disposition decision for a
# nonconforming part (rework, repair, scrap, use as is), nc2 routes on
# rework re-verification and MRB approval requirements. Both must
# deterministically hit manufacturing-quality/as9100/nonconformance-control.
tasks:
  - id: nc1
    query: "disposition the nonconforming part with the material review board and decide between rework, repair, scrap, or use as is"
    intent: "manufacturing quality; MRB disposition decision for nonconforming product"
    expected_skill: "manufacturing-quality/as9100/nonconformance-control"
  - id: nc2
    query: "check whether the reworked part must be re verified and whether the mrb approval is required for the repair disposition"
    intent: "manufacturing quality; rework re-verification and MRB approval requirements"
    expected_skill: "manufacturing-quality/as9100/nonconformance-control"
