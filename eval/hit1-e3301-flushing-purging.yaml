# Hit@1 fragment: e3301-flushing-purging (space-systems/ecss)
# Two tasks for the new leaf. fp1 routes on the volume-exchange sizing and the
# clean-dry-air-is-not-inert trap; fp2 routes on the pump-and-backfill cycle count
# and the ground-phase continuity of the blanket. Both must deterministically hit
# space-systems/ecss/e3301-flushing-purging.
tasks:
  - id: fp1
    query: "the grease in this actuator oxidises in air so we are blanketing it with gas - work out how many enclosure volumes and how long at our flow rate, and whether clean dry air is good enough"
    intent: "ECSS-E-ST-33-01C clause 4.2.6; the well-mixed flush decays one factor of e per volume exchanged, and an oxidation driver rules out air whatever its dew point"
    expected_skill: "space-systems/ecss/e3301-flushing-purging"
  - id: fp2
    query: "we evacuate and refill the housing instead of flowing gas through it - how many pump and backfill cycles to reach the residual target, and does the blanket have to hold through transport and storage too"
    intent: "ECSS-E-ST-33-01C clause 4.2.6; each cycle divides the contaminant by the pressure ratio, and a blanket that lapses between ground phases has protected nothing"
    expected_skill: "space-systems/ecss/e3301-flushing-purging"
