# Hit@1 fragment: e2008-bare-cell-temperature-coefficients (space-systems/ecss)
# Two tasks for the new leaf. bctc1 routes on coefficients measured on the
# irradiated qualification subgroup; bctc2 routes on the least squares fit and
# the sign convention behind each coefficient. Both must deterministically hit
# space-systems/ecss/e2008-bare-cell-temperature-coefficients.
tasks:
  - id: bctc1
    query: "measure the bare solar cell temperature coefficients on the irradiated samples of the qualification subgroup"
    intent: "ECSS-E-ST-20-08C clause 7.5.4; bare solar cell temperature coefficients on the irradiated qualification subgroup"
    expected_skill: "space-systems/ecss/e2008-bare-cell-temperature-coefficients"
  - id: bctc2
    query: "We swept a batch of irradiated cells across a temperature range. I need slopes for current, voltage and peak power from those points, and I want to know which of the three ought to come out negative if the data are sane."
    intent: "ECSS-E-ST-20-08C clause 7.5.4; temperature coefficient least squares fit and bare cell coefficient sign convention"
    expected_skill: "space-systems/ecss/e2008-bare-cell-temperature-coefficients"
