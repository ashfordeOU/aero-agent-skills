# Hit@1 wave-15 fragment: solar-array-sizing (space-systems)
# Two tasks per new leaf skill; both exercise the photovoltaic array sizing
# vocabulary (array-area, eclipse-fraction, cell-efficiency, power-demand,
# packing-factor, solar-irradiance, end-of-life degradation). Task sas2 is
# adversarial: it names the power budget and the RF link budget so it could
# route to power-thermal-budget or communication-link-budget, but must
# Hit@1 this leaf.
tasks:
  - id: sas1
    query: "compute the required array-area for the spacecraft from the bus power-demand, the orbit eclipse-fraction, the solar cell-efficiency, the packing-factor, the solar-irradiance, and the end-of-life degradation over the 10-year mission-life, sizing the photovoltaic array in square meters"
    intent: "space systems; photovoltaic solar array area sizing from power demand, eclipse fraction, cell efficiency, packing factor, and end-of-life degradation"
    expected_skill: "space-systems/subsystems/solar-array-sizing"
  - id: sas2
    query: "check the spacecraft power budget and the photovoltaic panel sizing: compute the array-area and the end-of-life power from the eclipse-fraction, the cell-efficiency, the packing-factor, and the annual degradation rate, then confirm the array can still meet the bus power-demand at end of life without touching the RF link budget"
    intent: "space systems; solar array area and end-of-life power sizing, adversarial against power-thermal-budget (power budget, battery) and communication-link-budget (RF link budget)"
    expected_skill: "space-systems/subsystems/solar-array-sizing"
