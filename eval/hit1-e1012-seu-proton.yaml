    expected_skill: "space-systems/ecss/e1012-seu-proton"
  - id: e1012-seu-proton-2
    query: "Our budget for a 64 Mbit proton-exposed memory is stated in upsets per bit-second. How do I tally the five-year mission count against it, and what MCU rate follows once our measured multiple-cell fraction is applied, if no budget was ever recorded?"
    intent: "ECSS-E-ST-10C 9.4.1.3; the mission tally scales rate by bit count and duration, the multiple-cell rate is a separate derived quantity, and an absent budget record is itself a finding"
    expected_skill: "space-systems/ecss/e1012-seu-proton"
