    query: "Our SRAM datasheet carries separate Weibull cross-section fits, one for direct ionisation and one covering nuclear-reaction secondaries. How do I integrate each over the trapped proton flux spectrum for an SEU rate, and what path efficiency should the nuclear-reaction channel carry?"
