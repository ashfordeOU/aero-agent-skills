# Hit@1 fragment: e3102-qualification-process-selection (space-systems/ecss)
# Two tasks for the new leaf. qps1 routes on the heritage-versus-modification
# routing itself; qps2 routes on the accumulated-minor-changes case that a
# per-change review never catches. Both must deterministically hit
# space-systems/ecss/e3102-qualification-process-selection.
tasks:
