# Hit@1 fragment: q7030-applicability-and-purpose (space-systems/ecss,
# Q-ST-70-30 scope). Two tasks per leaf; wap1 routes on the scope test for the
# method, post and conductor, wap2 on the gas-tight contact count and the
# requirement areas the connection takes on. Both must deterministically hit
# space-systems/ecss/q7030-applicability-and-purpose.
tasks:
  - id: wap1
    query: "settle the wire-wrap-scope-eligibility of this joint: check the wire-wrap-terminal-post-corners and the wire-wrap-solid-conductor-rule and whether the gauge sits in the wire-wrap-covered-gauge-span"
    intent: "ecss wire wrapping; whether a connection is a solderless wrapped connection the standard governs"
    expected_skill: "space-systems/ecss/q7030-applicability-and-purpose"
  - id: wap2
    query: "work out the wire-wrap-gas-tight-contact-count this post and turn count would give and list the wire-wrap-requirement-area-set we take on if it is in scope"
    intent: "ecss wire wrapping; purpose of the wrap and the controls that arrive with scope"
    expected_skill: "space-systems/ecss/q7030-applicability-and-purpose"
