# Hit@1 fragment: analysis-report-and-documentation (space-systems/ecss)
# Case 1 routes on clause 5.2 deliverable completeness and the margin column format.
# Case 2 routes on the clause 5.3.5 leak-before-break report content set and its stated acceptance wording.
tasks:
  - id: analysis-report-and-documentation-1
    query: "Our tank bracket's structural analysis report skips the model description and the methodology section altogether, and its conclusions carry no compliance statement. Before we issue that deliverable, how do I verify the required section set and the margin-of-safety entries are complete?"
    intent: "ECSS-E-ST-32C 5.2; deliverable section completeness plus the factor-versus-margin column convention, not the numeric margin itself"
    expected_skill: "space-systems/ecss/analysis-report-and-documentation"
  - id: analysis-report-and-documentation-2
    query: "We are qualifying a pressurised feed line on the leak-before-break argument and must now hand the supporting documentation to the customer. Which chapters does that document owe, and what must the conclusions state about inspection periodicity and detectable leakage before it is accepted?"
    intent: "ECSS-E-ST-32C 5.3.5; the required LBB documentation set and the explicit acceptance statement, as distinct from performing the LBB demonstration"
    expected_skill: "space-systems/ecss/analysis-report-and-documentation"
