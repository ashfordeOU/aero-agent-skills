# Hit@1 wave-24R fragment: strain-life-fatigue (structures)
# w24r-strain-life-fatigue-1 routes on coffin-manson, reversals to
# failure, low-cycle vs high-cycle against the transition life.
# w24r-strain-life-fatigue-2 routes on neuber local strain plus
# elastic-plastic / ramberg-osgood tokens (never a fatigue notch factor
# endurance claim) and the coffin-manson low-cycle life.
tasks:
  - id: w24r-strain-life-fatigue-1
    query: "run the strain-life fatigue analysis for the notched lug under the fully reversed 0.8 percent strain amplitude: apply the Coffin-Manson curve to find the reversals to failure and classify the point as low-cycle or high-cycle against the transition life"
    intent: "structures; strain-life coffin-manson reversals-to-failure with regime versus transition life"
    expected_skill: "structures/fatigue/strain-life-fatigue"
  - id: w24r-strain-life-fatigue-2
    query: "convert the nominal 200 MPa elastic stress at the kt 2.5 notch into the Neuber local elastic-plastic strain with the cyclic Ramberg-Osgood curve and compute the Coffin-Manson low-cycle life for the representative aluminum alloy"
    intent: "structures; neuber local strain with elastic-plastic ramberg-osgood tokens plus low-cycle fatigue life"
    expected_skill: "structures/fatigue/strain-life-fatigue"
