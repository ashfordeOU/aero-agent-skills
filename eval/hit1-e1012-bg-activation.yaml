# Hit@1 fragment: e1012-bg-activation (space-systems/ecss)
# Case 1 routes on the forward chain flux, cross-section and target atoms through
# cooling to a detector rate. Case 2 routes on build-up versus saturation for two
# species with different half-lives and the summing of their contributions.
tasks:
  - id: e1012-bg-activation-1
    query: "Our detector sees extra counts after each belt pass. Given a reaction cross-section, the proton flux and the target atom count in the tungsten shield, how do I get the count rate once the short irradiation and the cooling interval are accounted for?"
    intent: "ECSS-E-ST-10C 10.4.4; induced activity from flux, cross-section and atom count, then decayed over the cooling interval to a detector count rate"
    expected_skill: "space-systems/ecss/e1012-bg-activation"
  - id: e1012-bg-activation-2
    query: "A tungsten shield breeds two activation products during the belt pass: one whose half-life is far shorter than the pass, one that barely builds. Give me each end-of-irradiation activity against its saturation activity, then roll them into the total activation background the detector actually sees."
    intent: "ECSS-E-ST-10C 10.4.4; build-up against saturation for products whose half-life straddles the irradiation duration, and per-product contributions summed"
    expected_skill: "space-systems/ecss/e1012-bg-activation"
