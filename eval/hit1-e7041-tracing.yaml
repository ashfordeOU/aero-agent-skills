# Hit@1 fragment: e7041-tracing (space-systems/ecss)
# Two tasks for the new leaf. trc1 routes on a trace that holds only the tail of
# a long run; trc2 routes on a trace switched on after the run began and on the
# granularity that decides which events were recordable. Both must
# deterministically hit space-systems/ecss/e7041-tracing.
tasks:
  - id: trc1
    query: "the retrieved execution record for a long on-board procedure only covers its last few steps and the beginning is simply not there, work out what the bounded recording buffer did and whether what survived can be read as a straight sequence"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.8; the OBCP trace is bounded, a drop-oldest policy keeps the end of the run and loses its beginning, and coverage and reconstructability are separate questions"
    expected_skill: "space-systems/ecss/e7041-tracing"
  - id: trc2
    query: "we switched tracing on after the procedure had already begun, and the first record now reads like the run's opening event while the finest events never appear, tell me what the configured granularity admits and whether this trace started mid-run"
    intent: "ECSS-E-ST-70-41C clause 6.18.4.8; tracing is switchable per procedure, switching it on mid-run produces a trace that starts in the middle, and the configured granularity fixes which execution events are recordable at all"
    expected_skill: "space-systems/ecss/e7041-tracing"
