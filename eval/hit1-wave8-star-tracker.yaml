# Hit@1 wave-8 fragment: star-tracker (space-systems/adcs)
# Two tasks per new leaf; star-tracker-w8-1 routes on star
# identification (matching measured centroids to catalog stars within
# the field of view), star-tracker-w8-2 routes on boresight pointing
# accuracy and the lost in space versus tracking mode decision. Both
# must deterministically hit space-systems/adcs/star-tracker.
tasks:
  - id: star-tracker-w8-1
    query: "identify the measured star centroid against the onboard star catalog and keep the matches inside the field of view"
    intent: "ADCS; star identification of measured centroids against the star catalog within the FOV"
    expected_skill: "space-systems/adcs/star-tracker"
  - id: star-tracker-w8-2
    query: "check the boresight pointing accuracy of the star tracker and decide between lost in space and tracking mode"
    intent: "ADCS; boresight pointing accuracy and lost in space versus tracking mode selection"
    expected_skill: "space-systems/adcs/star-tracker"
