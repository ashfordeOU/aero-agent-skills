# Hit@1 fragment: q60-class-3-quality-control-general (space-systems/ecss)
# Two tasks for the leaf. qc60a routes on resolving the post-receipt control
# activities into prerequisite order and pulling in a dependency the profile
# never triggered; qc60b routes on an activity recorded closed ahead of its
# prerequisite and on weighted route completeness. Both must deterministically
# hit space-systems/ecss/q60-class-3-quality-control-general.
tasks:
  - id: qc60a
    query: "a class 3 lot has just been received and the manufacturer screening is incomplete, work out which control activities this lot actually owes once it is in the door and what order they have to run in"
    intent: "ECSS-Q-ST-60C clause 6.5.1; deriving the post-receipt control route from the lot profile and closing it over prerequisites the profile never triggered"
    expected_skill: "space-systems/ecss/q60-class-3-quality-control-general"
  - id: qc60b
    query: "the records show the external visual examination closed before the receiving inspection was signed off and the destructive analysis still open, decide whether this lot can go to stores and how far through its control route it really is"
    intent: "ECSS-Q-ST-60C clause 6.5.1; out-of-order closure detection and weighted route completeness behind the release-to-stores decision"
    expected_skill: "space-systems/ecss/q60-class-3-quality-control-general"
