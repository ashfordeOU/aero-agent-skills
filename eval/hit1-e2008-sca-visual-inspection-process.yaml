# Hit@1 fragment: e2008-sca-visual-inspection-process (space-systems/ecss)
# Two tasks for the new leaf. sip1 routes on the resolution the inspection
# equipment provides against the smallest defect criterion; sip2 routes on the
# viewing approach - off-normal foreshortening and the faces a setup actually
# reaches. Both must deterministically hit
# space-systems/ecss/e2008-sca-visual-inspection-process.
tasks:
  - id: sip1
    query: "check whether the magnification and working distance of the solar cell assembly inspection station resolve the smallest defect the criteria name with enough detection margin"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.2; inspection equipment resolution adequacy"
    expected_skill: "space-systems/ecss/e2008-sca-visual-inspection-process"
  - id: sip2
    query: "work out how much the off normal viewing angle coarsens the camera field of view and pixel sampling limit, and which declared faces of the cell assembly no credited station reaches"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.1.2; viewing approach, foreshortening and face coverage"
    expected_skill: "space-systems/ecss/e2008-sca-visual-inspection-process"
