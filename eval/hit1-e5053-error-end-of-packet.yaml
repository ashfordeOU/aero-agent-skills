# Hit@1 fragment: e5053-error-end-of-packet (space-systems/ecss)
# Two tasks for the new leaf. eep1 routes on discarding the whole partial packet
# and reporting it; eep2 routes on clustering of error terminations across a run.
# Both must deterministically hit
# space-systems/ecss/e5053-error-end-of-packet.
tasks:
  - id: eep1
    query: "the link handed us an error terminator on this transfer and we already have the first half of the CCSDS packet buffered in the receive path - does any of that partial packet reach the user, and how must the discard be reported"
    intent: "ECSS-E-ST-50-53C clause 5.5.4.4; an error-terminated transfer is discarded whole because its extent is unknown, and the discard is reported rather than absorbed silently"
    expected_skill: "space-systems/ecss/e5053-error-end-of-packet"
  - id: eep2
    query: "our receive side is counting error terminated transfers but telemetry just goes quiet and nobody notices, work out what the count should be telling us and whether the errors are clustered or scattered"
    intent: "ECSS-E-ST-50-53C clause 5.5.4.4; the discard must be reported, and consecutive error terminations are a fault in progress rather than independent upsets"
    expected_skill: "space-systems/ecss/e5053-error-end-of-packet"
