# Hit@1 fragment: q7080-powder-reuse-and-blending (space-systems/ecss)
# Two tasks for the new leaf. pr1 routes on the mass-weighted blend composition
# and the worst-case reuse count the cycle limit actually applies to; pr2 routes
# on the characterisation the blend owes before it may be loaded.
# Both must deterministically hit
# space-systems/ecss/q7080-powder-reuse-and-blending.
tasks:
  - id: pr1
    query: "we recovered seventy kilos off the last build and want to top it up with thirty kilos of virgin, work out the oxygen the blend carries and whether topping it up resets the reuse count"
    intent: "ECSS-Q-ST-70-80C powder reuse and blending; mass-weighted oxygen and the worst-case reuse count the cycle limit is applied to, against the mass-weighted one"
    expected_skill: "space-systems/ecss/q7080-powder-reuse-and-blending"
  - id: pr2
    query: "this blended drum of recovered and virgin powder is about to go back on the machine; say what characterisation the blend still owes, whether its oxygen and fines figures pass the reuse limits declared for this powder, and how many more builds it has"
    intent: "ECSS-Q-ST-70-80C; the characterisation cadence and blend triggers, and the reuse count projected one build forward"
    expected_skill: "space-systems/ecss/q7080-powder-reuse-and-blending"
