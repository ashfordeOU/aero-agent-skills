# Hit@1 fragment: e1012-shield-transport (space-systems/ecss)
# Case 1 routes on solver-family and geometry-dimension selection for the transport run.
# Case 2 routes on the per-particle slab physics: proton stopping range and photon buildup.
tasks:
  - id: e1012-shield-transport-1
    query: "Our shield adequacy case rests on a slab bound computed in 1-D, but the avionics box sits beside a harness feedthrough and a corner cut-out. Do I now owe a 3-D deterministic Sn or Monte Carlo transport run, and how is the chosen method recorded in the shielding analysis?"
    intent: "ECSS-E-ST-10-12C 6.2.4; local geometry breaks the one-dimensional bound and forces a higher-dimension solver, with the chosen method family recorded"
    expected_skill: "space-systems/ecss/e1012-shield-transport"
  - id: e1012-shield-transport-2
    query: "Behind four millimetres of aluminium wall, does a 60 MeV proton still reach the die, and for the secondary bremsstrahlung what correction goes on top of exponential attenuation before I set the transmitted dose beside the part total-ionising-dose allowance?"
    intent: "ECSS-E-ST-10-12C 6.2.4; protons are screened by range against areal thickness while photons need a buildup-corrected attenuation before the dose margin is taken"
    expected_skill: "space-systems/ecss/e1012-shield-transport"
