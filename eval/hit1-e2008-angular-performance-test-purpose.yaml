# Hit@1 fragment: e2008-angular-performance-test-purpose (space-systems/ecss,
# E-ST-20-08C 6.4.3.19.1). Two tasks per leaf; aptp1 routes on why the output
# is characterised against sun incidence angle, aptp2 on whether the planned
# sweep reaches the attitude the mission imposes. Both must deterministically
# hit space-systems/ecss/e2008-angular-performance-test-purpose.
tasks:
  - id: aptp1
    query: "state what the solar-array-angular-performance-purpose is for an off-pointing mission and derive the off-pointing-array-power-margin from the sun-incidence-angle-response"
    intent: "ecss photovoltaic assemblies; purpose of characterising assembly output against sun incidence angle"
    expected_skill: "space-systems/ecss/e2008-angular-performance-test-purpose"
  - id: aptp2
    query: "check the angular-test-envelope-coverage reaches the worst-case attitude and that the assembly-cosine-departure-factor is one the projection allows"
    intent: "ecss photovoltaic assemblies; does the planned angular sweep serve the off-pointing power budget"
    expected_skill: "space-systems/ecss/e2008-angular-performance-test-purpose"
