# Hit@1 wave-23 fragment: particle-filter (gnc-autonomy/estimation-filtering)
# Two tasks per new leaf skill. w23-particle-filter-1 routes on bootstrap SIR
# tracking through a nonlinear measurement; w23-particle-filter-2 routes on
# systematic resampling under a bimodal posterior. Both must deterministically
# hit gnc-autonomy/estimation-filtering/particle-filter.
tasks:
  - id: w23-particle-filter-1
    query: "run a bootstrap particle filter to track a maneuvering target through a nonlinear range squared measurement, weight the particles with the Gaussian likelihood, and report the weighted mean and effective sample size at every step"
    intent: "gnc-autonomy; bootstrap SIR particle filter tracking through a nonlinear measurement with importance weights"
    expected_skill: "gnc-autonomy/estimation-filtering/particle-filter"
  - id: w23-particle-filter-2
    query: "estimate the target position with a sequential Monte Carlo particle filter when the measurement likelihood is bimodal, using systematic resampling triggered by the effective sample size below half the particle count"
    intent: "gnc-autonomy; particle filter with systematic resampling on a bimodal non-Gaussian posterior"
    expected_skill: "gnc-autonomy/estimation-filtering/particle-filter"
