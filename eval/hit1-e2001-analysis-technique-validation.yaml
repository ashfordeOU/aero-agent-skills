# Hit@1 fragment: e2001-analysis-technique-validation (space-systems/ecss)
# Case 1 routes on what a heritage claim has to show beyond prior use of the tool. Case 2 routes
# on the correlation route and on a case sitting outside the envelope the evidence reached.
tasks:
  - id: e2001-analysis-technique-validation-1
    query: "We want to submit a predicted multipaction breakdown level as verification evidence. Our heritage argument is that the same solver has been used on three earlier programmes. Is prior tool usage enough, or must each of those runs have been confronted with a test?"
    intent: "ECSS-E-ST-20-01C 5.3.2.4; usage history is not heritage, which requires the same build on a comparable configuration whose hardware was afterwards tested"
    expected_skill: "space-systems/ecss/e2001-analysis-technique-validation"
  - id: e2001-analysis-technique-validation-2
    query: "Our correlation set has four measured breakdown points and every prediction sits inside 1.5 dB. The case we now want to run has a frequency-gap-product well above anything in that set. Does the validation actually reach it?"
    intent: "ECSS-E-ST-20-01C 5.3.2.4; deviations are graded against the declared agreement criterion, and the evidence only validates the region it touched"
    expected_skill: "space-systems/ecss/e2001-analysis-technique-validation"
