# Hit@1 fragment: q60-class-3-microwave-monolithic-circuits (space-systems/ecss,
# Q-ST-60C 6.6.5). Two tasks for the leaf. mmic3a routes on the first three
# phases of the clause - design gain margin, screening pedigree and lot
# traceability; mmic3b routes on the use phase, where the load mismatch feeds
# both the stress on the output stage and the heat in the die. Both must
# deterministically hit
# space-systems/ecss/q60-class-3-microwave-monolithic-circuits.
tasks:
  - id: mmic3a
    query: "take this class 3 monolithic microwave amplifier through the class-3-mmic-phase-chain - the class-3-mmic-gain-margin its function demands, the class-3-mmic-screening-pedigree class 3 can admit and the lot traceability the purchase owes"
    intent: "ECSS-Q-ST-60C clause 6.6.5; class 3 MMIC design, choice and purchase phases, pedigree admissibility and the compensating evidence it obliges"
    expected_skill: "space-systems/ecss/q60-class-3-microwave-monolithic-circuits"
  - id: mmic3b
    query: "The antenna port on our class 3 mmic amplifier can see a 2.5 to 1 standing wave. How much extra voltage stress does the final stage take, how much power comes straight back into the die, and where does the junction temperature land?"
    intent: "ECSS-Q-ST-60C clause 6.6.5; class 3 MMIC use phase, reflection magnitude, squared voltage stress factor and two-stage junction temperature margin"
    expected_skill: "space-systems/ecss/q60-class-3-microwave-monolithic-circuits"
