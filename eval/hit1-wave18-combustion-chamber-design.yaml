# Hit@1 wave-18 fragment: combustion-chamber-design (rocket)
# Two tasks per new leaf; q1 routes on characteristic velocity and chamber sizing,
# q2 routes on thrust coefficient and chamber geometry. Both must
# deterministically hit propulsion/rocket/combustion-chamber-design.
tasks:
  - id: w18-combustion-chamber-design-1
    query: "compute the characteristic-velocity and the required throat-area for the rocket combustion-chamber-design from the chamber-pressure, the propellant mass-flow, and the c-star, then derive the contraction-ratio and the chamber-volume from L-star"
    intent: "rocket chamber sizing: characteristic velocity, throat area, contraction ratio, L-star volume"
    expected_skill: "propulsion/rocket/combustion-chamber-design"
  - id: w18-combustion-chamber-design-2
    query: "estimate the thrust-coefficient and the vacuum-specific-impulse of the rocket combustion-chamber-design from the chamber-pressure and the throat-area, and check the contraction-ratio against the chamber-volume"
    intent: "rocket chamber assessment: thrust coefficient, vacuum specific impulse, chamber volume"
    expected_skill: "propulsion/rocket/combustion-chamber-design"
