# domain-specific adequacy evidence that method then owes. Both must
# deterministically hit
# space-systems/ecss/e2008-assembly-capacitance-measurement-process.
tasks:
  - id: cap1
    query: "we need one accepted method for measuring the solar array string capacitance, frequency domain bridge or time domain discharge, and the evidence that the nominated one holds"
