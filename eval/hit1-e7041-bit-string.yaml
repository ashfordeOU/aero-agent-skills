# Hit@1 fragment: e7041-bit-string (space-systems/ecss)
# Two tasks for the new leaf. bstr1 routes on pad bits in the last octet being
# read as real status flags; bstr2 routes on a variable pattern outgrowing the
# count field that announces it. Both must deterministically hit
# space-systems/ecss/e7041-bit-string.
tasks:
  - id: bstr1
    query: "our decoder reports eight status flags from a five flag word and the last three are permanently inactive, find out where the extra three are coming from"
    intent: "ECSS-E-ST-70-41C clause 7.3.7; a run that is not a whole number of octets is padded at the trailing end to the boundary, the pad carries a fixed value and is not part of the value, so a reader that takes the whole octet invents flags"
    expected_skill: "space-systems/ecss/e7041-bit-string"
  - id: bstr2
    query: "a variable length bit pattern has grown past what the four bit length count in front of it can announce, tell me what the field can still carry and what has to change"
    intent: "ECSS-E-ST-70-41C clause 7.3.7; a variable-length bit field is bounded by what its count field can express rather than by the room left in the packet, and a fixed field is never padded or truncated to fit instead"
    expected_skill: "space-systems/ecss/e7041-bit-string"
