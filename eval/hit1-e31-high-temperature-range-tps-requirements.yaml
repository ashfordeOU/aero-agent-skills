# Hit@1 fragment: e31-high-temperature-range-tps-requirements (space-systems/ecss)
# hot1 routes on recession spending the thickness the bondline then depends on;
# hot2 routes on reuse degradation of the surface optical properties. Both must
# deterministically hit
# space-systems/ecss/e31-high-temperature-range-tps-requirements.
tasks:
  - id: hot1
    query: "the ablator on our aeroshell peaks around 1400 K and recedes during entry - work out whether the bond to the composite substrate survives once the thickness has been eaten"
    intent: "ECSS-E-ST-31 clause 4.2.2; the recession allowance is spent first and the bondline temperature is computed on the residual thickness, against a substrate limit far below the surface limit"
    expected_skill: "space-systems/ecss/e31-high-temperature-range-tps-requirements"
  - id: hot2
    query: "our hot structure tiles are rated for 25 flights and the surface emissivity drops a bit each entry - check the thermal protection sizing still closes on the tenth flight not the first"
    intent: "ECSS-E-ST-31 thermal-protection annex; surface optical properties are walked out over the required reuse cycles and the end-of-life value, not the beginning-of-life one, is the sizing case"
    expected_skill: "space-systems/ecss/e31-high-temperature-range-tps-requirements"
