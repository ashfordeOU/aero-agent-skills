# Hit@1 fragment: e1012-bio-quantities (space-systems/ecss)
# Case 1 routes on the per-particle weighting factors, including the energy-stepped
# neutron schedule, that turn absorbed dose into organ equivalent dose.
# Case 2 routes on the organ-sensitivity table and the remainder group.
tasks:
  - id: e1012-bio-quantities-1
    query: "For a crew dosimetry assessment I have absorbed dose in the red marrow separated by particle: protons, alpha particles, and neutrons binned from 50 keV to 40 MeV. What radiation weighting does each contribution take before the marrow number becomes an equivalent dose in sieverts?"
    intent: "ECSS-E-ST-10C §11.2; the case turns on the per-particle radiation weighting factor, including the energy-stepped neutron schedule, to reach organ equivalent dose"
    expected_skill: "space-systems/ecss/e1012-bio-quantities"
  - id: e1012-bio-quantities-2
    query: "I now have equivalent dose per organ for marrow, colon, lung, thyroid and skin, plus spleen and adrenals which my tissue sensitivity table does not list by name. How do I weight each organ and sum them into one effective dose for the whole body?"
    intent: "ECSS-E-ST-10C §11.2; the case turns on the per-organ sensitivity weighting and the remainder grouping for unlisted organs, not on the per-particle weighting"
    expected_skill: "space-systems/ecss/e1012-bio-quantities"
