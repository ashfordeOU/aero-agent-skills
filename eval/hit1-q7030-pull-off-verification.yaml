# Hit@1 fragment: q7030-pull-off-verification (space-systems/ecss)
# Two tasks for the new leaf. pof1 routes on the destructive sample size and the
# first-article wrap each setup owes; pof2 routes on the minimum unwrap force per
# gauge and the lot disposition. Both must deterministically hit
# space-systems/ecss/q7030-pull-off-verification.
tasks:
  - id: pof1
    query: "size the destructive pull-off sample for this lot of wraps and say whether the second operator owes a first-article wrap of their own"
    intent: "ECSS-Q-ST-70-30C wrapping quality; destructive sampling plan and first-article coverage per operator, tool and gauge setup"
    expected_skill: "space-systems/ecss/q7030-pull-off-verification"
  - id: pof2
    query: "one coupon came off at less force than the gauge is meant to survive - say whether the lot is accepted, held for full re-verification or rewrapped"
    intent: "ECSS-Q-ST-70-30C wrapping quality; minimum unwrap force per conductor gauge, the margin, and the three lot dispositions"
    expected_skill: "space-systems/ecss/q7030-pull-off-verification"
