# Hit@1 fragment: e50-telemetry-in-the-blind (space-systems/ecss)
# Two tasks for the new leaf. tib1 routes on the no-uplink default downlink
# configuration and its arming timeout; tib2 routes on the worst-case low-gain
# link budget that bounds the blind rate. Both must deterministically hit
# space-systems/ecss/e50-telemetry-in-the-blind.
tasks:
  - id: tib1
    query: "if the receiver never hears a command after separation, how long until the spacecraft starts radiating telemetry on its own and will the station be able to lock it without sending anything up first"
    intent: "ECSS-E-ST-50C clause 5.5.4; uplink-loss timeout arming and a default modulation, coding and rate the ground can acquire with no uplink"
    expected_skill: "space-systems/ecss/e50-telemetry-in-the-blind"
  - id: tib2
    query: "close the emergency downlink budget at maximum range on the omni antenna with no pointing gain and tell me the highest bit rate that still leaves margin"
    intent: "ECSS-E-ST-50C clause 5.5.4; worst-case blind link margin on the low-gain antenna and the rate it supports"
    expected_skill: "space-systems/ecss/e50-telemetry-in-the-blind"
