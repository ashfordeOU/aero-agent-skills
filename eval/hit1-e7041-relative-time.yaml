# Hit@1 fragment: e7041-relative-time (space-systems/ecss)
# Two tasks for the new leaf. rlt1 routes on a duration being read as a moment;
# rlt2 routes on the asymmetric signed range and the non-negative fine count. Both
# must deterministically hit space-systems/ecss/e7041-relative-time.
tasks:
  - id: rlt1
    query: "the display shows a twelve second collection interval as a date just after the epoch, work out why an offset field is being read as though it were measured from somewhere"
    intent: "ECSS-E-ST-70-41C clause 7.3.11; a relative time carries a duration and has no epoch, so applying one to it produces a plausible timestamp instead of an interval"
    expected_skill: "space-systems/ecss/e7041-relative-time"
  - id: rlt2
    query: "a negative offset one step past the bottom of the range encodes fine but the one at the top is rejected, and a half second backwards is coming out with a negative fractional count, sort out how a signed duration is meant to be split into its two counts"
    intent: "ECSS-E-ST-70-41C clause 7.3.11; a relative time is a signed two's-complement coarse count whose negative reach is one step longer than its positive one, and the total is floored towards minus infinity so the fine count stays non-negative"
    expected_skill: "space-systems/ecss/e7041-relative-time"
