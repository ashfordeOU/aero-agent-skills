  - id: mmic2b
    query: "our microwave monolithic integrated circuit comes in a non-hermetic plastic package and half its evaluation is carried by similarity to a sibling part; decide whether a moisture barrier is needed and score the wafer lot process monitor evidence behind the die"
    intent: "ECSS-Q-ST-60-13C clause 5.6.5; non-hermetic MMIC moisture barrier and similarity-credited evaluation evidence"
    expected_skill: "space-systems/ecss/q6013-class-2-microwave-integrated-circuits"
