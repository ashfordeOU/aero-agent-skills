# Hit@1 fragment: e2008-bare-cell-cracks-and-fingerprints
# (space-systems/ecss, E-ST-20-08C 7.5.1.4.3)
# Two tasks per leaf; bcf1 routes on the crack half of the clause and the
# bound the examination can support, bcf2 on the fingerprint half and the
# lot rollup. Both must deterministically hit
# space-systems/ecss/e2008-bare-cell-cracks-and-fingerprints.
tasks:
  - id: bcf1
    query: "disposition each cell-crack-indication-disposition on this bare cell against the crack-detection-floor the working distance gives, then make the bare-solar-cell-acceptance call"
    intent: "ecss photovoltaic assemblies; a bare cell carrying crack indications and the acceptance verdict the visual record can support"
    expected_skill: "space-systems/ecss/e2008-bare-cell-cracks-and-fingerprints"
  - id: bcf2
    query: "route the cell-fingerprint-contamination found on a contact area, count the cleaning cycles the cell has left and produce the bare-cell-lot-yield-rollup"
    intent: "ecss photovoltaic assemblies; handling prints on bare cells and the lot yield that follows from dispositioning them"
    expected_skill: "space-systems/ecss/e2008-bare-cell-cracks-and-fingerprints"
