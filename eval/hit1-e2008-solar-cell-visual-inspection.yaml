# the cells of an inspected coupon; scv2 routes on the split between
# occurrences on one cell and the fraction of cells affected. Both must
# deterministically hit space-systems/ecss/e2008-solar-cell-visual-inspection.
tasks:
  - id: scv1
    query: "grade the inspected coupon against the defect quantity limits allowed across its solar cells rather than on how large any one mark is"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.8; solar cell defect quantity limits"
