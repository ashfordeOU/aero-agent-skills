# Hit@1 fragment: e7041-managing-the-packet-stores (space-systems/ecss)
# Two tasks for the new leaf. mps1 routes on the quiescence precondition shared by
# delete, resize, retype and rechannel; mps2 routes on the shared mass memory
# budget and the occupancy floor. Both must deterministically hit
# space-systems/ecss/e7041-managing-the-packet-stores.
tasks:
  - id: mps1
    query: "can I resize a recorder while its storage function is still on, and can I retype one from bounded to circular while it still holds packets, or does each of those need quiescence, an empty store and room left in the memory budget"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.8; every reshape needs the store quiescent and a type change needs it empty as well"
    expected_skill: "space-systems/ecss/e7041-managing-the-packet-stores"
  - id: mps2
    query: "my request to shrink one packet store was refused for exceeding the mass memory budget, and another shrink was refused for being under what the store holds"
    intent: "ECSS-E-ST-70-41C clause 6.15.3.8; the budget check must exclude the store's own current claim and a capacity below occupancy is refused"
    expected_skill: "space-systems/ecss/e7041-managing-the-packet-stores"
