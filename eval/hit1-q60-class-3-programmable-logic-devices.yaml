# Hit@1 fragment: q60-class-3-programmable-logic-devices (space-systems/ecss,
# Q-ST-60C 6.6.4). Two tasks for the leaf. c3pld1 routes on the verification
# set the criticality and the configuration technology together oblige and the
# coverage floors behind it; c3pld2 routes on the maintenance half - design
# data retention and the control a reprogrammable part has to name. Both must
# deterministically hit
# space-systems/ecss/q60-class-3-programmable-logic-devices.
tasks:
  - id: c3pld1
    query: "assemble the pld-verification-objective-set a class 3 FPGA owes from its function criticality and its configuration technology, then grade the measured functional and statement coverage and the pld-timing-closure-margin against their floors"
    intent: "ECSS-Q-ST-60C clause 6.6.4; class-3-programmable-logic-device verification objectives, pld-coverage-floor-margin and timing margin left in the clock period"
    expected_skill: "space-systems/ecss/q60-class-3-programmable-logic-devices"
  - id: c3pld2
    query: "check the pld-design-data-retention covers the mission plus the margin after it and that this flash reprogrammable device names the control procedure for reprogramming it in the field"
    intent: "ECSS-Q-ST-60C clause 6.6.4; class 3 programmable logic maintenance, design data retention window and field reprogramming control"
    expected_skill: "space-systems/ecss/q60-class-3-programmable-logic-devices"
