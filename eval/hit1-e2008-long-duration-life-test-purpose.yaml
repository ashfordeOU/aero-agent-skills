  - id: ldp2
    query: "turn an elevated life test temperature into an arrhenius acceleration factor from the activation energy, convert the planned hours into equivalent service hours, and refuse a temperature above the ceiling where the degradation mechanism changes"
    intent: "ECSS-E-ST-20-08C clause 6.4.3.18.1; acceleration factor and mechanism ceiling behind the life test purpose"
