# Hit@1 fragment: e2008-long-duration-life-test-purpose (space-systems/ecss)
# Two tasks for the leaf. ldp1 routes on the accelerated evidence a long
# duration life test is meant to produce; ldp2 routes on the Arrhenius factor
# and the mechanism ceiling that makes or breaks it. Both must deterministically
# hit space-systems/ecss/e2008-long-duration-life-test-purpose.
tasks:
