# Hit@1 fragment: e20-launch-system-emc-compatibility (space-systems/ecss)
# Case 1 routes on the field computation for one emitter: far-field validity and the attenuation credit while encapsulated.
# Case 2 routes on campaign coverage across phases and on treating an electrostatic source as a provision rather than an emitter.
tasks:
  - id: e20-launch-system-emc-compatibility-1
    query: "The range tracking radar at the pad radiates 2 MW effective power at our vehicle from 600 m while it is still inside the fairing. How do I work out the field reaching the spacecraft, take credit for shroud attenuation, and confirm we are outside the far-field boundary?"
    intent: "ECSS-E-ST-20C 6.3.2.2; free-space field from a launch-site emitter at its separation distance, fairing attenuation while encapsulated, and the far-field validity check"
    expected_skill: "space-systems/ecss/e20-launch-system-emc-compatibility"
  - id: e20-launch-system-emc-compatibility-2
    query: "Our launch campaign EMC assessment covers on-pad standby and liftoff but nothing for payload processing or transfer to the pad, and someone entered a field strength for triboelectric charging. Which prelaunch phases are missing, and how should that electrostatic source be treated?"
    intent: "ECSS-E-ST-20C 6.3.2.2; mandatory prelaunch and launch phase coverage, and routing an electrostatic source to a bonding and dissipation provision rather than a field computation"
    expected_skill: "space-systems/ecss/e20-launch-system-emc-compatibility"
