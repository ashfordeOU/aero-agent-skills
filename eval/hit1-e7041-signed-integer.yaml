# Hit@1 fragment: e7041-signed-integer (space-systems/ecss)
# Two tasks for the new leaf. sint1 routes on a negative value that decodes as a
# large positive because the sign was extended from the wrong width; sint2
# routes on the asymmetric range and the most negative code. Both must
# deterministically hit space-systems/ecss/e7041-signed-integer.
tasks:
  - id: sint1
    query: "a temperature parameter reads 4095 the instant it should go below zero and it is a twelve bit field sitting inside two octets, find out what the decoder is doing wrong"
    intent: "ECSS-E-ST-70-41C clause 7.3.5; negatives are held in two's complement and the decode sign extends from the declared field width, so extending from an octet boundary turns every negative into a large positive"
    expected_skill: "space-systems/ecss/e7041-signed-integer"
  - id: sint2
    query: "our limit check is written as plus or minus the same magnitude on a signed parameter and one end of the range keeps tripping, tell me what the field can actually hold at each end"
    intent: "ECSS-E-ST-70-41C clause 7.3.5; the two's complement range is asymmetric because zero takes a positive-side code, so the floor reaches one further than the ceiling and the floor value has no positive counterpart"
    expected_skill: "space-systems/ecss/e7041-signed-integer"
