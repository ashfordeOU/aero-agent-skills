# Hit@1 fragment: e1012-bio-risk (space-systems/ecss)
# Case 1 routes on turning organ doses into a risk point estimate and which bound is judged.
# Case 2 routes on sorting uncertainty sources into the taxonomy and compounding them.
tasks:
  - id: e1012-bio-risk-1
    query: "Long crewed transit with organ equivalent doses for lung, colon and red marrow only. How do I apply ICRP tissue weighting to reach effective dose, multiply by a risk coefficient to get lifetime excess cancer probability, and is the upper bound or the point estimate judged against the limit?"
    intent: "ECSS-E-ST-10C 11.5; tissue-weighted summation gives the point estimate but the upper bound drives the verdict, and a partial organ set is flagged as incomplete"
    expected_skill: "space-systems/ecss/e1012-bio-risk"
  - id: e1012-bio-risk-2
    query: "Crewed mission dose model carries scatter from detector calibration, from the relative biological effectiveness assumption, and from the geomagnetic cutoff used in the flux run. Which recognised groups do those three belong to, and how do their factors combine into one envelope on the cancer number?"
    intent: "ECSS-E-ST-10C 11.5; each source maps to one of the five recognised categories and the compound factor is the product of the represented category factors"
    expected_skill: "space-systems/ecss/e1012-bio-risk"
