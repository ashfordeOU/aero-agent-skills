# Hit@1 fragment: q7031-surface-verification (space-systems/ecss)
# Two tasks for the new leaf. sv1 routes on the water-break observation and its
# dwell; sv2 routes on the two-sided roughness window and the dew point margin
# that separates a surface failure from a room failure. Both must
# deterministically hit space-systems/ecss/q7031-surface-verification.
tasks:
  - id: sv1
    query: "the operator wetted the panel and called the film unbroken, but the dwell was only a few seconds, so tell me whether that water-break result stands as evidence and what residue, obscuration and roughness the substrate still owes"
    intent: "ECSS-Q-ST-70-31C surface preparation; water-break dwell as the thing that makes the observation evidence, plus residue and particulate obscuration as independent axes"
    expected_skill: "space-systems/ecss/q7031-surface-verification"
  - id: sv2
    query: "the abrasion profile came back well under the roughness window and the substrate sits barely a degree over its dew point, so work out whether this is a surface finding that sends the panel back to re-prepare or a room finding we simply wait out"
    intent: "ECSS-Q-ST-70-31C surface preparation; two-sided roughness window where too smooth also fails, dew-point margin and humidity as an environmental hold rather than a re-preparation"
    expected_skill: "space-systems/ecss/q7031-surface-verification"
