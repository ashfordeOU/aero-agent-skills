# Hit@1 fragment: e2008-visual-inspection-general-criteria (space-systems/ecss)
# Two tasks for the new leaf. vigc1 routes on the admissibility of the supplier
# criteria set (agreed with the customer and documented); vigc2 routes on
# screening observed features against those limits. Both must deterministically
# hit space-systems/ecss/e2008-visual-inspection-general-criteria.
tasks:
  - id: vigc1
    query: "Before screening any coupons I need the visual limit sheet itself to hold up: does every part of the photovoltaic assembly have acceptance numbers written for it, has the customer agreed each one, and can I point at the document?"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.3; supplier criteria set admissibility"
    expected_skill: "space-systems/ecss/e2008-visual-inspection-general-criteria"
  - id: vigc2
    query: "disposition an observed feature as accepted referred to the customer or rejected against the agreed criteria set"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.3; adjudication against agreed acceptance limits"
    expected_skill: "space-systems/ecss/e2008-visual-inspection-general-criteria"
