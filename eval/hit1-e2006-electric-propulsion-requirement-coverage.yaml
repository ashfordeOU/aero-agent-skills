# Hit@1 fragment: e2006-electric-propulsion-requirement-coverage (space-systems/ecss)
# Case 1 routes on which document owns a topic and what a wrong owner costs.
# Case 2 routes on weighted coverage and the verification route a charging topic may take.
tasks:
  - id: e2006-electric-propulsion-requirement-coverage-1
    query: "Our charging document restates thruster specific impulse and propellant feed requirements so that it looks complete. Which standard actually owns those topics, and what goes wrong when a requirement names the wrong owning document?"
    intent: "ECSS-E-ST-20-06C 11.1.2; ownership follows the topic, and a misallocated requirement lands in a document whose verification programme never runs it"
    expected_skill: "space-systems/ecss/e2006-electric-propulsion-requirement-coverage"
  - id: e2006-electric-propulsion-requirement-coverage-2
    query: "We covered four charging topics but not beam neutralization capacity, and one requirement declares verification by similarity on the grounds that the thruster has flown before. How is the coverage ratio weighted, and is similarity acceptable on that topic?"
    intent: "ECSS-E-ST-20-06C 11.1.2; coverage is weighted so a dominant topic cannot be substituted, and similarity is refused where the interaction depends on this host spacecraft"
    expected_skill: "space-systems/ecss/e2006-electric-propulsion-requirement-coverage"
