# Hit@1 fragment: e2008-critical-materials-interface-listing (space-systems/ecss)
# Two tasks for the new leaf. cmi1 routes on the interface data an array parts,
# materials and processes list entry owes once it sits at a critical joint;
# cmi2 routes on the outgassing screening and the anodic-index separation those
# entries pull in. Both must deterministically hit
# space-systems/ecss/e2008-critical-materials-interface-listing.
tasks:
  - id: cmi1
    query: "review the solar array parts materials and processes list for the critical interface data each entry at a cell-to-coverglass or interconnect-to-substrate joint owes"
    intent: "ECSS-E-ST-20-08C clause 4.4; critical interface data inside the array PMP list"
    expected_skill: "space-systems/ecss/e2008-critical-materials-interface-listing"
  - id: cmi2
    query: "screen the bonded non-metallic entries of the array declared materials list for total mass loss and collected volatile fraction and measure the anodic index separation of each metal couple"
    intent: "ECSS-E-ST-20-08C clause 4.4; outgassing and metal-couple data carried by critical PMP list entries"
    expected_skill: "space-systems/ecss/e2008-critical-materials-interface-listing"
