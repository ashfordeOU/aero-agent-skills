# Hit@1 fragment: e5053-ccsds-packet-field (space-systems/ecss)
# Two tasks for the new leaf. cpf1 routes on the declared-length-against-present
# arithmetic of the space packet primary header; cpf2 routes on the rule that the
# field carries one packet, so a second packet sharing the transfer is a defect.
# Both must deterministically hit
# space-systems/ecss/e5053-ccsds-packet-field.
tasks:
  - id: cpf1
    query: "our receiver keeps mis-syncing on the ECSS link, so using the declared length held in the six octets of primary header, work out whether the transfer we handed it carries a complete space packet or one that got cut off"
    intent: "ECSS-E-ST-50-53C clause 5.4.1.7; declared total length from the six-octet primary header against the octets actually present in the CCSDS Packet field"
    expected_skill: "space-systems/ecss/e5053-ccsds-packet-field"
  - id: cpf2
    query: "the sending application wants two space packets crammed into one CCSDS packet field to save overhead on the ECSS SpaceWire link, so tell me whether that is allowed at all and what the surplus tail means for the receiver"
    intent: "ECSS-E-ST-50-53C clause 5.4.1.7; one complete space packet per CCSDS Packet field, a second span or a trailing fragment is a finding"
    expected_skill: "space-systems/ecss/e5053-ccsds-packet-field"
