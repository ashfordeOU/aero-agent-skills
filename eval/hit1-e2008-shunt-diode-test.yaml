# Hit@1 fragment: e2008-shunt-diode-test (space-systems/ecss)
# Two tasks for the new leaf. sdt1 routes on the forward drop measured while
# the protected string is driven in reverse mode; sdt2 routes on grouping a
# part inside the conduction window and catching an open shunt path. Both
# must deterministically hit space-systems/ecss/e2008-shunt-diode-test.
tasks:
  - id: e2008sdt1
    query: "measure the shunt diode forward voltage by driving the protected string in reverse mode and check the drive reached the worst-case string current"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.3.7; shunt diode forward-voltage test through a reverse-mode string drive"
    expected_skill: "space-systems/ecss/e2008-shunt-diode-test"
  - id: e2008sdt2
    query: "which shunt diodes fall outside the conduction window once referred to the reference junction temperature, and is any of them open circuit"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.3.7; shunt diode conduction window and open shunt diode detection"
    expected_skill: "space-systems/ecss/e2008-shunt-diode-test"
