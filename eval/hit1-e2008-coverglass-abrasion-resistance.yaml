# Hit@1 fragment: e2008-coverglass-abrasion-resistance (space-systems/ecss)
# Two tasks for the leaf. car1 routes on the twenty loaded eraser strokes on
# the coated face; car2 routes on the contact pressure and the void-versus-
# failed split a load reading alone hides. Both must deterministically hit
# space-systems/ecss/e2008-coverglass-abrasion-resistance.
tasks:
  - id: car1
    query: "judge an eraser abrasion run that drew twenty loaded strokes across the coated face of a coverglass and read the transmittance and haze change against their ceilings"
    intent: "ECSS-E-ST-20-08C clause 8.7.17; coverglass coated-face eraser abrasion resistance"
    expected_skill: "space-systems/ecss/e2008-coverglass-abrasion-resistance"
  - id: car2
    query: "turn the eraser load and tip diameter into a contact pressure and say whether a worn-flat tip or an off-count stroke run voids the abrasion result rather than failing the coating"
    intent: "ECSS-E-ST-20-08C clause 8.7.17; stroke dose and contact pressure behind the abrasion verdict"
    expected_skill: "space-systems/ecss/e2008-coverglass-abrasion-resistance"
