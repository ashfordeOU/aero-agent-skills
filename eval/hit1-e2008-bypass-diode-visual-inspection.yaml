# Hit@1 fragment: e2008-bypass-diode-visual-inspection (space-systems/ecss)
# Two tasks for the new leaf. bdv1 routes on examining the diode body for
# cracks or separated material; bdv2 routes on the magnification rule that
# separates a clean look from an acceptance. Both must deterministically hit
# space-systems/ecss/e2008-bypass-diode-visual-inspection.
tasks:
  - id: bdv1
    query: "examine each cell bypass diode body for a crack or for body material that has separated and disposition the diode"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.9; bypass diode body crack and separation screen"
    expected_skill: "space-systems/ecss/e2008-bypass-diode-visual-inspection"
  - id: bdv2
