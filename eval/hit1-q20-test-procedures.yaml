# Hit@1 fragment: q20-test-procedures (space-systems/ecss)
# Two tasks for the new leaf. tp1 routes on the approval-and-update control of
# the procedure document itself; tp2 routes on the two-direction coverage of
# the specification requirements and the revision the procedure quotes. Both
# must deterministically hit space-systems/ecss/q20-test-procedures.
tasks:
  - id: tp1
    query: "a test procedure was reissued at the next revision and the product assurance signature is dated a week after it went out, work out whether it was released under change control or edited in place"
    intent: "ECSS-Q-ST-20C clause 5.6.3.1; approval signatures against the issue date and the approved change record a revision advance owes"
    expected_skill: "space-systems/ecss/q20-test-procedures"
  - id: tp2
    query: "reconcile our test procedure set against the test specification and tell me which requirements no step exercises and which steps point at requirements the specification dropped"
    intent: "ECSS-Q-ST-20C clause 5.6.3.1; two-direction requirement coverage across a procedure set and the specification revision the procedures quote"
    expected_skill: "space-systems/ecss/q20-test-procedures"
