# Hit@1 fragment: weld-fracture-control (space-systems/ecss)
# Case 1 routes on the quality class and the imperfection screen.
# Case 2 routes on the safe-life factor and the inspection coverage the class owes.
tasks:
  - id: weld-fracture-control-1
    query: "A full-penetration butt weld in a primary load-carrying member shows a 0.6 mm lack-of-fusion indication. Which weld quality class does the joint take, and must that indication be rejected whatever its measured size?"
    intent: "ECSS-E-ST-32C 8.3; class assignment from criticality and load path, with planar imperfections rejected outright in the upper classes"
    expected_skill: "space-systems/ecss/weld-fracture-control"
  - id: weld-fracture-control-2
    query: "For a cyclically loaded weld, how do I get the safe-life factor from the applied stress-range spectrum against the S-N allowable, and how much of each weld has to be inspected for its class?"
    intent: "ECSS-E-ST-32C 8.3; the safe-life factor from the cycle spectrum and the inspection coverage the assigned class requires"
    expected_skill: "space-systems/ecss/weld-fracture-control"
