# Hit@1 fragment: e2008-dimensions-and-stay-out-zones (space-systems/ecss)
# Two tasks for the new leaf. dsz1 routes on the dimensional tolerance band and
# the governing dimension; dsz2 routes on keep-out intrusion, clearance and the
# standoff footprint. Both must deterministically hit
# space-systems/ecss/e2008-dimensions-and-stay-out-zones.
tasks:
  - id: dsz1
    query: "Inspection handed back measured dimensions for the coupon and the drawing gives a plus and minus limit on each. Which measurements sit outside their limit, and which single dimension is the one that decides the layout?"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.4; coupon dimensional tolerance check"
    expected_skill: "space-systems/ecss/e2008-dimensions-and-stay-out-zones"
  - id: dsz2
    query: "On this photovoltaic coupon a few placed features sit right up against the reserved stay-out zones. Give me the area each one shares with a zone, how deep it reaches in, the tightest gap remaining, and whether the standoffs stay clear."
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.4; keep-out area intrusion and standoff footprint"
    expected_skill: "space-systems/ecss/e2008-dimensions-and-stay-out-zones"
