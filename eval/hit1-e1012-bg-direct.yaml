# Hit@1 fragment: e1012-bg-direct (space-systems/ecss)
# Case 1 routes on turning each population LET into an energy per crossing and
# applying the trigger level. Case 2 routes on the hemisphere factor for an
# omnidirectional flux and on retaining sub-threshold populations.
tasks:
  - id: e1012-bg-direct-1
    query: "For a 300 micron silicon detector on a polar orbit, how do I turn each population linear energy transfer into the energy one crossing dumps in the active volume, and decide which populations actually clear the trigger level?"
    intent: "ECSS-E-ST-10-12C 10.4.2; energy per crossing from LET, density and path length, then a threshold filter that keeps only the populations able to register"
    expected_skill: "space-systems/ecss/e1012-bg-direct"
  - id: e1012-bg-direct-2
    query: "I have omnidirectional fluxes for trapped protons plus heavy ions. Do I multiply flux straight by detector area for the sensor-background rate, and do populations under the detection-threshold simply vanish from the report?"
    intent: "ECSS-E-ST-10-12C 10.4.2; an omnidirectional flux needs the one-sided hemisphere factor before it becomes a hit rate, and sub-threshold contributors stay on record"
    expected_skill: "space-systems/ecss/e1012-bg-direct"
