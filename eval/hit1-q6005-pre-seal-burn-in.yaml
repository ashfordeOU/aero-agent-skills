# equivalent hours, bi2 on interruptions and the drift measured across the
# soak. Both must deterministically hit
# space-systems/ecss/q6005-pre-seal-burn-in.
tasks:
  - id: bi1
    query: "convert an open-package-thermal-soak log into burn-in-arrhenius-equivalent-hours and test each segment against the permitted chamber band"
