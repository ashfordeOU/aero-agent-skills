# Hit@1 fragment: e7041-position-based-schedule-detail-report
# (space-systems/ecss). pbsdet1 routes on packing detail entries into report
# packets without splitting an activity; pbsdet2 routes on an activity whose
# own detail is larger than a packet payload. Both must deterministically hit
# space-systems/ecss/e7041-position-based-schedule-detail-report.
tasks:
  - id: pbsdet1
    query: "size our position based schedule detail report: each scheduled request is a few hundred octets, work out how many report packets we need if one activity can never straddle two packets and how that compares with the payload lower bound"
    intent: "ECSS-E-ST-70-41C clause 6.22.9.2; detail entry sizing from the request content plus entry overhead, order preserving packing into report packets, no-split rule"
    expected_skill: "space-systems/ecss/e7041-position-based-schedule-detail-report"
  - id: pbsdet2
    query: "our position-based schedule owes a detail report, and one activity in it needs more room than a whole telemetry packet; do we split across packets or refuse it, and how do the rest pack once ordered by position"
    intent: "ECSS-E-ST-70-41C clause 6.22.9.2; an oversized schedule detail entry is refused rather than split, packet payload is the packet limit less the report header"
    expected_skill: "space-systems/ecss/e7041-position-based-schedule-detail-report"
