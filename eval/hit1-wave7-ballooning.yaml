# Hit@1 wave-7 fragment: ballooning (manufacturing-quality/as9102)
# Two tasks per new leaf; bal1 routes on drawing characteristic
# ballooning and balloon number assignment per AS9102, bal2 routes on
# the D-list accountability matrix with verification method codes and
# characteristic classifications. Both must deterministically hit
# manufacturing-quality/as9102/ballooning and not first-article-inspection
# or delta-fai siblings.
tasks:
  - id: bal1
    query: "balloon the drawing characteristics and assign sequential balloon numbers for the as9102 first article inspection"
    intent: "manufacturing quality; drawing characteristic ballooning and balloon number assignment per AS9102"
    expected_skill: "manufacturing-quality/as9102/ballooning"
  - id: bal2
    query: "build the d-list accountability matrix with the verification method code and characteristic classification for each balloon number"
    intent: "manufacturing quality; D-list accountability matrix with verification method codes and characteristic classifications"
    expected_skill: "manufacturing-quality/as9102/ballooning"
