  - id: tsr2
    query: "my switching simulation only covers the turn on and it is already taking all night, tell me what the run is missing and how to get the step count down without losing the edge"
    intent: "ECSS-Q-ST-60-12C clause 7.2.4; switch-off is the stressing edge and is a coverage finding, and a step count over budget is answered by local refinement rather than a globally coarser timestep"
    expected_skill: "space-systems/ecss/q6012-transient-simulation-requirements"
