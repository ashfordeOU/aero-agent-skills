# Hit@1 fragment: e1012-see-data (space-systems/ecss)
# Case 1 routes on validating the fitted curve before anything is integrated.
# Case 2 routes on the spectrum integration and the hardness-limit verdict.
tasks:
  - id: e1012-see-data-1
    query: "A heavy-ion run on an SRAM returns a threshold LET, a shape exponent, a width and the saturation cross-section, but the fitter gave that width as negative. May I still integrate the Weibull curve over our mission LET spectrum, or is the fit rejected?"
    intent: "ECSS-E-ST-10C 9.4.2; the four fitted parameters carry physical constraints and a violated one rejects the set before any rate is produced"
    expected_skill: "space-systems/ecss/e1012-see-data"
  - id: e1012-see-data-2
    query: "We hold a fitted cross-section curve and the mission's differential LET spectrum generated by our environment model. How do I obtain the in-orbit upset rate per second, and how is it graded against the hardness limit of the component?"
    intent: "ECSS-E-ST-10C 9.4.2; the rate is the numeric integral of cross-section against the differential spectrum, and the verdict is the ratio of the hardness limit to that rate"
    expected_skill: "space-systems/ecss/e1012-see-data"
