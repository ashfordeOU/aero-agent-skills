# Hit@1 fragment: e7041-suspending-and-resuming-the-file-copy-operations
# (space-systems/ecss). Two tasks for the new leaf. susp1 routes on the
# transition rules and the difference between a redundant and a refused
# directive; susp2 routes on progress surviving the pause. Both must
# deterministically hit
# space-systems/ecss/e7041-suspending-and-resuming-the-file-copy-operations.
tasks:
  - id: susp1
    query: "we need to suspend the whole copy list for a reconfiguration and resume it afterwards, tell me which entries a suspend directive may legally act on, which come back redundant, and which get refused because the operation already completed"
    intent: "ECSS-E-ST-70-41C clause 6.23.5.3; only a running operation can be paused and only a paused one restarted, a finished operation is out of reach of both, and a directive that changes nothing is a different answer from one that names an operation the list does not hold"
    expected_skill: "space-systems/ecss/e7041-suspending-and-resuming-the-file-copy-operations"
  - id: susp2
    query: "a big copy was suspended mid file for a pass, and when the resume directive went in the octets moved read zero again, so work out what a resume has to preserve so the transfer picks up where it stopped"
    intent: "ECSS-E-ST-70-41C clause 6.23.5.3; the octets already moved stay on the entry across a pause so the restart continues at the next octet, and nothing may be moved while the operation is paused"
    expected_skill: "space-systems/ecss/e7041-suspending-and-resuming-the-file-copy-operations"
