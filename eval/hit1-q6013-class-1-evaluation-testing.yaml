  - id: cet2
    query: "our endurance run on this commercial part type needs checking: did it accumulate the device hours required, did each evaluation block hold its minimum sample count, and what failure count was each block permitted"
    intent: "ECSS-Q-ST-60-13C clause 4.2.3.4; endurance device-hours floor, per-block sample floor and admissible failure count in an evaluation campaign"
    expected_skill: "space-systems/ecss/q6013-class-1-evaluation-testing"
