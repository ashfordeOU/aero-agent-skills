# Hit@1 fragment: e2008-full-visual-inspection-process (space-systems/ecss)
# Two tasks for the new leaf. fvip1 routes on grading the examination as it was
# carried out against each detailed inspection requirement; fvip2 routes on the
# magnification a requirement demands and the build stage it is written against.
# Both must deterministically hit
# space-systems/ecss/e2008-full-visual-inspection-process.
tasks:
  - id: fvip1
    query: "The inspector signed off our solar coupon and reported nothing. I do not want the defect count; I want to know whether the examination itself satisfied every detailed requirement written for it before I accept the record."
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.2; examination adequacy per detailed requirement"
    expected_skill: "space-systems/ecss/e2008-full-visual-inspection-process"
  - id: fvip2
    query: "A visual inspection requirement on our photovoltaic coupon calls out features of forty micrometres. What magnification does that oblige the operator to use, and had the build stage the requirement targets actually been completed when the coupon was examined?"
    intent: "ECSS-E-ST-20-08C clause 5.5.3.2.2; demanded magnification and inspection stage coverage"
    expected_skill: "space-systems/ecss/e2008-full-visual-inspection-process"
