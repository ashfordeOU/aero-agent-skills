# Hit@1 wave-5 fragment: skill-evaluation (cross-cutting/sep2640)
# Two tasks per new leaf skill; the queries share vocabulary with the
# cross-cutting pack router and the sibling skill-delivery leaf
# (SEP-2640), so they must deterministically route to
# skill-evaluation, not to skill-delivery.
tasks:
  - id: ske1
    query: "evaluate a delivered skill package for conformance and issue an acceptance verdict"
    intent: "cross-cutting; SEP-2640-style conformance checks and acceptance verdict for a delivered skill"
    expected_skill: "cross-cutting/sep2640/skill-evaluation"
  - id: ske2
    query: "score the quality criteria of a skill and compute its tested versus total coverage ratio"
    intent: "cross-cutting; weighted quality score and coverage ratio for a delivered skill"
    expected_skill: "cross-cutting/sep2640/skill-evaluation"
