# Hit@1 fragment: e7041-managing-directories (space-systems/ecss)
# Two tasks for the new leaf. mdir1 routes on the empty-only delete rule and why
# recursing past it is the defect; mdir2 routes on a move into the target's own
# subtree and the deepest-descendant depth check. Both must deterministically
# hit space-systems/ecss/e7041-managing-directories.
tasks:
  - id: mdir1
    query: "the spacecraft refused my delete on a repository that still holds a file and a sub-repository beneath it; why is a forced recursive delete not on offer, and what counts should the refusal have handed back to the operator"
    intent: "ECSS-E-ST-70-41C clause 6.23.4.5; a sub-repository is deletable only when it holds neither a file nor a sub-repository, because nothing deleted on board is recoverable, and the refusal must state the file and sub-repository counts so the operator knows what the next request is"
    expected_skill: "space-systems/ecss/e7041-managing-directories"
  - id: mdir2
    query: "we want to relocate a whole branch of the on-board directory structure underneath one of its own children, work out why that has to be rejected and what depth check the relocation needs before it is allowed"
    intent: "ECSS-E-ST-70-41C clause 6.23.4.5; moving a repository under a destination inside its own subtree detaches the subtree from the root, and the maximum-depth check must be taken against the deepest descendant carried by the move, not against the repository being moved"
    expected_skill: "space-systems/ecss/e7041-managing-directories"
