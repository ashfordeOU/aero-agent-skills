# Hit@1 wave-23 fragment: reliability-block-diagram (systems-engineering-safety)
# Two tasks per new leaf skill. w23-reliability-block-diagram-1 routes on
# building a block structure and computing mission reliability + MTBF at the
# design life; w23-reliability-block-diagram-2 routes on comparing active
# parallel, 2-of-3 voting and cold standby redundancy arrangements for the
# same component reliability. Both must deterministically hit
# systems-engineering-safety/arp4761a/reliability-block-diagram.
tasks:
  - id: w23-reliability-block-diagram-1
    query: "build the reliability block diagram for the redundant flight control actuation system with two hydraulic actuators in active parallel, each with failure rate 1e-4 per hour, in series with a controller at 5e-5 per hour, and compute the system mission reliability, the per-block reliabilities and the MTBF at the 10 hour design life"
    intent: "systems-engineering-safety; reliability block diagram evaluation of a series-parallel structure: mission reliability, per-block reliabilities and system MTBF at the design life"
    expected_skill: "systems-engineering-safety/arp4761a/reliability-block-diagram"
  - id: w23-reliability-block-diagram-2
    query: "compare active parallel against 2-of-3 voting and cold standby for three identical units with a 1e-4 per hour failure rate at a 100 hour mission: which redundancy arrangement gives the highest mission reliability and MTBF, and how does the redundant pair compare with the single unit"
    intent: "systems-engineering-safety; redundancy arrangement comparison (active parallel, k-out-of-n voting, cold standby) on mission reliability and MTBF for identical components"
    expected_skill: "systems-engineering-safety/arp4761a/reliability-block-diagram"
