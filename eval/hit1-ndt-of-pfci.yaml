# Hit@1 fragment: ndt-of-pfci (space-systems/ecss)
# Case 1 routes on picking a method that bounds the assumed initial crack.
# Case 2 routes on record traceability and the route a found defect takes.
tasks:
  - id: ndt-of-pfci-1
    query: "For a potentially fracture critical forging with a near-surface assumed flaw, how do I choose an inspection method whose smallest detectable crack sits at or under the initial crack we assume for the item, and what do I do when it does not?"
    intent: "ECSS-E-ST-32C; method selection is bounded by detectability against the assumed initial crack, with material and flaw location both compatible"
    expected_skill: "space-systems/ecss/ndt-of-pfci"
  - id: ndt-of-pfci-2
    query: "The inspection turned up an indication below critical size on one item. What must the record carry for the lot, the procedure it was run to and the operator qualification, and what disposition route does the detected defect follow?"
    intent: "ECSS-E-ST-32C with the Q-ST-70-15 interface; traceability fields on the inspection record and the disposition path for a detected defect"
    expected_skill: "space-systems/ecss/ndt-of-pfci"
