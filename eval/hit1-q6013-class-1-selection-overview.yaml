# Hit@1 fragment: q6013-class-1-selection-overview (space-systems/ecss,
# Q-ST-60-13C 4.2.1). Two tasks per leaf; cso1 routes on the two duty
# scopes the framing clause owes, cso2 on the record states and the
# duty-coverage share. Both must deterministically hit
# space-systems/ecss/q6013-class-1-selection-overview.
tasks:
  - id: cso1
    query: "assess the commercial-eee-usage-justification and franchised-procurement-route duties per part against the customer-agreement-record owed once per programme"
    intent: "ecss class 1 commercial eee selection; duties owed per component and per programme, with owner roles"
    expected_skill: "space-systems/ecss/q6013-class-1-selection-overview"
  - id: cso2
    query: "grade each class-1-commercial-component-selection duty record state and return the selection-duty-coverage share and readiness verdict"
    intent: "ecss class 1 commercial eee selection; held, open, rejected or no record at all, rolled to a coverage share"
    expected_skill: "space-systems/ecss/q6013-class-1-selection-overview"
