# Hit@1 fragment: q20-drb (space-systems/ecss)
# Two tasks for the leaf. drb1 routes on board composition and the quorum a
# missing function breaks; drb2 routes on the per-finding disposition that
# separates a hold from a delivery carrying an approved waiver. Both must
# deterministically hit space-systems/ecss/q20-drb, not the general
# nonconformance-disposition leaf.
tasks:
  - id: drb1
    query: "we are convening the board that signs the hardware out of the factory tomorrow; check the attendance list for the functions that must be represented and tell me whether the quality seat is independent enough to stop it"
    intent: "ECSS-Q-ST-20C clause 5.7.3; delivery review board membership, quorum and the independence of the quality seat"
    expected_skill: "space-systems/ecss/q20-drb"
  - id: drb2
    query: "take each open finding and each waiver offered against this delivery to its own disposition and tell me whether the board returns deliver, deliver with reservation or hold, with the minute fields the record owes"
    intent: "ECSS-Q-ST-20C clause 5.7.3; per-finding disposition, waiver validity and the delivery review board record"
    expected_skill: "space-systems/ecss/q20-drb"
