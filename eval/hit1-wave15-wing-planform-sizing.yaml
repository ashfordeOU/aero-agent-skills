# Hit@1 wave-15 fragment: wing-planform-sizing (vehicle-design)
# Two tasks per new leaf skill; both exercise the wing planform sizing
# vocabulary (wing area from wing loading and takeoff gross weight,
# aspect ratio and span, taper ratio and mean aerodynamic chord, sweep
# angle from cruise Mach). Task 2 is adversarial: it could route to
# ws-tw-trade (wing loading vocabulary) or weight-estimation (takeoff
# gross weight vocabulary) but must Hit@1 the planform leaf.
tasks:
  - id: wps1
    query: "size the wing planform for the transport: compute the required wing area by dividing the takeoff gross weight by the wing loading, find the span from the aspect ratio, derive the mean aerodynamic chord from the taper ratio, and select the sweep angle from the cruise Mach"
    intent: "vehicle design; wing planform sizing of wing area, span, mean aerodynamic chord, and sweep angle from the design point"
    expected_skill: "vehicle-design/sizing/wing-planform-sizing"
  - id: wps2
    query: "determine the wing area and the planform dimensions for the 600000 newton takeoff gross weight at a 6000 newton per square meter wing loading: the span for the 9 aspect ratio, the root chord and the mean aerodynamic chord at the 0.3 taper ratio, and the sweep angle needed at the 0.8 cruise Mach"
    intent: "vehicle design; wing area and planform geometry from wing loading and takeoff gross weight, adversarial against ws-tw-trade matching and weight-estimation class-I weights"
    expected_skill: "vehicle-design/sizing/wing-planform-sizing"
