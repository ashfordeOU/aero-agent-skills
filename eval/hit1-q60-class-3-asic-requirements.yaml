# Hit@1 fragment: q60-class-3-asic-requirements (space-systems/ecss, Q-ST-60C
# 6.6.2). Two tasks for the leaf. c3asic1 routes on the referral itself and the
# flight heritage a class 3 reuse claim is weighed on; c3asic2 routes on the
# tailoring the referral carries - which waivers are admissible, who grants
# them and what the residual risk index comes to. Both must deterministically
# hit space-systems/ecss/q60-class-3-asic-requirements.
tasks:
  - id: c3asic1
    query: "say whether the units flown, cumulative hours and environment behind this class 3 ASIC reuse claim let it enter the dedicated standard as a reviewed reuse or send it to a delta or full development"
    intent: "ECSS-Q-ST-60C clause 6.6.2; class-3-asic-referral routing and asic-flight-heritage-sufficiency against the unit, hour and environment floors"
    expected_skill: "space-systems/ecss/q60-class-3-asic-requirements"
  - id: c3asic2
    query: "grade the requested class-3-asic-tailoring-waiver set against the core activities, the justification records and the asic-waiver-approval-authority, and give me the asic-residual-risk-index against the criticality limit"
    intent: "ECSS-Q-ST-60C clause 6.6.2; class 3 ASIC tailoring waivers, approval authority per activity and the weighted residual risk index"
    expected_skill: "space-systems/ecss/q60-class-3-asic-requirements"
