# Hit@1 fragment: e1024-iid-guide (space-systems/ecss)
# Case 1 routes on the register row's type bucket and maturity ladder.
# Case 2 routes on the controlling-document link and what makes a row incomplete at baseline.
tasks:
  - id: e1024-iid-guide-1
    query: "Putting the interface register together for our optical payload ahead of PDR. Every row wants a type and an agreement status. Which type buckets are recognised, and what do proposed, agreed and baselined each mean for a row?"
    intent: "ECSS-E-ST-10-24C Annex D; an interface falls into exactly one of the seven recognised type categories and carries one of three maturity states"
    expected_skill: "space-systems/ecss/e1024-iid-guide"
  - id: e1024-iid-guide-2
    query: "Half our IID rows carry TBD where the governing ICD number should sit, and two rows name nobody on the B side. Is TBD a legitimate state to go to baseline with, or does each row count as a gap in completeness?"
    intent: "ECSS-E-ST-10-24C Annex D; every row must point at a controlling document and name a party per side, so a placeholder reference is a gap rather than a state"
    expected_skill: "space-systems/ecss/e1024-iid-guide"
