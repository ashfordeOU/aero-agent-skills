# Hit@1 fragment: q60-class-1-component-control-plan (space-systems/ecss)
# Two tasks for the leaf. ccp1 routes on the required chapter coverage of a
# prepared plan; ccp2 routes on the maintenance half -- revision currency, the
# update-trigger backlog and the milestone reviews. Both must deterministically
# hit space-systems/ecss/q60-class-1-component-control-plan.
tasks:
  - id: ccp1
    query: "we build to the top reliability class and our component control plan lists every required chapter, but several of them cite no procedure at all; what covered share does that leave us, and can such a plan be called prepared, let alone maintained"
    intent: "ECSS-Q-ST-60C clause 4.1.2.2; required chapter preparation of the class 1 component control plan"
    expected_skill: "space-systems/ecss/q60-class-1-component-control-plan"
  - id: ccp2
    query: "work out how much of its revision interval the current issue of a component control plan has used and which obsolescence notices, alerts and substitution requests never reached it before the design reviews"
    intent: "ECSS-Q-ST-60C clause 4.1.2.2; plan revision currency, update-trigger backlog and milestone review maintenance"
    expected_skill: "space-systems/ecss/q60-class-1-component-control-plan"
