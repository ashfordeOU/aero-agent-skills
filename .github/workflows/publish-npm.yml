name: publish-npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.0'
  workflow_dispatch:
  release:
    types: [published]

# Serialise publishes (2026-09-11). The tag-push and release-published
# triggers BOTH fire for one milestone, so two publish runs raced the
# check-then-publish guard and the loser went red with npm E403 "cannot
# publish over the previously published versions" (run 34602128067). Its
# sibling (34602128683) published the same version one second earlier.
# Queueing instead of racing lets the loser's guard see the version on the
# registry and skip as the designed no-op success.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aero-agent-skills
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sync package version to latest release tag
        run: |
          # FIX 2026-09-06: npm was stuck at 1.3.0 because (1) API-created
          # tags via GITHUB_TOKEN did not fire the tag-push trigger, and
          # (2) package.json version lagged behind the release tags. Derive
          # the version from the newest v*.0 tag and sync package.json so
          # `npm publish` always ships the released version.
          TAG=$(git tag --list 'v[0-9]*.[0-9]*.0' --sort=-v:refname | head -1)
          VER=${TAG#v}
          if [ -z "$VER" ]; then echo "no release tag found"; exit 1; fi
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "Publishing version $VER (from tag $TAG)"
      - name: Install + smoke test
        run: |
          npm install --no-audit --no-fund
          node test/smoke.mjs
      - name: Skip if this version is already on npm
        id: npmcheck
        run: |
          # Idempotency (2026-09-10): re-running the milestone release (or a
          # self-heal of a tag-without-Release) must not turn the workflow red
          # on "cannot publish over the previously published versions". If the
          # version is already on the registry, this is a no-op success.
          VER=$(node -p "require('./package.json').version")
          if npm view "aero-agent-skills@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "npm already has aero-agent-skills@$VER — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "npm does not yet have $VER — will publish"
          fi
      - name: Publish to npm
        if: steps.npmcheck.outputs.already != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
