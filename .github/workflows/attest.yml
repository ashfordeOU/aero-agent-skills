name: attest
on:
  push:
  pull_request:

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML (brief-audit dependency)
        run: python3 -m pip install --user pyyaml
      - name: Harness gates (5/5 REAL, deterministic)
        run: make validate
      - name: Attestation gates (offline, deterministic at rest)
        # FIX 2026-09-10: 'make attest' includes number-snapshot-offline, which
        # reads ops/automation/state/ — the export DELIBERATELY excludes that
        # dir (internal ops state), so on the public tree the gate failed with
        # "no snapshot exists" and every public commit went red. Same dev-only
        # situation as the negative-control suite below: run the full attest
        # when the snapshot state is present (dev tree), otherwise run the
        # attestation gates that ARE valid at rest on a public export.
        run: |
          if [ -d ops/automation/state ]; then
            make attest
          else
            echo "public export: ops/automation/state absent (dev-only snapshot state)"
            echo "running the public-valid attestation gates: brief-audit + content-policy-sweep"
            make brief-audit
            make content-policy-sweep
          fi
      - name: Visuals fresh (charts + README numbers regenerate to zero diff)
        run: make visuals-check
      - name: Negative-control regression suite (N1-N7, G1-G6; dev-only)
        # ops/automation/test/ is dev-only and is NOT shipped in the
        # public package (runbook section 3a). Run it when present,
        # skip with a note when absent so public CI stays green.
        run: |
          if [ -f ops/automation/test/run-tests.sh ]; then
            bash ops/automation/test/run-tests.sh
          else
            echo "dev-only negative-control suite not shipped; skipped"
          fi
