name: attest
on:
  push:
  pull_request:

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML (brief-audit dependency)
        run: python3 -m pip install --user pyyaml
      - name: Harness gates (5/5 REAL, deterministic)
        run: make validate
      - name: Attestation gates (offline, deterministic at rest)
        # FIX 2026-09-10: 'make attest' includes number-snapshot-offline, which
        # reads ops/automation/state/ — the export DELIBERATELY excludes that
        # dir (internal ops state), so on the public tree the gate failed with
        # "no snapshot exists" and every public commit went red. So: run the
        # full attest when the snapshot state is present (dev tree),
        # otherwise run the attestation gates that ARE valid at rest on a
        # public export. This is a genuine dev-only condition -- unlike the
        # negative-control battery below, which ships and runs on both
        # trees as of 2026-09-19.
        run: |
          if [ -d ops/automation/state ]; then
            make attest
          else
            echo "public export: ops/automation/state absent (dev-only snapshot state)"
            echo "running the public-valid attestation gates: brief-audit + content-policy-sweep"
            make brief-audit
            make content-policy-sweep
          fi
      - name: Visuals fresh (charts + README numbers regenerate to zero diff)
        run: make visuals-check
      - name: Negative-control battery (every gate must be able to return red)
        # FIX 2026-09-19: this step used to guard on
        # ops/automation/test/run-tests.sh, a path that has never existed in
        # this repository (0 files tracked under it), so it printed
        # "skipped" on every run and CI had never once shown that a gate can
        # fail -- the one thing this harness claims.
        #
        # The suite is tools/negative_controls/, which DOES ship in the
        # public export (replaying the export pathspec yields 126 tools/
        # files, 5 of them this suite). Its absence is therefore a real
        # fault, not a public-tree condition, so this fails rather than
        # skipping. The runner exits non-zero if any gate is unproven, void,
        # orphaned, or has no control at all, so it cannot pass by grading
        # nothing.
        run: |
          if [ ! -f tools/negative_controls/run_negative_controls.py ]; then
            echo "::error::negative-control suite absent: the gates cannot be shown red-capable"
            exit 1
          fi
          python3 tools/negative_controls/run_negative_controls.py
