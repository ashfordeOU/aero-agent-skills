name: release-on-milestone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-on-milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if a 100-skill release milestone was crossed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LEAVES=$(python3 -c "import json; print(json.load(open('docs/metrics.json'))['leaves'])")
          echo "leaves=$LEAVES"
          echo "leaves=$LEAVES" >> "$GITHUB_OUTPUT"
          # Release convention (founder 2026-09-03): every 100 new skills =
          # one minor version bump. v1.0.0 = 1-100 ... v1.6.0 = 601-700.
          #
          # FIX 2026-09-03: waves can jump past a boundary in one push (393 ->
          # 404). Find the LOWEST band whose boundary the count has REACHED
          # and that is not yet RELEASED, so skipped bands get released one at
          # a time instead of never.
          #
          # FIX 2026-09-10 (founder: "release cuts at every 100 automatic"):
          # the old test was TAG-existence, so a tag pushed without a Release
          # (v1.6.0) looked "done" and could never self-heal. The test is now
          # RELEASE-existence, and the tag is created only when actually
          # missing.
          #
          # FIX 2026-09-10 (b): v1.0.0 is the PRE-CONVENTION launch tag (330
          # leaves). It is not a 100-skill milestone and must never be
          # auto-cut here — its draft release made gh release view fail, so
          # the loop picked it and published it. Milestones start at v1.1.0.
          #
          # NOTE: gh release view cannot see DRAFT releases, so a draft at a
          # milestone tag reads as "missing" and gets published — that is the
          # intended behaviour (a staged draft is meant to go out).
          SHOULD="false"
          NEXT_TAG=""
          NEED_TAG="false"
          MINOR=$(( (LEAVES - 1) / 100 ))
          for m in $(seq 1 "$MINOR"); do
            TAG="v1.${m}.0"
            BOUNDARY=$(( (m + 1) * 100 ))
            [ "$LEAVES" -ge "$BOUNDARY" ] || continue
            HAVE_TAG="false"; HAVE_REL="false"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 && HAVE_TAG="true"
            gh release view "$TAG" >/dev/null 2>&1 && HAVE_REL="true"
            if [ "$HAVE_REL" = "false" ]; then
              SHOULD="true"
              NEXT_TAG="$TAG"
              [ "$HAVE_TAG" = "false" ] && NEED_TAG="true"
              break
            fi
          done
          echo "band_minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "need_tag=$NEED_TAG" >> "$GITHUB_OUTPUT"
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          echo "last_tag=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last release tag: $LAST"
          if [ "$SHOULD" = "true" ]; then
            echo "Milestone $NEXT_TAG due (leaves=$LEAVES; tag present=$([ "$NEED_TAG" = "false" ] && echo yes || echo no))."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No missing milestone release through v1.${MINOR}.0."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.next_tag }}
          LEAVES: ${{ steps.check.outputs.leaves }}
          NEED_TAG: ${{ steps.check.outputs.need_tag }}
        run: |
          BODY=$(cat <<'EOF'
          ## Aero Agent Skills — {{TAG}}

          {{LEAVES}} verified aerospace engineering skills, standards-mapped (ECSS · DO-178C · NASA · ARP4754A), behavior-tested, router-asserted.

          **Packages in this release:**
          - npm CLI + MCP server: `aero-agent-skills`
          - Claude Code plugin + agentskills.io format skills
          - JetBrains Marketplace plugin (com.ashforde.aeroskills)
          - GitHub public repo with attest CI (validate 6/6 · attest 3/3)

          Install: `npx skills add ashfordeOU/aero-agent-skills`
          EOF
          )
          BODY=${BODY//"{{TAG}}"/$TAG}
          BODY=${BODY//"{{LEAVES}}"/$LEAVES}
          if [ "$NEED_TAG" = "true" ]; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed new tag $TAG"
          else
            echo "Tag $TAG already exists — (re)cutting the missing Release only"
          fi
          # gh release create publishes the Release; publish-npm.yml has a
          # `release: [published]` trigger, so npm fires from this alone. The
          # old explicit `gh workflow run publish-npm.yml` dispatch 403'd
          # ("Resource not accessible by integration") because the workflow
          # GITHUB_TOKEN cannot dispatch workflows — dropped as redundant.
          gh release create "$TAG" --title "Aero Agent Skills $TAG" --notes "$BODY" --latest
          echo "Released $TAG at $LEAVES leaves"
