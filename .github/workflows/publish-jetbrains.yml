name: publish-jetbrains

on:
  push:
    tags:
      - 'jb-v*'
  workflow_dispatch:

jobs:
  publish-jetbrains:
    name: Build + publish Aero Agent Skills JetBrains plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jetbrains-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags for the version sync below
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Sync plugin version to latest release tag
        run: |
          # FIX 2026-09-13: build.gradle.kts carries the IN-PROGRESS band
          # number (release-law bumps it the moment a band opens), so the
          # marketplace was being handed versions that never shipped as a
          # release - 1.9.0 published while releases topped out at 1.8.0,
          # and 1.13.0 was next in line with npm still at 1.12.0. Derive
          # the version from the newest v*.*.0 tag, exactly as
          # publish-npm.yml does, so all three channels agree.
          TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          VER=${TAG#v}
          if [ -z "$VER" ]; then echo '::error::no release tag found'; exit 1; fi
          perl -pi -e 's/^version = ".*"/version = "'"$VER"'"/' build.gradle.kts
          echo "Publishing plugin version $VER (from tag $TAG)"
          grep -n '^version' build.gradle.kts
      - name: Generate catalog from live tree
        run: python3 ../../scripts/gen_jetbrains_catalog.py
      - name: Sync storefront description to the shipped catalog
        run: |
          # FIX 2026-09-13: the Marketplace page description is overwritten
          # from build.gradle.kts on every publish, so the hardcoded "330+
          # verified skills" was being faithfully republished while the
          # catalog in the same plugin held 1439, and it named 8 of the 12
          # families. Derive both from the catalog.json generated one step
          # above so the storefront and the in-IDE browser cannot disagree.
          python3 ../../scripts/test_sync_jetbrains_description.py 2>&1 | tail -3
          python3 ../../scripts/sync_jetbrains_description.py
          grep -n 'verified skills' build.gradle.kts
      - name: Build plugin
        run: ./gradlew buildPlugin --no-build-cache
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: aero-agent-skills-jetbrains
          path: packages/jetbrains-plugin/build/distributions/*.zip
      - name: Publish to JetBrains Marketplace
        run: |
          set +e
          ./gradlew publishPlugin --no-build-cache 2>&1 | tee /tmp/jb_publish.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            # Distinguish "version exists" (already uploaded, e.g. re-run of a tag)
            # from a genuine failure. ONLY skip when the marketplace confirms it.
            if grep -qiE "already contains version|version .* already|HTTP.*409|conflict|HTTP.*422" /tmp/jb_publish.log; then
              echo "::warning::Version already on marketplace — treating as success (re-run idempotent)"
            else
              cat /tmp/jb_publish.log
              exit $RC
            fi
          fi
        env:
          # Signing is OPTIONAL: when the cert secrets are absent, the plugin
          # uploads unsigned (listing exists — plugin id com.ashforde.aeroskills).
          # Add the secrets to get the JetBrains "Verified" badge.
          PLUGIN_CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PLUGIN_PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
