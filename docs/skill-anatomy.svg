<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470">
  <style>
    .mono { font-family: "JetBrains Mono", "IBM Plex Mono", "Menlo", monospace; }
    .cond { font-family: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif; font-weight: 700; text-transform: uppercase; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>
<rect width="1500" height="470" fill="#f6f7fc"/>
<text class="cond" x="48.0" y="56.0" text-anchor="start" font-size="30" fill="#151a33" letter-spacing="2">ANATOMY OF A SKILL</text>
<text class="mono" x="48.0" y="80.0" text-anchor="start" font-size="11" fill="#5a6289" letter-spacing="1">skills/avionics/do178c/planning/ — one leaf, four load-bearing parts</text>
<rect x="48" y="110" width="340" height="62" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
<rect x="48" y="110" width="6" height="62" fill="#0891b2"/>
<text class="mono" x="70.0" y="147.0" text-anchor="start" font-size="12.5" fill="#151a33" letter-spacing="1">SKILL.md · FRONTMATTER</text>
<line x1="392" y1="141" x2="432" y2="141" stroke="#151a33" stroke-width="1.3"/>
<path d="M 440 141 l -9 -4.5 v 9 Z" fill="#151a33"/>
<text class="mono" x="456.0" y="136.0" text-anchor="start" font-size="11.5" fill="#5a6289">name + trigger description — the ONLY part the router reads.</text>
<text class="mono" x="456.0" y="154.0" text-anchor="start" font-size="11.5" fill="#5a6289">Loaded on demand: no context cost until the task matches.</text>
<rect x="48" y="192" width="340" height="62" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="48" y="192" width="6" height="62" fill="#7c3aed"/>
<text class="mono" x="70.0" y="229.0" text-anchor="start" font-size="12.5" fill="#151a33" letter-spacing="1">SKILL.md · BODY</text>
<line x1="392" y1="223" x2="432" y2="223" stroke="#151a33" stroke-width="1.3"/>
<path d="M 440 223 l -9 -4.5 v 9 Z" fill="#151a33"/>
<text class="mono" x="456.0" y="218.0" text-anchor="start" font-size="11.5" fill="#5a6289">the workflow the agent follows: steps, standards references,</text>
<text class="mono" x="456.0" y="236.0" text-anchor="start" font-size="11.5" fill="#5a6289">pitfalls, verification gates, and the human sign-off stop.</text>
<rect x="48" y="274" width="340" height="62" fill="#ffffff" stroke="#db2777" stroke-width="1.8"/>
<rect x="48" y="274" width="6" height="62" fill="#db2777"/>
<text class="mono" x="70.0" y="311.0" text-anchor="start" font-size="12.5" fill="#151a33" letter-spacing="1">scripts/test_*.py</text>
<line x1="392" y1="305" x2="432" y2="305" stroke="#151a33" stroke-width="1.3"/>
<path d="M 440 305 l -9 -4.5 v 9 Z" fill="#151a33"/>
<text class="mono" x="456.0" y="300.0" text-anchor="start" font-size="11.5" fill="#5a6289">behavior contract, plain stdlib unittest — gate 3 replays it</text>
<text class="mono" x="456.0" y="318.0" text-anchor="start" font-size="11.5" fill="#5a6289">offline and asserts the skill's decisions (e.g. DAL A-E).</text>
<rect x="48" y="356" width="340" height="62" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
<rect x="48" y="356" width="6" height="62" fill="#ea580c"/>
<text class="mono" x="70.0" y="393.0" text-anchor="start" font-size="12.5" fill="#151a33" letter-spacing="1">eval corpus tasks</text>
<line x1="392" y1="387" x2="432" y2="387" stroke="#151a33" stroke-width="1.3"/>
<path d="M 440 387 l -9 -4.5 v 9 Z" fill="#151a33"/>
<text class="mono" x="456.0" y="382.0" text-anchor="start" font-size="11.5" fill="#5a6289">Hit@1 assertions — gate 5 proves the deterministic router</text>
<text class="mono" x="456.0" y="400.0" text-anchor="start" font-size="11.5" fill="#5a6289">selects this skill for its trigger queries.</text>
<text class="mono" x="48.0" y="444.0" text-anchor="start" font-size="10.5" fill="#5a6289" letter-spacing="2">PLAIN FILES ON THE OPEN AGENTSKILLS.IO FORMAT · ANY SKILL.MD HOST CAN LOAD THEM</text>
</svg>
